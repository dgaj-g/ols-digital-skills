:root{--ink:#2b1d1a;--mute:#6f5d55;--line:#ecdccb;--bg:#fbf1e4;--card:#fffaf3;--plum:#4a1f45;--berry:#8f2d56;--ember:#c2462e;--amber:#e88a3a;--gold:#f2b544;
  --navy:var(--plum);--ok:#1b7f3b;--bad:#b3261e;--tint:#fdf1e3;--okbg:#e6f4e4;--badbg:#fbe6e1;--peach:#fdebdc;
  --acc:#e88a3a;--acc2:#f2b544;--accd:#9a5200;
  --sans:-apple-system,"Segoe UI",Calibri,Arial,sans-serif;--disp:"Fraunces",Georgia,"Times New Roman",serif;
  --lift:0 1px 0 rgba(255,255,255,.8) inset,0 10px 26px -14px rgba(122,37,82,.32),0 2px 6px -2px rgba(90,40,20,.10);
  --ease:cubic-bezier(.2,.7,.2,1)}
/* a colour for each stage: 1 amber (data), 2 coral (images), 3 violet (sound), 4 teal (portability) */
[data-hue="1"]{--acc:#e88a3a;--acc2:#f2b544;--accd:#9a5200}[data-hue="2"]{--acc:#e0574c;--acc2:#f28a6b;--accd:#a8322a}
[data-hue="3"]{--acc:#9a4fc4;--acc2:#d07ab8;--accd:#6c2d8f}[data-hue="4"]{--acc:#1f9e8f;--acc2:#6cc3a0;--accd:#0f6e63}
/* the question card and figure take the stage's colour from the stage bar above them (kept apart: a browser without :has drops only these) */
.app:has(.stagebar[data-hue="1"]){--acc:#e88a3a;--acc2:#f2b544;--accd:#9a5200}
.app:has(.stagebar[data-hue="2"]){--acc:#e0574c;--acc2:#f28a6b;--accd:#a8322a}
.app:has(.stagebar[data-hue="3"]){--acc:#9a4fc4;--acc2:#d07ab8;--accd:#6c2d8f}
.app:has(.stagebar[data-hue="4"]){--acc:#1f9e8f;--acc2:#6cc3a0;--accd:#0f6e63}
*{box-sizing:border-box}
html,body{margin:0;background:#f1dfca}
body{font:15px/1.45 var(--sans);color:var(--ink);background:radial-gradient(1200px 700px at 10% -10%,#ffd9b8 0,transparent 60%),radial-gradient(1000px 800px at 110% 110%,#f5c2c7 0,transparent 55%),#f1dfca}
.app{width:min(1280px,100%);height:100vh;margin:0 auto;display:flex;flex-direction:column;overflow:hidden;position:relative;isolation:isolate;
  background:radial-gradient(rgba(143,45,86,.07) 1px,transparent 1.4px) 0 0/22px 22px,linear-gradient(180deg,#fdf5ea 0,#fbeedd 100%);box-shadow:0 0 0 1px rgba(143,45,86,.08),0 30px 80px -30px rgba(74,31,69,.35)}
/* the warm light that drifts slowly behind the page (atmosphere, never an attention beat) */
.app::before{content:"";position:absolute;inset:-25%;z-index:-1;pointer-events:none;
  background:radial-gradient(38% 30% at 18% 22%,rgba(255,196,140,.55),transparent 70%),radial-gradient(34% 30% at 86% 30%,rgba(247,170,170,.40),transparent 70%),radial-gradient(40% 34% at 60% 92%,rgba(242,181,68,.30),transparent 70%);
  animation:drift 38s ease-in-out infinite alternate}
@keyframes drift{from{transform:translate3d(-2%,-1%,0) rotate(0deg)}to{transform:translate3d(2%,2%,0) rotate(4deg)}}
header.bar{height:52px;color:#fff;display:flex;align-items:center;padding:0 20px;gap:14px;flex:none;position:relative;overflow:hidden;
  background:linear-gradient(100deg,#2e1236 0%,#4f1a46 34%,#7a2150 62%,#8e2a3f 100%);box-shadow:0 6px 20px -10px rgba(74,31,69,.6)}
header.bar::before{content:"";position:absolute;inset:0;pointer-events:none;background-size:140% 100%;background-repeat:no-repeat;background-image:radial-gradient(220px 90px at 65.7% 120%,rgba(242,160,70,.55),transparent 70%),radial-gradient(160px 70px at 35.7% -40%,rgba(232,120,90,.35),transparent 70%);
  animation:glowdrift 22s ease-in-out infinite alternate}
header.bar::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:linear-gradient(90deg,#f2b544,#e88a3a 35%,#e0574c 65%,#9a4fc4);opacity:.95}
@keyframes glowdrift{from{background-position:30% 0}to{background-position:70% 0}} /* the glow drifts inside the bar: its image is wider than the bar, so no edge shows and nothing spills */
header.bar>*{position:relative}
header.bar .title{font-family:var(--disp);font-weight:700;font-size:19px;letter-spacing:.005em}
header.bar .crumb{font-size:14px;color:#ffe6d2}header.bar .crumb a{color:#fff3e8;text-decoration:underline;text-decoration-color:rgba(255,220,190,.6);text-underline-offset:3px;cursor:pointer}
header.bar .crumb a:hover{text-decoration-color:#f2b544}
header.bar .who{margin-left:auto;font-size:14px;color:#fff3e8}header.bar .staff{color:#fff;opacity:.9;font-size:13px;text-decoration:underline;text-underline-offset:3px;cursor:pointer;margin-left:16px}
.stagebar{flex:none;background:#fffaf3;background:linear-gradient(90deg,color-mix(in srgb,var(--acc) 14%,#fffaf3),#fffaf3 60%);border-bottom:1px solid var(--line);padding:10px 26px 0}
.stagebar .t{font-size:14px;color:var(--mute)}.stagebar .t b{color:var(--accd)}
.stagebar .line{height:5px;background:#f1e3d3;margin:8px -26px 0}
.stagebar .line i{display:block;height:100%;background:linear-gradient(90deg,var(--acc2),var(--acc));border-radius:0 99px 99px 0;box-shadow:0 0 10px rgba(232,138,58,.45);box-shadow:0 0 12px color-mix(in srgb,var(--acc) 60%,transparent);transition:width .3s;animation:glide .8s var(--ease) both}
@keyframes glide{from{width:var(--from,0%)}}
.work{overflow:auto;padding:22px 26px 60px;flex:1}
.cols{display:grid;grid-template-columns:400px 1fr;gap:22px;align-items:start}
h1{font-family:var(--disp);font-weight:700;font-size:30px;line-height:1.15;margin:0 0 6px;color:var(--plum);letter-spacing:-.005em}
h1::after{content:"";display:block;width:72px;height:4px;border-radius:99px;margin:10px 0 4px;background:linear-gradient(90deg,#f2b544,#e88a3a,#e0574c,#9a4fc4);transform-origin:left;animation:rule .9s .15s var(--ease) both}
@keyframes rule{from{transform:scaleX(0)}}
h2{font-family:var(--disp);font-weight:600;font-size:21px;margin:0 0 10px;color:var(--plum)}.sub{color:var(--mute);margin:0 0 18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px 22px;margin-bottom:16px;box-shadow:var(--lift)}
.card.tight{padding:14px 18px}
.btn{display:inline-block;background:linear-gradient(135deg,#8f2d56 0%,#b23a3c 55%,#c2462e 100%);color:#fff;border:0;border-radius:10px;padding:10px 18px;font:inherit;font-weight:700;cursor:pointer;
  box-shadow:0 6px 16px -8px rgba(178,58,60,.8),0 1px 0 rgba(255,255,255,.25) inset;transition:transform .15s var(--ease),box-shadow .2s,filter .2s}
.btn:hover:not(:disabled){transform:translateY(-1px);filter:brightness(1.06);box-shadow:0 10px 20px -8px rgba(178,58,60,.85),0 1px 0 rgba(255,255,255,.25) inset}
.btn:active:not(:disabled){transform:translateY(0)}
.btn:disabled{background:#eadcd0;color:#6f5d55;box-shadow:none;cursor:default}
.btn.ghost{background:transparent;color:var(--berry);border:1.5px solid var(--berry);box-shadow:none}.btn.sm{padding:6px 12px;font-size:13px}
/* Check lights once when every part is answered: one beat, never a loop */
#check:enabled{animation:lights 1.4s var(--ease) 1}

<script>

        return '<div class="trow"><span class="tn">1.' + (i + 1) + '</span><b>' + h(name) + '</b>' + st + '</div>';
      }).join("");
      var body = T.el('<div>' + bar() + '<div class="card"><div class="srow">' + clsPick() + '</div><h2>' + h(r.className) + '</h2><p class="hint">' + X.topicsNote + '</p><div class="tlist">' + rows + '</div></div></div>');
      page(body); wireCommon(body);
      body.querySelectorAll("[data-t]").forEach(function (b) { b.onclick = function () { b.disabled = true; T.call("apiStaff", { op: "setTopic", cls: CLS, topic: b.dataset.t, open: !on[b.dataset.t] }).then(topics).catch(fail); }; });
    }).catch(fail);
  }
  // ---- Rounds ----
  function rounds() {
    T.call("apiStaff", { op: "rounds", cls: CLS }).then(function (r) {
      var pup = r.pupils.map(function (p, k) { return '<option value="' + k + '">' + h(p.name) + ' \u00b7 ' + S.round + p.round + '</option>'; }).join("");
      var body = T.el('<div>' + bar() + '<div class="card"><div class="srow">' + clsPick() + '</div><h2>' + T.fmt(X.roundOpen, { n: r.round }) + '</h2><div class="actions"><button class="btn" id="oc">' + T.fmt(X.openClass, { n: r.round + 1 }) + '</button></div></div><div class="card">' + (r.pupils.length ? '<div class="srow"><select id="pp">' + pup + '</select><button class="btn sm ghost" id="op"></button></div>' : '<p class="sub" style="margin:0">' + W.noPupils + '</p>') + '</div><span class="link" id="clr">' + W.clearMine + '</span></div>');
      page(body); wireCommon(body);
      var pp = document.getElementById("pp"), op = document.getElementById("op");
      function label() { if (op) op.textContent = T.fmt(X.openPupil, { n: r.pupils[+pp.value].round + 1 }); }
      if (pp) { pp.onchange = label; label(); }
      T.wire("oc", function () { this.disabled = true; T.call("apiStaff", { op: "openClass", cls: CLS }).then(function (x) { T.toast(T.fmt(W.opened, { n: x.round })); rounds(); }).catch(fail); });
      T.wire("op", function () { var p = r.pupils[+pp.value]; op.disabled = true; T.call("apiStaff", { op: "openPupil", cls: CLS, email: p.email }).then(function (x) { T.toast(T.fmt(W.opened, { n: x.round })); rounds(); }, function () { op.disabled = false; }); });
      T.wire("clr", function () {
        var x = document.getElementById("clr");
        if (!armed) { armed = true; x.textContent = T.fmt(W.clearConfirm, { name: r.className }); return; }
        armed = false; T.call("apiStaff", { op: "clearMe", cls: CLS }).then(function () { T.toast(W.cleared); rounds(); }).catch(fail);
      });
    }).catch(fail);
  }
  // ---- Tracker ----
  function roundPick(max) { var o = ""; for (var k = 1; k <= max; k++) o += '<option' + (k === ROUND ? ' selected' : '') + '>' + k + '</option>'; return '<label for="rp">' + W.round + '</label><select id="rp">' + o + '</select>'; }
  function seen(iso) { if (!iso) return '\u2014'; var d = new Date(iso); return d.toLocaleDateString("en-GB", { day: "numeric", month: "short" }) + ' ' + ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2); }
  function tracker() {
    T.call("apiStaff", { op: "tracker", cls: CLS, round: ROUND || undefined }).then(function (r) {
      ROUND = r.round;
      var title = function (n) { return r.stages[n - 1].title; };
      var rows = r.rows.map(function (p, k) {
        var cells = r.stages.map(function (st) {
          var c = p.s[st.n], e = c.e;
          if (!c.a && !e) return '<td>\u2014</td>';
          return '<td>' + c.m + '/' + c.x + (c.a < c.n ? '<br><small>' + T.fmt(W.notDone, { a: c.a, n: c.n }) + '</small>' : '') + (e ? '<br><span class="chip blue">' + W.rating + e.rating + '</span>' : '') + (e && e.stageNote ? '<br><small>' + h(e.stageNote) + '</small>' : '') + c.flags.map(function (f) { return '<br><span class="chip">' + h(f) + '</span>'; }).join("") + '</td>';
        }).join("");
        var E = p.E, fl = [];
        r.stages.forEach(function (st) { fl = fl.concat(p.s[st.n].fl); });
        return '<tr><td><span class="link" data-p="' + k + '">' + h(p.name) + '</span></td>' + cells + '<td>' + (E ? W.rating + E.rating + (E.unsure.length ? '<br>' + W.unsure + E.unsure.map(function (u) { return h(u ? title(u) : S.fine); }).join(", ") : '') + (E.note ? '<br><small>' + h(E.note) + '</small>' : '') : '\u2014') + '</td><td>' + (fl.length ? h(fl.join(", ")) : '\u2014') + '</td><td>' + seen(p.seen) + '</td></tr>';
      }).join("");
      var body = T.el('<div>' + bar() + '<div class="srow">' + clsPick() + roundPick(r.maxRound) + '</div><h1>Tracker \u00b7 ' + h(r.className) + ' \u00b7 Digital Data \u00b7 ' + S.round + r.round + '</h1><div class="card">' + (r.rows.length ? '<table class="track"><tr><th>' + W.pupil + '</th>' + r.stages.map(function (st) { return '<th>' + h(st.title) + '</th>'; }).join("") + '<th>' + W.topic + '</th><th>' + W.flagged + '</th><th>' + W.seen + '</th></tr>' + rows + '</table>' : '<p class="sub" style="margin:0">' + W.noPupils + '</p>') + '</div><div id="drawer"></div></div>');
      page(body); wireCommon(body);
      var rp = document.getElementById("rp"); rp.onchange = function () { ROUND = +rp.value; tracker(); };
      body.querySelectorAll("[data-p]").forEach(function (x) { x.onclick = function () { drawer(r.rows[+x.dataset.p]); }; });
    }).catch(fail);
  }
  function drawer(p) {
    T.call("apiStaff", { op: "pupil", cls: CLS, email: p.email, round: ROUND }).then(function (r) {
      var d = document.getElementById("drawer"); if (!d) return;
      d.innerHTML = '<div class="card drawer"><h2>' + h(r.name) + ' \u00b7 ' + S.round + r.round + '</h2>' + r.items.map(function (it) { return '<div class="it"><b>Stage ' + it.st + ' \u00b7 ' + h(it.src) + '</b> \u00b7 ' + it.m + '/' + it.max + (it.f ? ' <span class="chip">' + S.flag + '</span>' : '') + (it.text ? '<div class="w">' + h(it.text) + '</div>' : '') + '</div>'; }).join("") + '<div class="actions"><button class="btn sm ghost" id="shut">' + W.close + '</button></div></div>';
      T.wire("shut", function () { d.innerHTML = ""; }); d.scrollIntoView({ block: "start" });
    }).catch(fail);
  }
  // ---- Export ----
  function exporter() {
    T.call("apiStaff", { op: "tracker", cls: CLS, round: ROUND || undefined }).then(function (r) {
      ROUND = r.round;
      var body = T.el('<div>' + bar() + '<div class="card"><div class="srow">' + clsPick() + roundPick(r.maxRound) + '</div><div class="actions"><button class="btn" id="csv">' + X.csv + '</button></div></div></div>');
      page(body); wireCommon(body);
      var rp = document.getElementById("rp"); rp.onchange = function () { ROUND = +rp.value; };
      T.wire("csv", function () {
        var b = document.getElementById("csv"); b.disabled = true;
        T.call("apiStaff", { op: "csv", cls: CLS, round: ROUND }).then(function (x) {
          b.disabled = false;
          var blob = new Blob(["\ufeff" + x.csv], { type: "text/csv;charset=utf-8" }), a = document.createElement("a");
          a.href = URL.createObjectURL(blob); a.download = x.filename; document.body.appendChild(a); a.click();
          setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
        }, function () { b.disabled = false; });
      });
    }).catch(fail);
  }
  return { start: start, flags: [X.flagHigh, X.flagLow] };
})();

</script>
<script>
/* sit.js \u2014 the scripted sit (G2 on the harness, G4 on the live /dev link). Runs only with ?sit=1 for the owner (or the
 * harness's dev user). It clears the owner's own record in the class, then plays all four stages through the page itself
 * (tiles, boxes, lists, toggles, Check, Next) with SitPolicy's answers, flags every 7th question, reloads mid-stage, saves
 * every card, checks the summary, restores all 82 marked questions, tries a repeat mark, and opens round 2 for itself.
 * The report is a <pre id="sitReport"> (SIT PASS/FAIL lines, MARKS, a MARKS# hash the gate recomputes in node). */
var Sit = (function () {
  var T, S = S1S.S, lines = [], fails = 0, errors = [];
  function ok(name, good, detail) { if (!good) fails++; lines.push("SIT " + (good ? "PASS " : "FAIL ") + name + (detail ? " \u00b7 " + detail : "")); paint(); }
  function paint() {
    var p = document.getElementById("sitReport");
    if (!p) { p = document.createElement("pre"); p.id = "sitReport"; p.style.cssText = "position:fixed;right:8px;top:60px;z-index:9;max-width:520px;max-height:70vh;overflow:auto;background:#fff;border:2px solid #1A3A6B;padding:8px;font:12px/1.35 ui-monospace,Menlo,monospace;white-space:pre-wrap;margin:0"; document.body.appendChild(p); }
    p.textContent = lines.join("\n");
  }
  function wait(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
  function until(fn, ms, what) {
    var t0 = Date.now(); ms = ms || 30000;
    return new Promise(function (res, rej) { (function go() { var v; try { v = fn(); } catch (e) { v = false; } if (v) return res(v); if (Date.now() - t0 > ms) return rej(new Error("timeout: " + (what || ""))); setTimeout(go, 60); })(); });
  }
  function $(sel) { return document.querySelector(sel); }
  function all(sel) { return [].slice.call(document.querySelectorAll(sel)); }
  function cur() { return T.cur(); }
  function set(x, v) { x.value = v; x.dispatchEvent(new Event("input", { bubbles: true })); x.dispatchEvent(new Event("change", { bubbles: true })); }
  function tile(part, text) { var t = all('.opts[data-part="' + part + '"] .opt').filter(function (o) { return o.dataset.t === text; })[0]; if (t) t.click(); return !!t; }
  function layout(where) { // nothing spills sideways and nothing is cut off
    var bad = [], work = $("#work");
    if (work && work.scrollWidth > work.clientWidth + 1) bad.push("work scrolls sideways");
    all("header.bar, .stagebar, .card, .opt, .figure, .items .item, .pairs .pr, .choose .ch, .gapsent, .scheme, .wrote, .actions, .sumrows .r, .row, .figure td, .figure th, .ticks label, .item label, .opt span, .tog, .btn, .qtext, .lead").forEach(function (e) {
      if (e.clientWidth && e.scrollWidth > e.clientWidth + 1) bad.push((e.className || e.tagName) + " " + e.scrollWidth + ">" + e.clientWidth);
    });
    all("select").forEach(function (x) { // the chosen words must show whole in the closed list
      if (!x.value || !x.clientWidth) return; var cs = getComputedStyle(x), cv = layout.cv || (layout.cv = document.createElement("canvas").getContext("2d"));
      cv.font = cs.fontWeight + " " + cs.fontSize + " " + cs.fontFamily;
      if (cv.measureText(x.options[x.selectedIndex].text).width + parseFloat(cs.paddingLeft) + parseFloat(cs.paddingRight) + 18 <= x.clientWidth) return;
      var said = x.parentNode.querySelector(".said"); // on a phone the chosen words may show whole in the line under the list instead
      if (said && said.clientWidth && said.textContent === x.options[x.selectedIndex].text && said.scrollWidth <= said.clientWidth + 1) return;
      bad.push("list text cut off: " + x.value.slice(0, 30));
    });
    if (document.documentElement.scrollWidth > window.innerWidth + 1) bad.push("page scrolls sideways");
    if (document.documentElement.scrollHeight > window.innerHeight + 1) bad.push("the frame scrolls");
    if (bad.length) ok("layout " + where, false, bad.slice(0, 3).join("; "));
    return !bad.length;
  }
  function rendered(v) { // every part the question asks about is on screen
    var miss = [], qt = $("#qcard > .qtext");
    if (v.q && !(qt && qt.textContent === v.q)) miss.push("wording");
    if (v.figure && !($(".figure table") && $(".figure table").offsetHeight)) miss.push("figure");
    if (v.form === "pairs") { var sels = all("select[data-k]"); if (sels.length !== v.left.length) miss.push("pairs"); sels.forEach(function (s) { if (s.options.length !== v.right.length + 1) miss.push("spare"); }); }
    if (v.form === "gaps" && all("[data-k]").length !== v.gapCount) miss.push("gaps");
    if (v.form === "type") v.items.forEach(function (it, k) { if (it.label && !all(".item label")[k]) miss.push("label " + k); });
    if (v.form === "choose" && all(".ch").length !== v.items.length) miss.push("choose");
    if ((v.form === "pick1" || v.form === "pickN") && all('.opts[data-part=""] .opt').length !== v.options.length) miss.push("tiles");
    return miss;
  }
  var MARKS = {}, FLAGS = [], G = 0, reloaded = false, email, n;
  function answerOne() { // fills the question on screen the way a pupil would, then presses Check (or I don't know)
    var c = cur(), v = c.v, a = SitPolicy.answer(v, email + "|" + n), miss = rendered(v);
    if (miss.length) ok("rendered " + c.qid, false, miss.join(","));
    layout("before " + c.qid);
    if (v.form === "pick1" || v.form === "pickN") a.picks.forEach(function (p) { tile("", p); });
    if (v.form === "writepick") {
      if (a.skipped) $("#skipW").click(); else { set($("#wtext"), a.text); $("#wdone").click(); }
      a.parts.forEach(function (p, k) { p.picks.forEach(function (t) { tile(k, t); }); });
    }
    if (v.form === "type") { if (a.idk) { $("#idk").click(); return; } all("input[data-k]").forEach(function (x, k) { set(x, a.texts[k]); }); }
    if (v.form === "pairs") all("select[data-k]").forEach(function (x, k) { set(x, a.map[k]); });
    if (v.form === "choose") all(".ch").forEach(function (ch, k) { var b = [].filter.call(ch.querySelectorAll(".tog"), function (t) { return t.dataset.t === a.choices[k]; })[0]; if (b) b.click(); });
    if (v.form === "gaps") all("[data-k]").forEach(function (x, k) { set(x, a.fills[k]); });
    var chk = $("#check");
    if (chk.disabled) ok("check enabled " + c.qid, false, v.form);
    chk.click();
  }
  function playStage(st) {
    var b = $('button[data-st="' + st + '"]');
    ok("stage " + st + " button", b && b.textContent === S.start, b && b.textContent);
    b.click();
    return until(function () { return cur().screen === "question" && cur().st === st; }, 30000, "stage " + st).then(function loop() {
      if (cur().screen !== "question") return;
      var c = cur(); G++;
      answerOne();
      return until(function () { return $("#after .result") && cur().r; }, 45000, "marks " + c.qid).then(function () {
        var r = cur().r; MARKS[c.qid] = r.marks;
        var want = T.fmt(S.got, { m: r.marks, x: r.max, w: r.max === 1 ? S.mark : S.marks });
        if ($("#after .result").textContent !== want) ok("result line " + c.qid, false, $("#after .result").textContent);
        if (!$(".scheme li")) ok("scheme " + c.qid, false, "no mark scheme lines");
        layout("after " + c.qid);
        var flag = G % SitPolicy.flagEvery === 0 ? (function () {
          $("#flag").click(); FLAGS.push(c.qid);
          return until(function () { return T.me().topic.rounds[n].s[st].f.some(function (x) { return x.id === c.qid; }); }, 30000, "flag " + c.qid);
        })() : Promise.resolve();
        return flag.then(function () {
          if (st === 2 && c.i === 4 && !reloaded) { // a reload in the middle of a stage: Carry on lands on question 6
            reloaded = true;
            return T.reboot().then(function () {
              T.topic(); var b2 = $('button[data-st="2"]');
              ok("reload shows Carry on", b2 && b2.textContent === S.carry, b2 && b2.textContent);
              b2.click();
              return until(function () { return cur().screen === "question"; }, 30000, "reload").then(function () {
                ok("reload lands on question 6", cur().i === 5 && /Question 6 of/.test($(".stagebar .t").textContent), $(".stagebar .t").textContent);
                return loop();
              });
            });
          }
          $("#next").click();
          return loop();
        });
      });
    }).then(function () {
      ok("stage " + st + " card", cur().screen === "stagecard", cur().screen);
      layout("stage card " + st);
      $("#save").click(); // no rating yet: the card must refuse
      ok("stage card needs a rating", $("#err").textContent === S.rateErr && cur().screen === "stagecard");
      var rating = 1 + SitPolicy.h32(email + "|" + st) % 4;
      $('.rate .opt[data-r="' + rating + '"]').click();
      var tick = $('.ticks input[type=checkbox]'); if (tick) tick.click();
      set($("#conf"), "sit run " + st);
      $("#save").click();
      return until(function () { return cur().screen === (st < 4 ? "topic" : "topiccard"); }, 30000, "card " + st);
    });
  }
  function run(t) {
    T = t; window.addEventListener("error", function (e) { errors.push(String(e.message)); });
    window.addEventListener("unhandledrejection", function (e) { errors.push("promise: " + String(e.reason && (e.reason.code || e.reason.message) || e.reason)); });
    ok("started", true, T.boot.build);
    var me = T.me(); email = me.email;
    var fresh = me.topic.round === 1 && Object.keys(me.topic.rounds).every(function (k) { var r = me.topic.rounds[k]; return Object.keys(r.s).every(function (s) { return !r.s[s].a && !r.s[s].e; }); });
    (fresh ? Promise.resolve() : T.call("apiStaff", { op: "clearMe", cls: T.boot.cls }).then(T.reboot)).then(function () {
      me = T.me(); n = me.topic.round;
      ok("fresh record", n === 1 && !me.needName, "round " + n);
      T.home(); layout("home");
      ok("home line", (($(".topic .foot span") || {}).textContent || "") === S.round + "1 \u00b7 not started", ($(".topic .foot span") || {}).textContent);
      $("#openLive").click(); layout("topic");
      return [1, 2, 3, 4].reduce(function (p, st) { return p.then(function () { return playStage(st); }); }, Promise.resolve());
    }).then(function () {
      layout("topic card");
      $('.rate .opt[data-r="2"]').click(); $('input[data-u="0"]').click(); set($("#note"), "sit run");
      $("#save").click();
      return until(function () { return cur().screen === "summary"; }, 30000, "summary");
    }).then(function () {
      var tot = 0, qs = Object.keys(MARKS); qs.forEach(function (k) { tot += MARKS[k]; });
      var x = me.topic.stages.reduce(function (s, st) { return s + st.x; }, 0);
      ok("82 questions answered", qs.length === 82, qs.length);
      ok("summary total", $(".card h2").textContent === T.fmt(S.scored, { m: tot, x: x, p: Math.round(100 * tot / x) }), $(".card h2").textContent);
      ok("summary flagged", all(".sumrows .link[data-id]").length === FLAGS.length, all(".sumrows .link[data-id]").length + " of " + FLAGS.length);
      layout("summary");
      lines.push("TOTAL " + tot + " of " + x);
      // every marked question comes back after a reload
      return T.reboot().then(function () {
        var bad = [], seen = 0;
        return [1, 2, 3, 4].reduce(function (p, st) { return p.then(function () { return T.loadStage(n, st).then(function (D) {
          D.order.forEach(function (qid, i) { T.question(st, i, true, n); seen++; var r = $("#after .result"); if (!r || cur().r.marks !== MARKS[qid]) bad.push(qid); });
        }); }); }, Promise.resolve()).then(function () {
          ok("all marked questions restore", seen === 82 && !bad.length, seen + " seen" + (bad.length ? ", wrong " + bad.slice(0, 4).join(",") : ""));
          T.home();
          ok("home line done", $(".topic .foot span").textContent === S.round + "1 \u00b7 done \u00b7 " + tot + " of " + x + " marks", $(".topic .foot span").textContent);
          return tot;
        });
      });
    }).then(function (tot) { // first answer wins
      var D = T.cache()[n + "|1"], qid = D.order[0], v = D.views[0];
      return T.call("apiMark", { round: n, qid: qid, answer: SitPolicy.answer(v, "another pupil") }).then(function (r) {
        ok("repeat mark keeps the first", r.repeat === true && r.r.marks === MARKS[qid], "repeat " + r.repeat + " \u00b7 " + r.r.marks + " vs " + MARKS[qid]);
        return T.call("apiStaff", { op: "openPupil", cls: T.boot.cls, email: email });
      }).then(function (x) {
        ok("teacher opens round 2", x.round === 2, x.round);
        return T.reboot();
      }).then(function () {
        var m2 = T.me();
        var r1 = [1, 2, 3, 4].reduce(function (s, st) { return s + m2.topic.rounds[1].s[st].m; }, 0);
        ok("round 1 kept", r1 === tot, r1 + " vs " + tot);
        ok("round 2 current", m2.topic.round === 2);
        T.home();
        ok("home line round 2", $(".topic .foot span").textContent === S.round + "2 open \u00b7 not started", $(".topic .foot span").textContent);
        return T.loadStage(2, 1).then(function (D2) { ok("round 2 new order", D2.order.join() !== D.order.join()); T.topic(); layout("topic round 2"); });
      });
    }).catch(function (e) { ok("run", false, e && (e.code || e.message)); }).then(function () {
      ok("no page errors", !errors.length, errors.slice(0, 3).join(" | "));
      var ms = Object.keys(MARKS).sort().map(function (k) { return k + ":" + MARKS[k]; }).join(",");
      lines.push("MARKS " + ms);
      lines.push("MARKS# " + SitPolicy.h32(ms).toString(16) + " \u00b7 " + Object.keys(MARKS).length + " questions \u00b7 flags " + FLAGS.length);
      lines.push("SIT RESULT " + (fails ? "FAIL (" + fails + ")" : "PASS"));
      paint(); window.__SIT = { done: true, pass: !fails, lines: lines.slice() };
    });
  }
  return { run: run };
})();

</script>
