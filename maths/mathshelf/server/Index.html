      if (read < 0 || read > 180) { flash(T.protractorMaxRange); return; }
      var res = protractorMark(q, read);
      var att = { read: read, dur: Math.round((Date.now() - t0) / 1000), res: res.ok ? 'OK' : 'X@1' };
      if (res.dx) att.dx = res.dx;
      rec.att.push(att);
      if (res.ok || rec.att.length >= 2) rec.lock = true;
      finish(att);
      hooks.onSave(q.id, rec);
    }
    checkBtn.addEventListener('click', runCheck);

    if (rec.lock && rec.att.length) { window.GJ.setState(wrap, 'question', 'locked-restore'); finish(rec.att[rec.att.length - 1], true); }
    else composer.focus();   // ready to type the measurement without a second tap
    return { qid: q.id };
  }

  /* \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550 mount \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550 */
  function mount(host, q, savedRec, hooks) {
    if (q.kind === 'classify') return mountClassify(host, q, savedRec, hooks);
    if (q.kind === 'protractor') return mountProtractor(host, q, savedRec, hooks);
    var actId = hooks.actId;
    var isAngles = actId === 'angles';
    var rec = savedRec || { att: [], lock: false, ovr: null };
    if (!rec.att) rec.att = [];
    var t0 = Math.floor(Date.now() / 1000);

    var wrap = el('div', 'jotter-q');
    wrap.id = 'jq-' + q.id;
    tagQuestionRoot(wrap, q, hooks);
    var margin = el('div', 'jq-margin', 'Q' + hooks.number);
    margin.setAttribute('data-mark', '');
    var body = el('div', 'jq-body');
    body.setAttribute('data-work', '');
    wrap.appendChild(margin); wrap.appendChild(body);
    host.appendChild(wrap);

    var marksTotal = q.marks[0] + q.marks[1];
    body.appendChild(el('p', 'jq-prompt',
      esc(q.prompt) + ' <span class="q-marks">[' + marksTotal + (marksTotal === 1 ? ' mark' : ' marks') + ']</span>'));

    /* current (open) attempt working state */
    var cur = { L: [], steps: [], t0: Date.now() };
    var structuredBuilder = null;   // the per-type renderer (subst/simplify/\u2026) \u2014 re-opened fresh on a retry
    var linesEl = el('div', 'wlines');
    body.appendChild(linesEl);

    var dgm = null, established = {};
    if (isAngles && q.diagram) {
      var dwrap = el('div', 'jq-diagram');
      body.insertBefore(dwrap, linesEl);
      dgm = window.GJ_PLAYER.renderDiagram(dwrap, q.diagram, {});
    }

    var ui = el('div', 'jq-ui');
    // THE DOCK \u2014 the writing line, the keys and the commit kept together and (on a tall
    // viewport) docked to the bottom, so the pupil can always see what they're writing and
    // the keys at once. Sticky degrades to inline where unsupported; a locked question's
    // dock is empty (ui wiped, checkRow hidden) so docks never stack.
    var dock = el('div', 'dock');
    window.GJ.surface(dock, 'dock', 'chips');   // overwritten below the moment a builder actually renders (same tick, before paint)
    dock.hidden = true;                 // shown only while a question is active (a builder reveals it)
    dock.appendChild(ui);
    var checkRow = el('div', 'check-row');
    var checkBtn = el('button', 'btn-stamp', T.checkWorkingBtn);
    checkBtn.type = 'button';
    var attemptNote = el('span', 'attempt-note', '');
    checkRow.appendChild(checkBtn); checkRow.appendChild(attemptNote);
    dock.appendChild(checkRow);
    body.appendChild(dock);
    var feedback = el('div', 'jq-feedback');
    body.appendChild(feedback);

    /* \u2500\u2500 render committed prior attempts (struck-through) + state \u2500\u2500 */
    function renderLine(line, opts2) {
      opts2 = opts2 || {};
      var row = el('div', 'wline' + (opts2.cls ? ' ' + opts2.cls : ''));
      row.setAttribute('data-placed', '');   // a committed working line is placed work (gates design 2.4)
      row.setAttribute('data-mark', '');     // its own colour (wavy underline / grey follow-through) is a verdict
      var markHolder = el('span', 'wl-mark');
      markHolder.setAttribute('data-mark', '');
      row.appendChild(markHolder);
      row.appendChild(el('span', 'wl-eq', esc(pretty(line.t))));
      var note = marginNote(line.op);
      if (note) row.appendChild(el('span', 'wl-margin-note', esc(note)));
      (opts2.into || linesEl).appendChild(row);
      return { row: row, mark: markHolder };
    }
    function marginNote(op) {
      if (!op) return '';
      if (op === 'exp') return '(expand)';
      if (op === 'col') return '(collect)';
      if (op === 'rw') return '';
      if (op === 'start') return '';
      if (op === 'sub' || op === 'ans' || op === 'form') return '';   // self-evident; no margin tag
      return '(' + pretty(op) + ')';
    }
    function renderStepLine(st, opts2) {
      opts2 = opts2 || {};
      var bank = (window.GJ_CONTENT.angles.reasonBank || []);
      var rsn = bank.filter(function (r) { return r.id === st.rsn; })[0];
      var calcBit = st.calc ? ' <span class="wl-margin-note">(' + esc(pretty(st.calc)) + ')</span>' : '';
      var row = el('div', 'wline' + (opts2.cls ? ' ' + opts2.cls : ''));
      row.setAttribute('data-placed', '');   // a committed reasoning step is placed work (gates design 2.4)
      row.setAttribute('data-mark', '');
      row.appendChild(el('span', 'wl-mark'));
      row.querySelector('.wl-mark').setAttribute('data-mark', '');
      row.innerHTML += '<span class="wl-eq">\u2220' + esc(st.ang) + ' = ' + esc(String(st.val)) + '\u00b0</span>' +
        calcBit + '<span class="wl-margin-note">(' + (rsn ? esc(rsn.text) : '?') + ')</span>';
      (opts2.into || linesEl).appendChild(row);
      return { row: row, mark: row.querySelector('.wl-mark') };
    }

    /* \u2500\u2500 ALGEBRA composer (chips + keypad) \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 */
    var pendingOp = null, composer = null;

    function buildAlgebraUI() {
      ui.innerHTML = '';
      dock.hidden = false;
      window.GJ.setState(dock, 'dock', 'chips');
      // "both sides" only makes sense for equations; substitute/simplify/expand
      // have a single expression, so ask a neutral "next step" there instead.
      var isEquation = q.type === 'solve' || q.type === 'form';

      // LINE FIRST \u2014 the line is the primary act; the move is an optional annotation.
      ui.appendChild(el('p', 'ui-msg', T.algebraNextLine));
      var compHost = el('div', 'dock-line');
      ui.appendChild(compHost);
      composer = makeComposer(compHost, {
        placeholder: T.algebraLinePlaceholder,
        commitLabel: T.addLineBtn,
        onCommit: commitAlgebraLine
      });

      // THE MOVE \u2014 an optional tag for the margin, secondary to the line above.
      var moveWrap = el('div', 'move-annot');
      moveWrap.appendChild(el('div', 'ui-msg msg-status', isEquation ? T.moveAnnotationEquation : T.moveAnnotationGeneric));
      var strip = el('div', 'chip-strip');
      var trayId = 'algebra-moves-' + q.id;
      strip.setAttribute('data-tray', trayId);
      var CHIPS = [
        { id: '+', label: T.chipAdd }, { id: '-', label: T.chipSubtract },
        { id: '*', label: T.chipMultiply }, { id: '/', label: T.chipDivide },
        { id: 'exp', label: T.chipExpandBrackets }, { id: 'col', label: T.chipCollectTerms },
        { id: 'rw', label: T.chipJustRewrite }
      ];
      var operandHost = el('div', '');
      CHIPS.forEach(function (c) {
        var b = el('button', 'chip');
        b.type = 'button';
        b.textContent = c.label;
        b.setAttribute('aria-pressed', 'false');
        b.setAttribute('data-tray-item', '');
        b.addEventListener('click', function () {
          strip.querySelectorAll('.chip').forEach(function (x) { x.setAttribute('aria-pressed', 'false'); });
          b.setAttribute('aria-pressed', 'true');
          operandHost.innerHTML = '';
          if (c.id === '+' || c.id === '-' || c.id === '*' || c.id === '/') {
            pendingOp = { kind: c.id, operand: '' };
            var opc = makeComposer(operandHost, {
              label: T.moveOperandLabel, placeholder: T.moveOperandPlaceholder, commitLabel: T.moveOperandNext,
              onCommit: function () { composer.focus(); }   // "next" on the operand jumps back to the line field
            });
            opc.root.classList.add('compose-mini');
            pendingOp.reader = opc;
            opc.focus();                                     // focus the operand straight away
          } else {
            pendingOp = { kind: c.id };
            composer.focus();                                // no operand needed \u2014 back to the line
          }
        });
        strip.appendChild(b);
      });
      moveWrap.appendChild(strip);
      moveWrap.appendChild(operandHost);
      ui.appendChild(moveWrap);

      undoBtn = el('button', 'btn-pencil', T.removeLastLineBtn);
      undoBtn.type = 'button';
      undoBtn.style.marginTop = '8px';
      undoBtn.hidden = true;   // shown by redrawCurrent once a line exists
      undoBtn.addEventListener('click', function () {
        if (cur.L.pop()) flashMsg(T.removedLastLine, true);
        redrawCurrent();
        save();
      });
      ui.appendChild(undoBtn);
    }

    function commitAlgebraLine(text) {
      if (!text) return;
      if (text.length > 60) { flashMsg(T.lineTooLong); return; }
      var parsed = window.GJ_MATH.parse(text);
      if (!parsed.ok) { flashMsg(fill(T.lineUnreadable, { reason: parsed.err || 'unreadable' })); return; }
      if (cur.L.length >= 12) { flashMsg(T.pageFull); return; }
      var op = 'rw';
      if (pendingOp) {
        if (pendingOp.kind === 'exp') op = 'exp';
        else if (pendingOp.kind === 'col') op = 'col';
        else if (pendingOp.kind === 'rw') op = 'rw';
        else {
          var operand = pendingOp.reader ? pendingOp.reader.value() : '';
          op = ({'+':'+','-':'\u2212','*':'\u00d7','/':'\u00f7'})[pendingOp.kind] + (operand || '?');
        }
      }
      cur.L.push({ op: op, t: text, s: Math.round((Date.now() - cur.t0) / 1000) });
      pendingOp = null;
      composer.clear();
      ui.querySelectorAll('.chip').forEach(function (x) { x.setAttribute('aria-pressed', 'false'); });
      redrawCurrent();
      confirmStepAdded();
      save();
    }

    /* \u2500\u2500 SUBSTITUTION (subst): tap each letter \u2192 its value drops in (\u00d7 inserted,
         negatives bracketed); the substituted line is one entry, the value the
         other \u2014 the two-entry model the engine marks as method + answer. \u2500\u2500\u2500\u2500 */
    function buildSubstUI() {
      ui.innerHTML = '';
      dock.hidden = false;
      var given = q.given || {};
      var toks = substTokens(q.start, given);
      var uniq = [];
      toks.forEach(function (t) { if (t.letter && uniq.indexOf(t.letter) < 0) uniq.push(t.letter); });
      var placed = {};
      var hasSub = cur.L.some(function (l) { return l.op === 'sub'; });
      var hasAns = cur.L.some(function (l) { return l.op === 'ans'; });
      var exprTrayId = 'subst-expr-' + q.id;

      var instr = el('p', 'ui-msg', T.substIntro);
      ui.appendChild(instr);
      var exprBox = el('div', 'subst-expr');
      exprBox.style.cssText = 'font-family:Georgia,serif;font-size:1.55rem;color:#14213A;margin:6px 0 12px;line-height:2';
      /* NOT A TRAY. The expression IS the question \u2014 `3a - d` with its letters
         waiting to be filled in. A tray is a group of OPTIONS, served shuffled,
         where choosing wrong is possible; there is nothing to shuffle here and
         nothing to give away. Calling it one made the consequence law compare a
         tappable letter against the multiplication sign beside it and report a
         colour hint. */
      exprBox.setAttribute('data-tray-row', exprTrayId);
      ui.appendChild(exprBox);
      var givenRow = el('div', 'subst-givens');
      givenRow.style.cssText = 'display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:8px';
      ui.appendChild(givenRow);
      var answerHost = el('div', 'subst-answer');
      ui.appendChild(answerHost);

      function renderExpr() {
        exprBox.innerHTML = '';
        var prev = null;
        toks.forEach(function (t) {
          if (prev) {
            var prevV = (prev.k === 'v' || prev.k === ')'), nextV = (t.k === 'v' || t.k === '(');
            if (prevV && nextV) exprBox.appendChild(el('span', '', ' \u00d7 '));
            else if (prev.k === 'o' || t.k === 'o') exprBox.appendChild(document.createTextNode(' '));
          }
          if (t.letter) {
            var done = !!placed[t.letter];
            var sp = el('span', 'subst-tok', done ? substValStr(given[t.letter]) : t.letter);
            sp.style.cssText = done ? 'color:#14213A;font-weight:600'
              : 'color:#7A3B5E;border-bottom:2px dashed #C58CA0;cursor:pointer;padding:0 3px';
            sp.setAttribute('data-tray-item', '');
            if (done) sp.setAttribute('data-placed', '');
            if (!done) sp.addEventListener('click', function () {
              placed[t.letter] = true; renderExpr();
              if (uniq.every(function (u) { return placed[u]; })) commitMethod();
            });
            exprBox.appendChild(sp);
          } else {
            exprBox.appendChild(el('span', '', t.s));
          }
          prev = t;
        });
      }
      function renderGivens() {
        givenRow.innerHTML = '';
        var gl = el('span', '', T.substGivenLabel); gl.style.cssText = 'font-family:monospace;font-size:.72rem;color:#7d7a72';
        givenRow.appendChild(gl);
        uniq.forEach(function (L) {
          var c = el('span', '', L + ' = ' + gjRtostr(given[L]));
          c.style.cssText = 'font-family:Georgia,serif;font-size:1rem;color:#5b2c46;background:#F3E6EC;border:1px solid #C58CA0;border-radius:999px;padding:2px 11px';
          givenRow.appendChild(c);
        });
      }
      function commitMethod() {
        cur.L.push({ op: 'sub', t: substLineStr(toks, given, placed), s: Math.round((Date.now() - cur.t0) / 1000) });
        redrawCurrent();
        checkBtn.disabled = true;                       // not ready until the value is keyed
        setLockedWhy(checkBtn, T.substAnswerPrompt);
        instr.textContent = T.substMethodPrompt;
        exprBox.style.display = 'none'; givenRow.style.display = 'none';
        showAnswer();
        save();
      }
      function syncAns(v) {                             // the value updates live on the page as it's tapped
        cur.L = cur.L.filter(function (l) { return l.op !== 'ans'; });
        if (v) cur.L.push({ op: 'ans', t: v, s: Math.round((Date.now() - cur.t0) / 1000) });
        redrawCurrent();
        checkBtn.disabled = !v;                         // "Mark my working" lights up once a value is written
        setLockedWhy(checkBtn, v ? null : T.substAnswerPrompt);
        save();
      }
      function showAnswer() {
        answerHost.innerHTML = '';
        answerHost.appendChild(el('p', 'ui-msg', T.substAnswerPrompt));
        window.GJ.setState(dock, 'dock', 'numpad');
        makeNumPad(answerHost, { label: T.substValueLabel, onChange: syncAns });
      }

      window.GJ.setState(dock, 'dock', 'tray');
      renderExpr(); renderGivens();
      if (hasSub) {                                     // resume: method already committed
        instr.textContent = T.substMethodPrompt;
        exprBox.style.display = 'none'; givenRow.style.display = 'none';
        if (!hasAns) showAnswer();
      }
    }

    /* \u2500\u2500 SIMPLIFY (collect like terms): sort each term-tile into its family
         bin, then "combine" emits one fully-collected line. The separate
         number bin makes the lone constant impossible to swallow by accident
         into the x-family unless the pupil truly mis-sorts it (caught + dx). \u2500\u2500 */
    function buildSimplifyUI() {
      ui.innerHTML = '';
      dock.hidden = false;
      window.GJ.setState(dock, 'dock', 'tray');
      var terms = parseTerms(q.start);
      var order = ['x2', 'x', 'num'], fams = [];
      terms.forEach(function (t) { if (fams.indexOf(t.fam) < 0) fams.push(t.fam); });
      fams.sort(function (a, b) { return order.indexOf(a) - order.indexOf(b); });
      var famLabel = { x2: 'x\u00b2 terms', x: 'x terms', num: 'numbers' };
      var bins = {}; fams.forEach(function (f) { bins[f] = []; });
      var placed = {}, sel = null;
      var trayId = 'simplify-tray-' + q.id;

      ui.appendChild(el('p', 'ui-msg', T.simplifyIntro));
      var tilesRow = el('div', 'simp-tiles'); tilesRow.style.cssText = 'display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 12px;min-height:44px';
      tilesRow.setAttribute('data-tray', trayId);
      ui.appendChild(tilesRow);
      var binsRow = el('div', 'simp-bins'); binsRow.style.cssText = 'display:flex;gap:12px;flex-wrap:wrap';
      ui.appendChild(binsRow);
      var combineWrap = el('div', ''); combineWrap.style.marginTop = '10px'; ui.appendChild(combineWrap);

      function renderTiles() {
        tilesRow.innerHTML = '';
        var any = false;
        terms.forEach(function (t, idx) {
          if (placed[idx] != null) return;
          any = true;
          var b = el('button', '', t.tile); b.type = 'button';
          b.style.cssText = 'font-family:Georgia,serif;font-size:1.3rem;padding:6px 15px;border-radius:8px;cursor:pointer;color:#5b2c46;border:2px solid ' + (sel === idx ? '#7A3B5E' : '#C58CA0') + ';background:' + (sel === idx ? '#F3E6EC' : '#fff');
          b.setAttribute('data-tray-item', '');
          b.addEventListener('click', function () { sel = (sel === idx ? null : idx); renderTiles(); });
          tilesRow.appendChild(b);
        });
        if (!any) tilesRow.appendChild(el('span', 'ui-msg', sel == null ? T.allSortedNowCombine : ''));
      }
      function renderBins() {
        binsRow.innerHTML = '';
        fams.forEach(function (f) {
          var bin = el('div', ''); bin.style.cssText = 'min-width:118px;border:2px dashed ' + (sel != null ? '#7A3B5E' : '#C58CA0') + ';border-radius:10px;padding:8px 10px;background:#FBF7F9;cursor:' + (sel != null ? 'pointer' : 'default');
          var lab = el('div', '', famLabel[f]); lab.style.cssText = 'font-family:monospace;font-size:.68rem;color:#7d7a72;margin-bottom:6px;text-transform:uppercase'; bin.appendChild(lab);
          var row = el('div', ''); row.style.cssText = 'min-height:26px;font-family:Georgia,serif;font-size:1.15rem;color:#14213A';
          row.setAttribute('data-tray-row', '');
          bins[f].forEach(function (idx, k) {
            if (k) row.appendChild(document.createTextNode('  '));
            var t = el('span', '', terms[idx].tile);
            t.setAttribute('data-placed', ''); t.setAttribute('data-from', trayId);
            row.appendChild(t);
          });
          bin.appendChild(row);
          bin.addEventListener('click', function () { if (sel != null) { bins[f].push(sel); placed[sel] = f; sel = null; renderTiles(); renderBins(); renderCombine(); } });
          binsRow.appendChild(bin);
        });
      }
      function renderCombine() {
        combineWrap.innerHTML = '';
        if (!terms.every(function (t, idx) { return placed[idx] != null; })) return;
        var cb = el('button', 'btn-stamp', T.combineTermsBtn); cb.type = 'button';
        cb.addEventListener('click', function () {
          var c2 = 0, c1 = 0, c0 = 0;
          (bins.x2 || []).forEach(function (idx) { c2 += terms[idx].value; });
          (bins.x || []).forEach(function (idx) { c1 += terms[idx].value; });
          (bins.num || []).forEach(function (idx) { c0 += terms[idx].value; });
          cur.L = cur.L.filter(function (l) { return l.op !== 'col'; });
          cur.L.push({ op: 'col', t: buildCollected(c2, c1, c0), s: Math.round((Date.now() - cur.t0) / 1000) });
          redrawCurrent(); confirmStepAdded(); save(); cb.disabled = true;
        });
        combineWrap.appendChild(cb);
      }
      renderTiles(); renderBins(); renderCombine();
    }

    /* \u2500\u2500 EXPAND (single brackets): the multiplication grid \u2014 one product per
         cell, picked from a tile palette (correct product + the partial/sign
         distractors). Both cells join into one expanded line. \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 */
    function buildExpandUI() {
      ui.innerHTML = '';
      dock.hidden = false;
      window.GJ.setState(dock, 'dock', 'tray');
      var fc = q.fc;
      if (!fc || !fc.cells) { buildAlgebraUI(); return; }   // safety: fall back if unscaffolded
      var chosen = [null, null];
      ui.appendChild(el('p', 'ui-msg', T.expandIntro));
      var grid = el('div', 'exp-grid'); grid.style.cssText = 'display:flex;flex-direction:column;gap:16px;margin:8px 0';
      ui.appendChild(grid);
      function maybeCommit() {
        if (chosen[0] == null || chosen[1] == null) return;
        cur.L = cur.L.filter(function (l) { return l.op !== 'exp'; });
        cur.L.push({ op: 'exp', t: joinExpand(chosen[0], chosen[1]), s: Math.round((Date.now() - cur.t0) / 1000) });
        redrawCurrent(); save();
      }
      fc.cells.forEach(function (cell, ci) {
        var trayId = 'expand-tray-' + q.id + '-' + ci;
        var row = el('div', ''); row.style.cssText = 'display:flex;flex-direction:column;gap:6px';
        var head = el('div', ''); head.style.cssText = 'font-family:Georgia,serif;font-size:1.3rem;color:#14213A;display:flex;align-items:center;gap:10px';
        head.setAttribute('data-tray-row', '');
        head.appendChild(el('span', '', fc.a + ' \u00d7 ' + fc.terms[ci] + ' ='));
        var slot = el('span', ''); slot.style.cssText = 'min-width:54px;min-height:38px;display:inline-flex;align-items:center;justify-content:center;border:2px dashed #C58CA0;border-radius:8px;padding:0 10px;color:#B07D10';
        head.appendChild(slot); row.appendChild(head);
        var tray = el('div', ''); tray.style.cssText = 'display:flex;gap:8px;flex-wrap:wrap';
        tray.setAttribute('data-tray', trayId);
        shuffleArr(cell.tiles).forEach(function (tt) {
          var b = el('button', '', tt); b.type = 'button';
          b.style.cssText = 'font-family:Georgia,serif;font-size:1.15rem;padding:6px 14px;border-radius:8px;border:2px solid #1A3A6B;background:#fff;color:#1A3A6B;cursor:pointer';
          b.setAttribute('data-tray-item', '');
          b.addEventListener('click', function () {
            chosen[ci] = tt;
            slot.textContent = tt; slot.style.borderStyle = 'solid'; slot.style.color = '#14213A';
            slot.setAttribute('data-placed', ''); slot.setAttribute('data-from', trayId);
            tray.querySelectorAll('button').forEach(function (x) { x.style.background = '#fff'; x.style.color = '#1A3A6B'; });
            b.style.background = '#1A3A6B'; b.style.color = '#fff';
            maybeCommit();
          });
          tray.appendChild(b);
        });
        row.appendChild(tray); grid.appendChild(row);
      });
    }

    /* \u2500\u2500 SOLVE / FORM: the move-chip rail. The pupil picks an operation (and its
         number); the app builds the next line, validates it keeps the balance,
         and inks it. Any valid route is accepted (subtract-first or divide-first,
         either side). FORM first picks the equation, then solves it. \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 */
    function buildFormScaffold() {
      ui.innerHTML = ''; dock.hidden = false;
      window.GJ.setState(dock, 'dock', 'tray');
      var fc = q.fc;
      if (!fc || !fc.choices) { buildAlgebraUI(); return; }
      ui.appendChild(el('p', 'ui-msg', T.formChooseEquation));
      var row = el('div', ''); row.style.cssText = 'display:flex;flex-direction:column;gap:8px;margin:6px 0';
      var trayId = 'form-choices-' + q.id;
      row.setAttribute('data-tray', trayId);
      shuffleArr(fc.choices).forEach(function (ch) {
        var b = el('button', '', ch); b.type = 'button';
        b.style.cssText = 'font-family:Georgia,serif;font-size:1.2rem;padding:9px 15px;border-radius:8px;border:2px solid #1A3A6B;background:#fff;color:#14213A;cursor:pointer;text-align:left';
        b.setAttribute('data-tray-item', '');
        b.addEventListener('click', function () {
          cur.L = cur.L.filter(function (l) { return l.op !== 'form'; });
          cur.L.push({ op: 'form', t: ch, s: Math.round((Date.now() - cur.t0) / 1000) });
          redrawCurrent(); confirmStepAdded(); save();
          buildSolveUI();
        });
        row.appendChild(b);
      });
      ui.appendChild(row);
    }
    function buildSolveUI() {
      var M = window.GJ_MATH;
      if (q.type === 'form' && !cur.L.some(function (l) { return l.op === 'form'; })) { buildFormScaffold(); return; }
      ui.innerHTML = ''; dock.hidden = false;
      window.GJ.setState(dock, 'dock', 'chips');
      ui.appendChild(el('p', 'ui-msg', T.solveChooseMove));
      var chipRow = el('div', 'solve-chips'); chipRow.style.cssText = 'display:flex;gap:8px;flex-wrap:wrap;margin:6px 0'; ui.appendChild(chipRow);
      chipRow.setAttribute('data-tray', 'solve-moves-' + q.id);
      var opHost = el('div', 'solve-op'); ui.appendChild(opHost);
      function lastLine() { for (var i = cur.L.length - 1; i >= 0; i--) { if (cur.L[i].t) return cur.L[i].t; } return q.start || ''; }
      function applyMove(kind, operandStr) {
        var prev = lastLine();
        var candidate = solveStep(prev, kind, operandStr);
        if (!candidate) { flashMsg(T.solveNeedNumber); window.GJ.setState(dock, 'dock', 'nudge-pad'); return; }
        var gate = M.eqStep(prev, candidate);
        if (!gate || (gate.ok !== 'sound' && gate.ok !== 'identity')) { flashMsg(T.solveMoveUnbalanced); window.GJ.setState(dock, 'dock', 'nudge-pad'); return; }
        var opLabel = kind === 'expand' ? 'exp' : kind === 'subx' ? ('\u2212' + (operandStr || '') + 'x')
          : (({ '-': '\u2212', '+': '+', '*': '\u00d7', '/': '\u00f7' }[kind]) + (operandStr || ''));
        cur.L.push({ op: opLabel, t: candidate, s: Math.round((Date.now() - cur.t0) / 1000) });
        redrawCurrent(); confirmStepAdded(); save();
        renderChips();
      }
      function pickOp(c) {
        opHost.innerHTML = '';
        if (c.noOperand) { applyMove(c.kind, null); return; }
        opHost.appendChild(el('p', 'ui-msg', c.prompt));
        window.GJ.setState(dock, 'dock', 'numpad-fraction');
        var pad = makeNumPad(opHost, { fraction: true, onCommit: function (v) { applyMove(c.kind, v); } });
        var go = el('button', 'btn-stamp', T.applyBtn); go.type = 'button'; go.style.marginTop = '8px';
        go.addEventListener('click', function () { applyMove(c.kind, pad.value()); });
        opHost.appendChild(go);
      }
      function renderChips() {
        chipRow.innerHTML = ''; opHost.innerHTML = '';
        window.GJ.setState(dock, 'dock', 'chips');
        var line = lastLine();
        if (!line || line.indexOf('=') < 0) return;
        var bothX = false, sides = line.split('=');
        var Lp = M.parse(sides[0]), Rp = M.parse(sides[1]);
        if (Lp.ok && Rp.ok && Lp.ast.lhs && Rp.ast.lhs) { var Lc = Lp.ast.lhs.poly, Rc = Rp.ast.lhs.poly; if (Lc && Rc && Lc.c1 && Rc.c1 && Lc.c1.n !== 0 && Rc.c1.n !== 0) bothX = true; }
        var chips = [];
        if (line.indexOf('(') >= 0) chips.push({ label: T.chipExpandBrackets, kind: 'expand', noOperand: true });
        if (bothX) chips.push({ label: T.chipTakeXBothSides, kind: 'subx', prompt: T.promptTakeXBothSides });
        chips.push({ label: T.chipSubtract, kind: '-', prompt: T.promptSubtractBoth });
        chips.push({ label: T.chipAdd, kind: '+', prompt: T.promptAddBoth });
        chips.push({ label: T.chipDivide, kind: '/', prompt: T.promptDivideBoth });
        chips.push({ label: T.chipMultiply, kind: '*', prompt: T.promptMultiplyBoth });
        chips.forEach(function (c) {
          var btn = el('button', 'chip', c.label); btn.type = 'button';
          btn.style.cssText = 'font-family:Georgia,serif;font-size:1rem;padding:7px 13px;border-radius:8px;border:1.5px solid #1A3A6B;background:#fff;color:#1A3A6B;cursor:pointer';
          btn.setAttribute('data-tray-item', '');
          btn.addEventListener('click', function () { pickOp(c); });
          chipRow.appendChild(btn);
        });
      }
      renderChips();
    }

    /* \u2500\u2500 ANGLES composer (tap angle \u2192 value \u2192 reason) \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 */
    var stepTarget = null, stepComposer = null, chosenReason = null;
    var undoBtn = null;   // "remove last step/line" \u2014 hidden until there's something to remove
    var refreshTappable = null;   // set in buildAnglesUI; re-marks which arcs are still tappable
    var targetLabel = (isAngles && q.target) ? ((q.diagram.angles[q.target] && q.diagram.angles[q.target].label) || ('\u2220' + q.target)) : '';

    function unknownAngles() {
      var out = [];
      Object.keys(q.diagram.angles).forEach(function (nm) {
        var d = q.diagram.angles[nm];
        if (!d.given && !established[nm]) out.push(nm);
      });
      return out;
    }

    function buildAnglesUI() {
      ui.innerHTML = '';
      dock.hidden = false;
      // instruction matches reality: point straight at the one tappable arc, or to the target
      var openCount = unknownAngles().length;
      ui.appendChild(el('p', 'ui-msg', openCount === 1
        ? 'One angle is dashed on the diagram \u2014 tap it, give its size, and choose the reason.'
        : 'Tap a dashed angle on the diagram, give its size and reason, then work your way to ' + targetLabel + '.'));
      var stepHost = el('div', 'step-card');
      stepHost.hidden = true;
      ui.appendChild(stepHost);

      // arcs are tappable when not given and not yet established; refreshTappable marks them visibly
      refreshTappable = function () {
        Object.keys(q.diagram.angles).forEach(function (nm) {
          var g = dgm.arcEl(nm);
          if (!g) return;
          g.classList.toggle('arc-tappable', !rec.lock && !q.diagram.angles[nm].given && !established[nm]);
        });
      };
      Object.keys(q.diagram.angles).forEach(function (nm) {
        var g = dgm.arcEl(nm);
        if (!g) return;
        g.addEventListener('click', function () {
          var d = q.diagram.angles[nm];
          if (rec.lock || d.given || established[nm]) return;
          openStep(nm, stepHost);
        });
      });
      undoBtn = el('button', 'btn-pencil', '\u21b6 remove last step');
      undoBtn.type = 'button';
      undoBtn.hidden = true;   // shown by redrawCurrent once a step exists
      undoBtn.addEventListener('click', function () {
        var last = cur.steps.pop();
        if (last) {
          delete established[last.ang];
          dgm.setText(last.ang, q.diagram.angles[last.ang].label || '');
          var lbl = dgm.svg.querySelector('[data-anglabel="' + last.ang + '"]');
          if (lbl) { lbl.style.fill = '#14213A'; lbl.style.fontStyle = q.diagram.angles[last.ang].label ? 'italic' : ''; }
          flashMsg('Removed your last step.', true);
        }
        redrawCurrent();
        save();
      });
      ui.appendChild(undoBtn);
    }

    function openStep(nm, stepHost) {
      stepTarget = nm;
      chosenReason = null;
      var isFinalStep = (nm === q.target);   // the angle that completes the question -> "Check my answer" + mark in one press
      stepHost.hidden = false;
      stepHost.innerHTML = '';
      dgm.pulse(nm, true);
      var activeArc = dgm.arcEl(nm); if (activeArc) activeArc.classList.remove('arc-tappable');   // it's active now, not waiting

      // STEP 1 \u2014 the size, entered inline:  \u2220PVR = [ __ ] \u00b0
      stepHost.appendChild(el('p', 'sc-head', T.angleWorkOut + esc(nm)));
      var row = el('div', 'sc-row');
      row.appendChild(el('span', 'sc-eq', '\u2220' + esc(nm) + ' ='));
      var fieldHost = el('span', 'sc-field');
      row.appendChild(fieldHost);
      row.appendChild(el('span', 'sc-eq', '\u00b0'));
      stepHost.appendChild(row);
      stepHost.appendChild(el('p', 'sc-hint', T.angleSizeHintLine));
      stepComposer = makeComposer(stepHost, {
        fieldHost: fieldHost,
        pad: 'number',
        label: 'Size of angle ' + nm,
        placeholder: 'the size, e.g. 65',
        onCommit: function () { commitStep(); }   // Enter does the same as the on-screen button (add, or check-on-final)
      });

      // STEP 2 \u2014 the reason (grouped, randomised within groups, FULL bank always)
      stepHost.appendChild(el('p', 'sc-sub', 'Then choose the reason \u2014 it earns its own mark:'));
      var reasons = el('div', 'reasons');
      var bank = window.GJ_CONTENT.angles.reasonBank;
      var groups = [];
      bank.forEach(function (r) { if (groups.indexOf(r.group) === -1) groups.push(r.group); });
      groups.forEach(function (gname) {
        reasons.appendChild(el('p', 'reason-group-h', esc(gname)));
        var cards = el('div', 'reason-cards');
        shuffle(bank.filter(function (r) { return r.group === gname; }), q.id + nm).forEach(function (r) {
          var b = el('button', 'reason-card');
          b.type = 'button';
          b.textContent = r.text;
          b.setAttribute('aria-pressed', 'false');
          b.addEventListener('click', function () {
            reasons.querySelectorAll('.reason-card').forEach(function (x) { x.setAttribute('aria-pressed', 'false'); });
            b.setAttribute('aria-pressed', 'true');
            chosenReason = r.id;
            scMsg.textContent = '';   // clear any "now choose a reason" prompt
          });
          cards.appendChild(b);
        });
        reasons.appendChild(cards);
      });
      stepHost.appendChild(reasons);

      // inline guidance, right where the pupil is looking (not the far-off page message)
      var scMsg = el('p', 'sc-msg');
      stepHost.appendChild(scMsg);

      function tryAddStep() {
        var raw = stepComposer.value();
        if (!raw) { scMsg.textContent = 'First type the size of the angle above.'; stepComposer.focus(); return false; }
        var calcStr = raw.replace(/\u2212/g, '-').replace(/\u00d7/g, '*').replace(/\u00f7/g, '/');
        var evald = window.GJ_MATH.evalCalc(calcStr);
        if (!evald.ok) { scMsg.textContent = T.angleUnreadableLine; stepComposer.focus(); return false; }
        var val = evald.val.d === 1 ? evald.val.n : evald.val.n / evald.val.d;
        if (val < 0 || val > 360) { scMsg.textContent = 'An angle here is between 0\u00b0 and 360\u00b0 \u2014 check the size.'; stepComposer.focus(); return false; }
        if (!chosenReason) { scMsg.textContent = 'Now choose the reason below \u2193 \u2014 it earns its own mark.'; return false; }
        var step = { ang: nm, val: val, rsn: chosenReason, s: Math.round((Date.now() - cur.t0) / 1000) };
        if (/[-+*/()]/.test(calcStr)) step.calc = raw;
        cur.steps.push(step);
        established[nm] = true;
        dgm.pulse(nm, false);
        dgm.setText(nm, val + '\u00b0');
        var lbl = dgm.svg.querySelector('[data-anglabel="' + nm + '"]');
        if (lbl) { lbl.style.fill = '#5B6470'; lbl.style.fontStyle = 'italic'; }
        stepHost.hidden = true;
        redrawCurrent();
        save();
        return true;   // confirmation/verdict handled by commitStep, so the final step shows the mark, not an "added" flash
      }

      // one press: record the step, then EITHER mark it (final/only angle) OR confirm + stay put (intermediate)
      function commitStep() {
        if (!tryAddStep()) return;
        if (isFinalStep) { runCheck(); }
        else { confirmStepAdded(); wrap.scrollIntoView({ block: 'start', behavior: REDUCED ? 'auto' : 'smooth' }); }
      }

      var doRow = el('div', 'check-row');
      var add = el('button', 'btn-stamp', isFinalStep ? 'Mark my working' : 'Add to my working');
      add.type = 'button';
      add.addEventListener('click', commitStep);
      doRow.appendChild(add);
      var cancel = el('button', 'btn-pencil', 'Cancel');
      cancel.type = 'button';
      cancel.addEventListener('click', function () { dgm.pulse(nm, false); stepHost.hidden = true; });
      doRow.appendChild(cancel);
      stepHost.appendChild(doRow);
      stepComposer.focus();   // auto-focus the size field \u2014 no second tap needed
    }

    /* \u2500\u2500 shared render / save / check \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 */
    var msgEl = el('div', 'ui-msg');
    checkRow.parentNode.insertBefore(msgEl, checkRow);   // into the dock, above the commit (validation can't scroll off)
    var msgTimer = null;
    // ok=true -> positive sage flash; ok=false -> a validation prompt (amber "needs action",
    // never marking-red: a pupil being asked to add a line is not wrong).
    function flashMsg(t, ok) {
      msgEl.textContent = t;
      msgEl.className = 'ui-msg' + (ok ? ' flash-ok' : ' msg-validation');
      clearTimeout(msgTimer);
      msgTimer = setTimeout(function () { msgEl.textContent = ''; msgEl.className = 'ui-msg'; }, ok ? 2600 : 5000);
    }
    // confirm a freshly written step: a quick positive flash + a brief highlight
    // on the new line, so the pupil sees it landed in the jotter.
    function confirmStepAdded() {
      flashMsg('\u2713 Added to your jotter.', true);
      var last = linesEl.lastElementChild;
      if (last) { last.classList.add('just-added'); setTimeout(function () { last.classList.remove('just-added'); }, 1300); }
    }

    function redrawCurrent() {
      linesEl.innerHTML = '';
      // prior attempts, struck through
      rec.att.forEach(function (att) {
        (att.L || []).forEach(function (l) { renderLine(l, { cls: 'struck' }); });
        (att.steps || []).forEach(function (s) { renderStepLine(s, { cls: 'struck' }); });
      });
      if (!isAngles && q.start && !rec.lock) renderLine({ op: 'start', t: q.start }, { cls: 'pencil' });
      cur.L.forEach(function (l) { renderLine(l, {}); });
      cur.steps.forEach(function (s) { renderStepLine(s, {}); });
      var ready = isAngles ? !!established[q.target] : cur.L.length > 0;
      checkBtn.disabled = !ready || rec.lock;
      if (!rec.lock && (cur.L.length || cur.steps.length)) window.GJ.setState(wrap, 'question', 'mid-attempt');
      /* A CONTROL THAT WILL NOT ACT SAYS WHY, BESIDE ITSELF (amendment 8.8).
         A greyed-out Check with nothing next to it is a pupil deciding the app
         is broken; the reason is short, specific and in her own words. */
      if (checkBtn.disabled) {
        checkBtn.setAttribute('data-locked-why', rec.lock
          ? T.checkLockedWhy
          : (isAngles ? T.checkNeedsAngleWhy : T.checkNeedsLineWhy));
      } else {
        checkBtn.removeAttribute('data-locked-why');
      }
      if (undoBtn) undoBtn.hidden = rec.lock || (isAngles ? cur.steps.length === 0 : cur.L.length === 0);
      attemptNote.textContent = rec.att.length === 1 ? 'Second attempt \u2014 your first try stays on the page.' : '';
      if (refreshTappable) refreshTappable();   // single chokepoint: keep the dashed "tappable" marks honest (clears them on lock)
    }

    function save() {
      var attRec = { L: cur.L, dur: Math.round((Date.now() - cur.t0) / 1000) };
      if (isAngles) { attRec = { steps: cur.steps, dur: attRec.dur }; }
      var attts = rec.att.slice();
      // the open attempt is represented live so the teacher's Wall shows "working now"
      var live = { att: attts.concat(cur.L.length || cur.steps.length ? [attRec] : []), lock: rec.lock, ovr: rec.ovr || null };
      if (rec.fin) live.fin = rec.fin;
      hooks.onSave(q.id, rec.lock ? rec : live);
    }

    function runCheck() {
      if (checkBtn.disabled) return;
      checkBtn.disabled = true;
      var attempt = isAngles
        ? { steps: cur.steps, dur: Math.round((Date.now() - cur.t0) / 1000) }
        : { L: cur.L, fin: cur.L.length ? cur.L[cur.L.length - 1].t : '', dur: Math.round((Date.now() - cur.t0) / 1000) };
      var verdict;
      try {
        verdict = isAngles ? window.GJ_ANGLES.checkSteps(q, cur.steps) : window.GJ_MATH.checkQuestion(q, attempt);
      } catch (e) {
        flashMsg('Something went wrong marking this \u2014 your working is saved for your teacher.');
        checkBtn.disabled = false;
        return;
      }
      attempt.res = verdict.res;
      rec.att.push(attempt);

      // only pull the question up if its top is above the viewport (long page); otherwise
      // leave the view put \u2014 the guarded feedback scroll below guarantees the verdict shows.
      var wr0 = wrap.getBoundingClientRect();
      if (wr0.top < 0) wrap.scrollIntoView({ block: 'start', behavior: REDUCED ? 'auto' : 'smooth' });

      var rows = linesEl.querySelectorAll('.wline:not(.struck):not(.pencil)');
      var per = verdict.perLine || verdict.perStep || [];
      var seq = Promise.resolve();
      per.forEach(function (v, i) {
        var row = rows[i];
        if (!row) return;
        seq = seq.then(function () {
          var kind = v.ok === 1 ? 'tick' : v.ok === 2 ? 'tick-hollow' : 'cross';
          if (verdict.res === 'AMBER' && v.ok === 1) kind = 'tick-amber';
          if (v.ok === 0) { row.classList.add('err-box'); row.querySelector('.wl-eq').classList.add('wavy'); }
          if (v.ok === 2) row.classList.add('ft-grey');
          return drawMark(row.querySelector('.wl-mark'), kind).then(function () {
            return new Promise(function (r) { setTimeout(r, REDUCED ? 0 : 90); });
          });
        });
      });

      seq.then(function () {
        feedback.innerHTML = '';
        var mk = verdict.mk, mkMax = verdict.mkMax || q.marks;
        var done = verdict.res === 'OK';
        var amber = verdict.res === 'AMBER';
        var secondGone = rec.att.length >= 2;
        var mkState = done ? ' mk-correct' : amber ? ' mk-amber' : ' mk-wrong';   // colour the score by outcome, not always red
        var tally = el('div', 'mk-tally' + mkState, 'Working ' + mk[0] + '/' + mkMax[0] + ' \u00b7 Answer ' + mk[1] + '/' + mkMax[1]);
        feedback.appendChild(tally);

        if (amber) feedback.appendChild(el('p', 'amber-note', T.amberNoWorkingLine));

        var bucket = done ? 'perfect' : amber ? 'amber' : secondGone ? 'fail' : 'partial';
        if (done && mk[0] === mkMax[0]) bucket = 'perfect';
        feedback.appendChild(el('p', 'mk-comment' + mkState, commentFor(q.id, bucket)));

        if (done && !isAngles) {
          var lastRow = rows[rows.length - 1];
          if (lastRow) {
            var eqSpan = lastRow.querySelector('.wl-eq');
            var hold = el('span', 'answer-boxed');
            eqSpan.parentNode.insertBefore(hold, eqSpan);
            hold.appendChild(eqSpan);
            var w = hold.offsetWidth + 20, h = hold.offsetHeight + 6;
            var s = sv('svg', { class: 'box-draw', viewBox: '0 0 ' + w + ' ' + h });
            var p = sv('path', { d: 'M2 2 H ' + (w - 2) + ' V ' + (h - 2) + ' H 2 Z' });
            s.appendChild(p);
            hold.appendChild(s);
            if (!REDUCED) {
              var len = p.getTotalLength();
              p.style.strokeDasharray = len; p.style.strokeDashoffset = len;
              p.getBoundingClientRect();
              p.style.transition = 'stroke-dashoffset 500ms linear';
              p.style.strokeDashoffset = 0;
            }
          }
        }

        /* THE SCREEN SAYS WHAT STATE IT IS IN. Only the classify and
           protractor renderers stamped this; the five scaffolded kinds went
           from "fresh" to marked without ever saying so, so every gate and
           every walk that reads the DOM contract on a question read "fresh"
           for a question that had just been marked full. */
        window.GJ.setState(wrap, 'question',
          done ? 'checked-right' : amber ? 'amber' : (secondGone ? 'checked-wrong-2' : 'checked-wrong-1'));
        if (done || amber || secondGone) {
          rec.lock = true;
          rec.fin = attempt.fin || null;
          rec.mk = mk;
          ui.innerHTML = '';
          checkRow.hidden = true;
          dock.hidden = true;            // the question is marked; the dock retires
          margin.innerHTML = 'Q' + hooks.number + '<div class="mk-tally' + mkState + '" style="font-size:18px">' + (mk[0] + mk[1]) + '/' + (mkMax[0] + mkMax[1]) + '</div>';
        } else {
          // one more attempt: keep attempt 1 on the page, struck through
          feedback.appendChild(el('p', 'ui-msg', 'The line in the red box is where it went wrong \u2014 nothing is given away. One more attempt.'));
          cur = { L: [], steps: [], t0: Date.now() };
          established = {};
          if (isAngles) {
            Object.keys(q.diagram.angles).forEach(function (nm) {
              var d = q.diagram.angles[nm];
              if (!d.given) { dgm.setText(nm, d.label || ''); var lb = dgm.svg.querySelector('[data-anglabel="' + nm + '"]'); if (lb) { lb.style.fill = '#14213A'; lb.style.fontStyle = d.label ? 'italic' : ''; } }
            });
          }
          setTimeout(function () { if (structuredBuilder) structuredBuilder(); redrawCurrent(); checkBtn.disabled = true; }, REDUCED ? 0 : 600);
        }
        var fr = feedback.getBoundingClientRect();   // bring the verdict on-screen only if it isn't already (works on tall + short questions)
        if (fr.bottom > window.innerHeight || fr.top < 0) feedback.scrollIntoView({ block: 'nearest', behavior: REDUCED ? 'auto' : 'smooth' });
        save();
      });
    }

    checkBtn.addEventListener('click', runCheck);

    /* \u2500\u2500 restore saved state \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 */
    if (rec.lock) {
      // render final attempt with its marks, locked
      var finalAtt = rec.att[rec.att.length - 1];
      rec.att.slice(0, -1).forEach(function (att) {
        (att.L || []).forEach(function (l) { renderLine(l, { cls: 'struck' }); });
        (att.steps || []).forEach(function (s) { renderStepLine(s, { cls: 'struck' }); });
      });
      var verdict = null;
      try {
        verdict = isAngles ? window.GJ_ANGLES.checkSteps(q, finalAtt.steps || []) : window.GJ_MATH.checkQuestion(q, finalAtt);
      } catch (e) {}
      var per = (verdict && (verdict.perLine || verdict.perStep)) || [];
      (finalAtt.L || []).forEach(function (l, i) {
        var r = renderLine(l, {});
        var v = per[i];
        if (v) drawMark(r.mark, v.ok === 1 ? (verdict.res === 'AMBER' ? 'tick-amber' : 'tick') : v.ok === 2 ? 'tick-hollow' : 'cross');
        if (v && v.ok === 0) { r.row.classList.add('err-box'); }
      });
      (finalAtt.steps || []).forEach(function (s, i) {
        var r = renderStepLine(s, {});
        var v = per[i];
        if (v) drawMark(r.mark, (v.val === 1 && v.rsn === 1) ? 'tick' : (v.val === 2 ? 'tick-hollow' : (v.val === 1 || v.rsn === 1) ? 'tick-amber' : 'cross'));
        if (s.ang && q.diagram.angles[s.ang]) { dgm.setText(s.ang, s.val + '\u00b0'); }
      });
      if (verdict) {
        var mkMax2 = verdict.mkMax || q.marks;
        var mkState2 = verdict.res === 'OK' ? ' mk-correct' : verdict.res === 'AMBER' ? ' mk-amber' : ' mk-wrong';
        margin.innerHTML = 'Q' + hooks.number + '<div class="mk-tally' + mkState2 + '" style="font-size:18px">' + (verdict.mk[0] + verdict.mk[1]) + '/' + (mkMax2[0] + mkMax2[1]) + '</div>';
        feedback.appendChild(el('div', 'mk-tally' + mkState2, 'Working ' + verdict.mk[0] + '/' + mkMax2[0] + ' \u00b7 Answer ' + verdict.mk[1] + '/' + mkMax2[1]));
      }
      checkRow.hidden = true;
      window.GJ.setState(wrap, 'question', 'locked-restore');
    } else {
      // resume an open attempt if one was mid-flight
      if (rec.att.length && !rec.att[rec.att.length - 1].res) {
        var open = rec.att.pop();
        cur.L = open.L || [];
        cur.steps = open.steps || [];
        cur.steps.forEach(function (s) {
          established[s.ang] = true;
          if (dgm) { dgm.setText(s.ang, s.val + '\u00b0'); }
        });
      }
      if (isAngles) buildAnglesUI();
      else {
        structuredBuilder = ({ subst: buildSubstUI, simplify: buildSimplifyUI, expand: buildExpandUI, solve: buildSolveUI, form: buildSolveUI })[q.type] || null;
        if (structuredBuilder) structuredBuilder(); else buildAlgebraUI();
      }
      redrawCurrent();
    }

    return { qid: q.id };
  }

  window.GJ_JOTTER = { mount: mount };
})();

</script>
<script>
/* MathShelf \u2014 the markbook's three new screens.
 *
 * WHY THIS FILE EXISTS. The first markbook answered every question a teacher
 * has with ONE instrument: a pupils-by-24-questions grid of glyphs. It was
 * judged "not fit for purpose", and the diagnosis is that a teacher's questions
 * come in an order and that grid answers none of them first:
 *
 *     how did my class do?   ->  the CLASS PAGE      (this file)
 *     who needs me?          ->  the same page, at the top, by name
 *     show me this exercise  ->  the EXERCISE VIEW   (this file)
 *     show me this question  ->  the QUESTION VIEW   (this file)
 *     show me this pupil     ->  the book view       (staff.js, unchanged)
 *
 * The old grid survives as "Full grid", one press away, for the teacher who
 * wants the whole thing at once.
 *
 * EVERYTHING HERE IS CLIENT-SIDE. staff.js already computes it all: it re-marks
 * every attempt with the real engines, names the misconceptions, and flags who
 * is struggling. Nothing new is asked of the server.
 *
 * THE LAWS THIS FILE IS WRITTEN UNDER:
 *   - every number sits in a region labelled with its BOOK and its EXERCISE
 *     (DFM 156c: a stat with no home is unreadable the moment two books are on)
 *   - the legend is visible without hovering (a smartboard has no hover)
 *   - every control that will not act says why, beside itself
 *   - every screen declares itself (data-surface / data-state)
 *   - the teacher register: economy by CUTTING sentences, never by compressing
 *     one into a fragment; no "she" for a pupil, name her.
 */
(function () {
  'use strict';

  var S = window.GJ_STAFF_PAGES = {};

  function T(k, vals) {
    var t = (window.GJ_STRINGS && window.GJ_STRINGS.teacher && window.GJ_STRINGS.teacher[k]) || '';
    return (window.GJ_STRINGS && window.GJ_STRINGS.fill) ? window.GJ_STRINGS.fill(t, vals) : t;
  }

  /* \u2550\u2550\u2550 THE FLAGS \u2014 a to-do with a reason, that clears itself \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550
     Three triggers, and each one is a sentence a teacher can act on without
     decoding anything:
       - wrong twice on a question
       - used the method help and is still wrong
       - nothing saved for a while, with the question open
     A chip disappears on the next poll after its condition ends: that is what
     makes it a to-do rather than a notice (DFM 160).
     Exported so a gate can run it against synthetic cells under node. */
  var STUCK_MINUTES = 8;
  S.needsYou = function (pupils, qlist, bookTitle, now) {
    now = now || Math.floor(Date.now() / 1000);
    var out = [];
    (pupils || []).forEach(function (p) {
      var sum = p.summary || {};
      var qs = sum.qs || {};
      qlist.forEach(function (item) {
        var c = qs[item.q.id];
        if (!c) return;
        var st = c.ovr === 1 ? 'ok' : c.ovr === 0 ? 'err' : c.st;
        var where = { book: bookTitle, exercise: item.exLabel, question: item.qLabel };
        if (st === 'err' && (c.at || 0) >= 2) {
          out.push({ email: p.email, name: p.name || p.email, qid: item.q.id,
            why: T('needsYouWrongTwice', where), rank: 3 });
          return;
        }
        if (c.help && st === 'err') {
          out.push({ email: p.email, name: p.name || p.email, qid: item.q.id,
            why: T('needsYouPulledHelp', where), rank: 4 });
          return;
        }
        if (st === 'open' && sum.upd && (now - sum.upd) > STUCK_MINUTES * 60) {
          out.push({ email: p.email, name: p.name || p.email, qid: item.q.id,
            why: T('needsYouStuck', { book: where.book, exercise: where.exercise, question: where.question,
              minutes: Math.floor((now - sum.upd) / 60) }), rank: 2 });
        }
      });
    });
    /* one chip per pupil: the most pressing reason wins, because a teacher with
       four chips for one girl has a list, not a flag */
    var best = {};
    out.forEach(function (f) { if (!best[f.email] || best[f.email].rank < f.rank) best[f.email] = f; });
    return Object.keys(best).map(function (k) { return best[k]; })
      .sort(function (a, b) { return b.rank - a.rank || a.name.localeCompare(b.name); });
  };

  /* \u2550\u2550\u2550 the shape of one exercise, from the cheap summary \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550 */
  S.exerciseStats = function (pupils, sec, si, dxNames) {
    var out = { started: 0, ok: 0, amber: 0, err: 0, open: 0, un: 0, slip: null, slipN: 0, dots: [] };
    var dxCount = {};
    sec.questions.forEach(function (q, qi) {
      var dot = { label: 'Q' + (qi + 1), ok: 0, bad: 0, mixed: 0, seen: 0 };
      (pupils || []).forEach(function (p) {
        var c = ((p.summary || {}).qs || {})[q.id];
        if (!c) { out.un++; return; }
        dot.seen++;
        var st = c.ovr === 1 ? 'ok' : c.ovr === 0 ? 'err' : c.st;
        if (st === 'ok') { out.ok++; dot.ok++; }
        else if (st === 'amber') { out.amber++; dot.mixed++; }
        else if (st === 'err') { out.err++; dot.bad++; if (c.dx) dxCount[c.dx] = (dxCount[c.dx] || 0) + 1; }
        else { out.open++; }
      });
      out.dots.push(dot);
    });
    out.started = out.ok + out.amber + out.err + out.open;
    var top = Object.keys(dxCount).sort(function (a, b) { return dxCount[b] - dxCount[a]; })[0];
    if (top) { out.slip = (dxNames && dxNames[top]) || top; out.slipN = dxCount[top]; }
    return out;
  };

  S.STUCK_MINUTES = STUCK_MINUTES;
})();

</script>
<script>
/* MathShelf \u2014 the teacher's markbook.
   Passcode-gated (server-side validated). Views: classes (create/delete,
   per-class activity tickboxes, link/QR) \u2192 Working Wall (live class grid,
   20 s poll) \u2192 Jotter Page drill-down (override: the teacher's judgement
   wins everywhere) \u2192 Marking Pile (misconception clusters + starter mode)
   \u2192 Same-Question Sweep. The app pre-marks; the teacher is the marker. */
(function () {
  'use strict';

  /* A MESSAGE SLOT IS A LIVE REGION, and it says so by construction rather than
     at forty call sites. It starts empty on purpose: that is what a live region
     is for, and it is why the empty-container audit must be able to tell it
     from a hole in the page. */
  function el(tag, cls, html) {
    var d = document.createElement(tag);
    if (cls) d.className = cls;
    if (html != null) d.innerHTML = html;
    if (cls && /\bui-msg\b/.test(cls) && !html) d.setAttribute('role', 'status');
    return d;
  }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }
  function pretty(s) { return String(s).replace(/-/g, '\u2212').replace(/\*/g, '\u00d7'); }

  /* A prominent pulsing GOLD wait-card, swapped into a .ui-msg element while a
     server round-trip runs (the OLS login-gated standard - bland grey text is
     not enough on a board). clearBusy restores plain text. html may contain
     entities; escape any pupil/class names yourself. */
  function busyCard(elm, html) {
    if (!elm) return;
    if (elm.getAttribute('data-base') === null) elm.setAttribute('data-base', elm.className);
    elm.className = 'panel-loading';
    elm.innerHTML = '<span class="panel-spinner" aria-hidden="true"></span><span>' + html + '</span>';
  }
  function clearBusy(elm, text) {
    if (!elm) return;
    var base = elm.getAttribute('data-base');
    elm.className = (base !== null) ? base : elm.className.replace(/\bpanel-loading\b/g, '').trim();
    elm.textContent = text || '';
  }
  /* Two-tap confirm dialog (mirrors showQr): a gj-modal above the panel.
     Never native confirm() - it is unreliable in the sandboxed iframe. */
  function openConfirm(title, bodyText, okLabel, cb) {
    var mroot = document.getElementById('gj-modal-root');
    if (mroot && mroot.children.length) return;   // never stack two dialogs
    var back = el('div', 'gj-modal-backdrop gj-modal-zstack');
    var card = el('div', 'gj-modal');
    card.innerHTML = '<h2>' + esc(title) + '</h2><p class="ui-msg">' + esc(bodyText) + '</p>' +
      '<div class="gj-confirm-actions"><button class="btn-pencil" id="gj-cf-cancel">Cancel</button>' +
      '<button class="btn-stamp" id="gj-cf-ok">' + esc(okLabel || 'Confirm') + '</button></div>';
    back.appendChild(card);
    mroot.appendChild(back);
    function done(v) { back.remove(); if (cb) cb(v); }
    card.querySelector('#gj-cf-ok').addEventListener('click', function () { done(true); });
    card.querySelector('#gj-cf-cancel').addEventListener('click', function () { done(false); });
    back.addEventListener('click', function (e) { if (e.target === back) done(false); });
    card.querySelector('#gj-cf-ok').focus();
  }

  var root = document.getElementById('scr-staff');
  var passcode = null;
  var classes = [];
  var meEmail = '';        // the signed-in teacher (server-verified)
  var isAdmin = false;     // true => deploy owner (HOD): sees every class
  var view = { cls: null, act: 'angles', wallTimer: null, wallSeq: 0, wallData: null };

  /* every teacher sentence comes from the one table (rule 23) */
  function TT(k, vals) {
    var t = (window.GJ_STRINGS && window.GJ_STRINGS.teacher && window.GJ_STRINGS.teacher[k]) || '';
    return (window.GJ_STRINGS && window.GJ_STRINGS.fill) ? window.GJ_STRINGS.fill(t, vals) : t;
  }
  /* WHAT THE SERVER SAID, IN WORDS. The markbook used to print the server's own
     code on a teacher's screen - "not-configured", "bad-act", "no-row" - which
     is a thing to look up, not a thing to act on. */
  function SAYS(code, fallback) {
    return (window.GJ_STRINGS && window.GJ_STRINGS.serverSays)
      ? window.GJ_STRINGS.serverSays(code, fallback) : fallback;
  }

  function call(sub, extra) {
    var p = { passcode: passcode, sub: sub };
    Object.keys(extra || {}).forEach(function (k) { p[k] = extra[k]; });
    return window.GJ.app.call('admin', p);
  }

  /* clipboard: navigator.clipboard \u2192 execCommand textarea \u2192 show the text */
  function copyText(text, msgEl, okMsg) {
    function done() { if (msgEl) msgEl.textContent = okMsg || 'Copied.'; }
    function legacy() {
      var ta = document.createElement('textarea');
      ta.value = text; ta.setAttribute('readonly', '');
      ta.style.cssText = 'position:fixed;left:-9999px';
      document.body.appendChild(ta); ta.select();
      var ok = false;
      try { ok = document.execCommand('copy'); } catch (e) {}
      ta.remove();
      if (ok) done(); else if (msgEl) msgEl.textContent = TT('copyByHand', { text: text });
    }
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, legacy);
    else legacy();
  }

  function classLink(name) {
    var base = (window.GJ.app.boot.baseUrl) ||
      (location.origin + location.pathname);
    return base + (base.indexOf('?') === -1 ? '?' : '&') + 'class=' + encodeURIComponent(name);
  }

  function stopPolling() { clearInterval(view.wallTimer); view.wallTimer = null; }

  /* \u2550\u2550\u2550 THE MARKBOOK'S CHROME \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550
     Dark glass at the top, light panels underneath: the shell/surface split.
     The breadcrumb is always visible, because a teacher who cannot see where
     she is cannot get back. `surfaceId`/`state` put the screen's name on its
     own root so a machine can prove every one of them was walked. */
  function shell(opts) {
    stopPolling();
    root.innerHTML = '';
    armRelock();

    var bar = el('div', 'staff-topbar');
    var mark = el('span', 'gj-wordmark');
    mark.setAttribute('data-ornament', '');
    mark.innerHTML = 'Math<b>Shelf</b>';
    bar.appendChild(mark);

    var crumb = el('nav', 'staff-crumb');
    crumb.setAttribute('aria-label', TT('whereYouAre'));
    (opts.crumbs || []).forEach(function (c, i) {
      if (i) crumb.appendChild(document.createTextNode('  \u203a  '));
      if (c.go) {
        var a = el('button', 'crumb-link', esc(c.label));
        a.addEventListener('click', c.go);
        crumb.appendChild(a);
      } else {
        crumb.appendChild(el('span', 'crumb-here', esc(c.label)));
      }
    });
    bar.appendChild(crumb);

    var right = el('div', 'staff-right');
    if (opts.live) {
      var live = el('span', 'live');
      live.innerHTML = '<i aria-hidden="true"></i>Live';
      right.appendChild(live);
    }
    var closeB = el('button', 'toolbtn', esc(TT('closeMarkbook')));
    closeB.addEventListener('click', closeMarkbook);
    right.appendChild(closeB);
    bar.appendChild(right);
    root.appendChild(bar);

    var main = el('div', 'staff-main');
    main.appendChild(opts.body);
    root.appendChild(main);

    window.GJ.surface(root, opts.surface || 'class-page', opts.state || 'loaded');
    window.GJ.app.showScreen('staff');
    window.scrollTo(0, 0);
  }

  /* \u2550\u2550\u2550 THE MARKBOOK RE-GATES WHEN IT IS LEFT (gates G-H4) \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550
     On a smartboard the class is looking at the front of the room. Leaving the
     markbook, or leaving it alone for fifteen minutes, closes it and asks for
     the passcode again; the passcode itself is never written to this device on
     the live tier. */
  var IDLE_RELOCK = 15 * 60 * 1000;
  var idleTimer = null;
  function armRelock() {
    clearTimeout(idleTimer);
    idleTimer = setTimeout(function () { closeMarkbook('idle'); }, IDLE_RELOCK);
  }
  function closeMarkbook(why) {
    stopPolling();
    clearTimeout(idleTimer);
    passcode = null;
    classes = [];
    view.wallData = null;
    root.innerHTML = '';               /* no class data left in the DOM */
    relockReason = why === 'idle' ? 'idle' : 'left';
    window.GJ.app.showScreen('cover');
  }
  var relockReason = null;
  ['pointerdown', 'keydown'].forEach(function (ev) {
    document.addEventListener(ev, function () { if (passcode) armRelock(); }, true);
  });

  /* \u2550\u2550\u2550 gate \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550 */
  function open() {
    if (passcode) { showClasses(); return; }
    var body = el('div', '');
    body.innerHTML =
      '<p class="ui-msg">The markbook is for staff. Enter the department passcode.</p>' +
      '<div class="check-row"><input id="st-pass" type="password" autocomplete="off" ' +
      'style="font-family:var(--f-stationery);font-size:15px;padding:10px;border:1.5px solid var(--navy);border-radius:4px;max-width:240px" ' +
      'aria-label="Staff passcode" />' +
      '<button id="st-go" class="btn-stamp">Open the markbook</button></div>' +
      '<p id="st-msg" class="ui-msg" role="alert"></p>';
    shell({ body: body, surface: 'staff-cover', state: 'passcode-empty', crumbs: [{ label: 'The markbook' }] });
    var go = body.querySelector('#st-go');
    function unlock() {
      if (go.disabled) return;
      go.disabled = true;
      busyCard(body.querySelector('#st-msg'), 'Checking the passcode&hellip; this can take a moment');
      var tryPass = body.querySelector('#st-pass').value;
      passcode = tryPass;
      call('classes').then(function (r) {
        go.disabled = false;
        if (!r || !r.ok) {
          passcode = null;
          clearBusy(body.querySelector('#st-msg'), SAYS(r && r.error, 'That passcode was not accepted.'));
          return;
        }
        classes = r.classes || [];
        meEmail = r.me || ''; isAdmin = !!r.isAdmin;
        showClasses();
      }).catch(function () {
        go.disabled = false; passcode = null;
        clearBusy(body.querySelector('#st-msg'), 'Could not reach the server \u2014 try again.');
      });
    }
    go.addEventListener('click', unlock);
    body.querySelector('#st-pass').addEventListener('keydown', function (e) { if (e.key === 'Enter') unlock(); });
    body.querySelector('#st-pass').focus();
  }

  /* \u2550\u2550\u2550 classes \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550 */
  function reloadClasses() {
    return call('classes').then(function (r) {
      if (r && r.ok) { classes = r.classes || []; meEmail = r.me || ''; isAdmin = !!r.isAdmin; }
    });
  }

  function showClasses() {
    var body = el('div', '');
    var scopeNote = isAdmin
      ? 'You are the markbook owner &mdash; you can see and manage every class.'
      : 'Showing the classes you created &mdash; each teacher sees only their own.';
    if (meEmail) scopeNote += ' <span style="opacity:.65">(' + esc(meEmail) + ')</span>';
    body.innerHTML =
      '<p class="ui-msg" style="margin-bottom:var(--sq)">' + scopeNote + '</p>' +
      '<div class="check-row" style="margin-bottom:var(--sq)">' +
      '<input id="st-newclass" type="text" maxlength="40" placeholder="e.g. 10B Maths" ' +
      'style="font-family:var(--f-stationery);font-size:15px;padding:10px;border:1.5px solid var(--navy);border-radius:4px;max-width:240px" aria-label="New class name" />' +
      '<button id="st-add" class="btn-stamp">Add a class</button>' +
      '<span id="st-cmsg" class="ui-msg" role="status"></span></div>' +
      '<table class="ledger"><thead><tr><th>Class</th><th>Pupils</th><th>Books on the shelf</th><th>What you can do</th></tr></thead>' +
      '<tbody id="st-rows"></tbody></table>' +
      '<p class="ui-msg" style="margin-top:var(--sq)">' + esc(TT('setUpHint')) + ' A book that is not ticked is closed for that class: pupils see it on the shelf, marked as not set yet, and cannot open it.</p>';
    shell({ body: body, surface: 'set-up', state: 'classes', crumbs: [{ label: isAdmin ? 'All classes' : 'Your classes' }] });
    var rows = body.querySelector('#st-rows');
    var cmsg = body.querySelector('#st-cmsg');

    function render() {
      rows.innerHTML = '';
      if (!classes.length) {
        rows.innerHTML = '<tr><td colspan="4" class="ui-msg">No classes yet \u2014 add your first class above, then share its link with the pupils.</td></tr>';
      }
      classes.forEach(function (c) {
        var tr = document.createElement('tr');
        var ticks = el('td', '');
        var tickWrap = el('div', 'acts-ticks');
        /* GROUPED BY SERIES, WITH THE AUDIENCE BAND ON EVERY ROW. The tickboxes
           ARE the level system (rule 17): there is no class "level" field and
           there never will be, so what a teacher needs beside each book is who
           it is for. A J3 class gets the KS3 books; an S1 GCSE class gets the
           GCSE ones; nothing has to be administered to make that true. */
        var groups = {};
        window.GJ.app.activities.forEach(function (a) {
          var key = a.series || 'Other';
          (groups[key] = groups[key] || []).push(a);
        });
        Object.keys(groups).sort().forEach(function (key) {
          tickWrap.appendChild(el('p', 'ticks-series', esc(key)));
          groups[key].forEach(addTick);
        });
        function addTick(a) {
          var lab = el('label', 'tickbox');
          var cb = document.createElement('input');
          cb.type = 'checkbox';
          cb.checked = !!(c.acts && c.acts[a.id]);
          cb.addEventListener('change', function () {
            var acts = {};
            window.GJ.app.activities.forEach(function (a2) { acts[a2.id] = a2.id === a.id ? cb.checked : !!(c.acts && c.acts[a2.id]); });
            cb.disabled = true;
            call('setActs', { className: c.name, acts: acts }).then(function (r) {
              cb.disabled = false;
              if (r && r.ok) { c.acts = acts; cmsg.textContent = a.title + (cb.checked ? ' is now on ' : ' removed from ') + c.name + '\u2019s shelf.'; }
              else { cb.checked = !cb.checked; cmsg.textContent = SAYS(r && r.error, TT('couldNotSave')); }
            }).catch(function () { cb.disabled = false; cb.checked = !cb.checked; cmsg.textContent = TT('couldNotSave'); });
          });
          lab.appendChild(cb);
          lab.appendChild(document.createTextNode(a.title));
          var band = el('span', 'tick-band', esc(a.band || ''));
          lab.appendChild(band);
          tickWrap.appendChild(lab);
        }
        ticks.appendChild(tickWrap);

        var actions = el('td', '');
        var wallB = el('button', 'toolbtn', 'Open the markbook');
        wallB.addEventListener('click', function () { view.cls = c.name; showClassPage(); });
        var linkB = el('button', 'btn-pencil', esc(TT('copyLink')));
        linkB.style.marginLeft = '6px';
        linkB.addEventListener('click', function () { copyText(classLink(c.name), cmsg, 'Link for ' + c.name + ' copied.'); });
        var qrB = el('button', 'btn-pencil', 'QR');
        qrB.style.marginLeft = '6px';
        qrB.addEventListener('click', function () { showQr(c.name); });
        var delB = el('button', 'btn-pencil', '&times;');
        delB.setAttribute('aria-label', TT('deleteClassAria', { 'class': c.name }));
        delB.style.marginLeft = '6px';
        delB.addEventListener('click', function () {
          openConfirm('Delete ' + c.name + '?',
            'This deletes ' + c.name + ' and all its work from the markbook. This cannot be undone.',
            'Delete class', function (yes) {
              if (!yes) return;
              delB.disabled = true;
              busyCard(cmsg, 'Deleting ' + esc(c.name) + '&hellip; this can take a moment');
              call('deleteClass', { className: c.name }).then(function (r) {
                if (r && r.ok) { classes = classes.filter(function (x) { return x.name !== c.name; }); render(); clearBusy(cmsg, c.name + ' deleted.'); }
                else { delB.disabled = false; clearBusy(cmsg, SAYS(r && r.error, 'Could not delete.')); }
              }).catch(function () { delB.disabled = false; clearBusy(cmsg, ''); staffError(TT('noServer'), cmsg); });
            });
        });
        actions.appendChild(wallB); actions.appendChild(linkB); actions.appendChild(qrB); actions.appendChild(delB);

        tr.appendChild(el('td', '', '<b>' + esc(c.name) + '</b>'));
        tr.appendChild(el('td', '', String(c.count || 0)));
        tr.appendChild(ticks);
        tr.appendChild(actions);
        rows.appendChild(tr);
      });
    }
    render();

    var addB = body.querySelector('#st-add');
    addB.addEventListener('click', function () {
      if (addB.disabled) return;
      var nm = body.querySelector('#st-newclass').value.trim();
      if (!nm) { cmsg.textContent = TT('nameTheClass'); return; }
      addB.disabled = true;
      busyCard(cmsg, 'Adding ' + esc(nm) + '&hellip; this can take a moment');
      call('addClass', { className: nm }).then(function (r) {
        addB.disabled = false;
        if (r && r.ok) {
          /* A NEW CLASS ARRIVES WITH NOTHING TICKED, whatever the server sent:
             the teacher chooses what her class sees, and a book nobody chose is
             a book nobody meant. */
          classes.push({ name: r.name, acts: r.acts || {}, count: 0 });
          body.querySelector('#st-newclass').value = '';
          render();
          clearBusy(cmsg, r.name + ' added with both books on its shelf \u2014 untick any you want to hold back, then copy its link.');
          reloadClasses().then(render);
        } else clearBusy(cmsg, SAYS(r && r.error, 'Could not add that class.'));
      }).catch(function () { addB.disabled = false; clearBusy(cmsg, 'Could not reach the server.'); });
    });
  }

  function showQr(name) {
    var back = el('div', 'gj-modal-backdrop gj-modal-zstack');
    var card = el('div', 'gj-modal gj-qr');

      '<p class="ui-msg" style="word-break:break-all">' + esc(classLink(name)) + '</p>' +
      '<div class="check-row"><button class="btn-stamp" id="st-qr-copy">Copy link</button>' +
      '<button class="btn-pencil" id="st-qr-close">Close</button></div><p class="ui-msg" id="st-qmsg"></p>';
    back.appendChild(card);
    document.getElementById('gj-modal-root').appendChild(back);
