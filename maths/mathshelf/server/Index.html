.act-bar {
  background: var(--glass-solid); border-bottom: 1px solid var(--line-glow);
  backdrop-filter: blur(8px); color: var(--chalk);
  display: flex; align-items: center; gap: 18px; padding: 13px clamp(14px, 3vw, 26px);
}
.act-bar-eyebrow { font-family: var(--f-mono); font-size: 12px; letter-spacing: .08em; color: var(--chalk-muted); }
.act-bar-title { font-family: var(--f-display); font-size: clamp(18px, 4vw, 24px); font-weight: 600; color: #fff; }
.btn-back {
  font: 500 14px var(--f-ui); color: var(--chalk); background: var(--glass);
  border: 1px solid var(--line-glow); border-radius: 7px; padding: 9px 15px; min-height: 44px; cursor: pointer;
}
.btn-back:hover { border-color: var(--gold); color: var(--gold-hi); }
.contents-strip {
  display: flex; gap: 8px; overflow-x: auto; padding: 12px clamp(14px, 3vw, 26px);
  border-bottom: 1px solid var(--line-glow);
}
.contents-strip button {
  font: 500 14px var(--f-ui); color: var(--chalk-muted); background: var(--glass);
  border: 1px solid var(--line-glow); border-radius: 7px; padding: 9px 14px; min-height: 44px; white-space: nowrap;
}
.contents-strip button[aria-current="true"] { color: #fff; border-color: var(--gold); }

/* \2500 \2500  WORK SURFACES stay LIGHT, whatever the shell does \2500 \2500 \2500 \2500 \2500 \2500 \2500 \2500 \2500 \2500 \2500 \2500 \2500 \2500 
   [data-work] declares "anything drawn here must end up on a light ground";
   it does NOT paint one. The colour law walks up to the nearest painted
   ancestor, so a column inside the paper inherits the paper \2014  and does not
   become a card with an invisible edge that a diagram can be condemned for
   crossing. The surfaces that ARE cards paint themselves, below. */
[data-work] {
  color: var(--ink);
}
/* the question body is a COLUMN inside the paper, not a card of its own: it
   inherits the paper's ground rather than painting a second one, so a phone
   diagram reclaiming the margin gutter is not crossing an edge that exists */
.act-paper, .movie, .paper, .panel {
  background: var(--paper);
  color: var(--ink);
}
.act-paper h1, .act-paper h2, .act-paper h3,
[data-work] h1, [data-work] h2, [data-work] h3 { color: var(--navy); }

/* \2500 \2500  CELEBRATION: gold, and only here \2500 \2500 \2500 \2500 \2500 \2500 \2500 \2500 \2500 \2500 \2500 \2500 \2500 \2500 \2500 \2500 \2500 \2500 \2500 \2500 \2500 \2500 \2500 \2500 \2500 \2500 \2500 \2500 \2500  */
[data-celebrate] { color: var(--gold); }
[data-celebrate].bloom { box-shadow: var(--glow-gold); }

/* \2500 \2500  THE MARKBOOK'S CHROME \2500 \2500 \2500 \2500 \2500 \2500 \2500 \2500 \2500 \2500 \2500 \2500 \2500 \2500 \2500 \2500 \2500 \2500 \2500 \2500 \2500 \2500 \2500 \2500 \2500 \2500 \2500 \2500 \2500 \2500 \2500 \2500 \2500 \2500 \2500 \2500 \2500 \2500 \2500 \2500  */
.staff-topbar {
  background: var(--glass-solid); border-bottom: 1px solid var(--line-glow); backdrop-filter: blur(8px);
  color: var(--chalk); display: flex; align-items: center; gap: 18px; padding: 13px clamp(14px, 3vw, 26px);
}
.staff-crumb { font-family: var(--f-mono); font-size: 12px; letter-spacing: .08em; color: var(--chalk-muted); }
.staff-crumb a { color: var(--teal-glow); text-decoration: none; }
.staff-right { margin-left: auto; display: flex; align-items: center; gap: 16px; font-size: 13px; color: var(--chalk-muted); }
.live { display: inline-flex; align-items: center; gap: 6px; }
.live i { width: 7px; height: 7px; border-radius: 50%; background: var(--teal-glow); box-shadow: 0 0 8px rgba(45, 212, 191, .8); display: inline-block; }
.stat-chip {
  font-family: var(--f-mono); font-size: 13px; color: var(--chalk-muted);
  border: 1px solid var(--line-glow); background: var(--glass); border-radius: 7px; padding: 7px 12px;
}
 /* A NUMBER IS DATA, NOT PRESTIGE. Gold on a value makes the value look like
    a status; the count of pupils in a class is neither. */
.stat-chip b { color: var(--chalk); font-weight: 600; }
.toolbtn {
  font: 500 14px var(--f-ui); color: var(--chalk); background: var(--glass);
  border: 1px solid var(--line-glow); border-radius: 7px; padding: 10px 15px; min-height: 40px; cursor: pointer;
}
.toolbtn:hover { border-color: var(--gold); color: var(--gold-hi); }
.toolbtn[disabled] { opacity: .55; cursor: default; }

/* every teacher DATA surface is a light panel on the dark chrome */
.staff-panel {
  background: var(--panel); color: var(--ink); border-radius: 10px;
  box-shadow: 0 10px 30px rgba(0, 0, 0, .35);
}

/* \2500 \2500  THE PROJECTOR: 1280x720, read from the back of the room \2500 \2500 \2500 \2500 \2500 \2500  */
@media (min-width: 1200px) and (max-height: 760px) {
  body.gj { font-size: 17px; }
  .staff-crumb, .stat-chip { font-size: 13px; }
  .toolbtn, .btn-back { min-height: 44px; }
}

/* \2500 \2500  PHONE \2500 \2500 \2500 \2500 \2500 \2500 \2500 \2500 \2500 \2500 \2500 \2500 \2500 \2500 \2500 \2500 \2500 \2500 \2500 \2500 \2500 \2500 \2500 \2500 \2500 \2500 \2500 \2500 \2500 \2500 \2500 \2500 \2500 \2500 \2500 \2500 \2500 \2500 \2500 \2500 \2500 \2500 \2500 \2500 \2500 \2500 \2500 \2500 \2500 \2500 \2500 \2500 \2500 \2500 \2500 \2500  */
@media (max-width: 520px) {
  .scr-shelf { padding: 28px 16px 48px; }
  .shelf-row { gap: 18px; }
  .bcover { min-height: 176px; padding: 18px 16px 20px; }
}

/* \2500 \2500  THE PREVIEW SAYS IT IS THE PREVIEW \2500 \2500 \2500 \2500 \2500 \2500 \2500 \2500 \2500 \2500 \2500 \2500 \2500 \2500 \2500 \2500 \2500 \2500 \2500 \2500 \2500 \2500 \2500 \2500 \2500 \2500 \2500 \2500 \2500 
   A public copy that saves nowhere must say so: pinned to the top, above
   everything, for the whole session, in a colour that is not the shell's and
   is not a marking colour either. (gates G-F6) */
.gj-preview-banner {
  position: sticky; top: 0; z-index: 60;
  background: #2563EB; color: #fff;
  font: 500 14px var(--f-ui); text-align: center;
  padding: 9px 16px; letter-spacing: .01em;
}

/* \2500 \2500  A SAVE THAT HAS NOT LANDED SAYS SO \2500 \2500 \2500 \2500 \2500 \2500 \2500 \2500 \2500 \2500 \2500 \2500 \2500 \2500 \2500 \2500 \2500 \2500 \2500 \2500 \2500 \2500 \2500 \2500 \2500 \2500 \2500 \2500 \2500 
   Never a screen that claims saving that is not happening. (rule 22) */
.gj-save-trouble {
  position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%);
  z-index: 70; display: flex; align-items: center; gap: 12px;
  background: var(--glass-solid); color: var(--chalk);
  border: 1px solid var(--gold); border-radius: 10px;
  padding: 12px 16px; font: 500 14px var(--f-ui);
  box-shadow: 0 10px 30px rgba(0, 0, 0, .45);
}

/* \2500 \2500  THE SCREENS SIT ON THE SHELL, NOT ON A GROUND OF THEIR OWN \2500 \2500 \2500 \2500 \2500 
   One layer paints the ground (body::before). A screen that paints its own
   would hide it, which is exactly what the v3 cover's navy radial did on the
   first run of this build: the shell was correct in the stylesheet and navy in
   the pixels. That is why the colour law is measured in pixels and not in
   source (L7). */
.gj-screen { background: transparent; }
.scr-cover, .scr-shelf, .scr-activity, .scr-staff { background: transparent; background-image: none; }
/* the paper a pupil works on stays paper */
.act-paper { background: var(--paper); color: var(--ink); }

/* \2550 \2550  THE MARKBOOK \2550 \2550 \2550 \2550 \2550 \2550 \2550 \2550 \2550 \2550 \2550 \2550 \2550 \2550 \2550 \2550 \2550 \2550 \2550 \2550 \2550 \2550 \2550 \2550 \2550 \2550 \2550 \2550 \2550 \2550 \2550 \2550 \2550 \2550 \2550 \2550 \2550 \2550 \2550 \2550 \2550 \2550 \2550 \2550 \2550 \2550 \2550 \2550 \2550 \2550 \2550 
   Dark glass chrome, light panels for every number. A teacher reads data on
   paper; the drama is behind it, never on it. */
.staff-main { padding: 0 clamp(14px, 3vw, 32px) 40px; }
.crumb-link { font: inherit; color: var(--teal-glow); background: none; border: none; padding: 6px 2px; min-height: 40px; cursor: pointer; text-decoration: none; }

.cp-books { display: flex; gap: 8px; padding: 22px 0 4px; flex-wrap: wrap; }

.needs {

}
.needs-lbl { font-family: var(--f-mono); font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--teal-glow); margin-bottom: 10px; }

.pupilchip {

}
.pupilchip:hover, .pupilchip:focus-visible { border-color: var(--gold); }

.pupilchip .why { font-size: 13px; color: var(--pencil); }
.pupilchip .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--now); flex: none; }

.excards { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(340px, 100%), 1fr)); gap: 16px; padding: 18px 0 8px; }
.excard {
  background: var(--panel); color: var(--ink); border-radius: 10px; padding: 18px 20px 16px;
  cursor: pointer; border: 1px solid transparent; box-shadow: 0 10px 30px rgba(0, 0, 0, .35);
  text-align: left; font: inherit; display: block; width: 100%;
}
.excard:hover, .excard:focus-visible { border-color: var(--gold); }

.excard .walt { font-size: 13px; color: var(--pencil); margin-bottom: 12px; }
.propbar { display: flex; height: 10px; border-radius: 5px; overflow: hidden; background: var(--hairline); }
.propbar i { display: block; height: 10px; }
.p-ok { background: var(--marking-green); } .p-am { background: var(--amber-flag); }
.p-err { background: var(--marking-red); }  .p-now { background: var(--now); } .p-un { background: #D8D4CA; }
.slipline { display: flex; align-items: baseline; gap: 8px; margin-top: 11px; font-size: 14px; }

.lg-ok { color: #4ADE80; } .lg-am { color: #FBBF24; } .lg-err { color: #F87171; }

/* S2 the exercise view */

.grid { margin: 14px 0 20px; border-radius: 10px; overflow: auto; background: var(--panel); color: var(--ink); }

.grid th, .grid td { border-bottom: 1px solid var(--hairline); padding: 9px 14px; text-align: center; }
.grid th { font: 600 13px var(--f-ui); color: var(--ink); vertical-align: bottom; }
.grid th .gist { display: block; font-family: var(--f-maths); font-weight: 400; font-size: 13.5px; color: var(--pencil); max-width: 190px; }
.grid th .mini { display: flex; height: 4px; border-radius: 2px; overflow: hidden; background: var(--hairline); margin-top: 7px; }
.grid th .mini i { display: block; height: 4px; }
.grid td.nm, .grid th.nm { text-align: left; font-weight: 600; position: sticky; left: 0; background: var(--panel); min-width: 170px; }
.g-ok { color: var(--marking-green); font-weight: 700; }
.g-am { color: var(--amber-flag); font-weight: 700; }
.g-err { color: var(--marking-red); font-weight: 700; }
.g-err sup { font-family: var(--f-mono); font-size: 10px; }
.g-now { color: var(--now); } .g-un { color: #C9C4B8; }

/* S3 the question view */
.qv-col { display: grid; gap: 14px; padding-bottom: 24px; }
.qv-card { padding: 14px 18px; }
.qv-who { font-weight: 600; font-size: 15px; color: var(--ink); }

/* the class page's own legend IS a key to marks, so it wears marking colours

.cp-legend { }

<script>

/* ONE DOOR. Every call goes to apiCall on the FRONT DOOR deployment, which
   verifies who is asking and relays it to the DATA deployment with the shared
   secret. The client knows neither the secret nor the data URL, and cannot:
   it only ever names an action and a payload. */
window.OLS_TRANSPORT = {
  call: function (p) {
    return new Promise(function (resolve, reject) {
      var g = google.script.run.withSuccessHandler(resolve).withFailureHandler(reject);
      var cls = (p.classCode != null) ? p.classCode : p['class'];
      var payload;
      switch (p.action) {
        case 'whoami':  payload = {}; break;
        case 'hello':   payload = { classCode: cls, bootName: (window.OLS_BOOT && window.OLS_BOOT.name) || '' }; break;
        case 'load':    payload = { classCode: cls, act: p.act }; break;
        case 'save':    payload = { classCode: cls, act: p.act, state: p.state, summary: p.summary }; break;
        case 'setname': payload = { classCode: cls, name: p.name }; break;
        case 'admin':   payload = { passcode: p.passcode, sub: p.sub, className: p.className, acts: p.acts, act: p.act, email: p.email, q: p.q, idx: p.idx, val: p.val, sec: p.sec }; break;
        default: reject(new Error('unknown action ' + p.action)); return;
      }
      g.apiCall({ action: p.action, payload: payload });
    });
  }
};
</script>

<script>
/* MathShelf - algebra marking engine. Pure logic, no DOM.
   Exact rational arithmetic throughout: correctness decisions never touch
   floating point. A working line is parsed to an exact polynomial (degree
   <= 2) per side; a solving step is sound iff the new equation's solution
   set EXACTLY equals the previous line's (tested by proportionality of the
   normalised difference polynomials, which for linear equations is the
   same thing and also guards degree changes). See INTERFACES.md. */
(function () {
  'use strict';

  /* ---- rationals {n, d}: d > 0, gcd(|n|, d) = 1 ------------------- */
  function gcd(a, b) { a = Math.abs(a); b = Math.abs(b); while (b) { var t = a % b; a = b; b = t; } return a || 1; }
  function rat(n, d) {
    d = (d == null) ? 1 : d;
    if (d === 0) return null;
    if (d < 0) { n = -n; d = -d; }
    var g = gcd(n, d);
    return { n: n / g, d: d / g };
  }
  function radd(a, b) { return rat(a.n * b.d + b.n * a.d, a.d * b.d); }
  function rsub(a, b) { return rat(a.n * b.d - b.n * a.d, a.d * b.d); }
  function rmul(a, b) { return rat(a.n * b.n, a.d * b.d); }
  function rdiv(a, b) { if (b.n === 0) return null; return rat(a.n * b.d, a.d * b.n); }
  function rneg(a) { return rat(-a.n, a.d); }
  function req(a, b) { return a && b && a.n === b.n && a.d === b.d; }
  function rzero(a) { return a && a.n === 0; }
  function rfromstr(s) {
    s = String(s).trim();
    var m = s.match(/^(-?\d+)\s*\/\s*(-?\d+)$/);
    if (m) return rat(parseInt(m[1], 10), parseInt(m[2], 10));
    m = s.match(/^(-?)(\d*)\.(\d+)$/);
    if (m) {
      var sign = m[1] === '-' ? -1 : 1;
      var whole = m[2] ? parseInt(m[2], 10) : 0;
      var frac = parseInt(m[3], 10), pow = Math.pow(10, m[3].length);
      return rat(sign * (whole * pow + frac), pow);
    }
    m = s.match(/^-?\d+$/);
    if (m) return rat(parseInt(s, 10), 1);
    return null;
  }
  function rtostr(a) { return a.d === 1 ? String(a.n) : (a.n + '/' + a.d); }

  /* ---- polynomials in x, degree <= 2: {c2, c1, c0} rationals ------ */
  function P(c2, c1, c0) { return { c2: c2 || rat(0, 1), c1: c1 || rat(0, 1), c0: c0 || rat(0, 1) }; }
  function pConst(r) { return P(null, null, r); }
  function pAdd(a, b) { return P(radd(a.c2, b.c2), radd(a.c1, b.c1), radd(a.c0, b.c0)); }
  function pSub(a, b) { return P(rsub(a.c2, b.c2), rsub(a.c1, b.c1), rsub(a.c0, b.c0)); }
  function pNeg(a) { return P(rneg(a.c2), rneg(a.c1), rneg(a.c0)); }
  function pMul(a, b) { // null if the product's degree would exceed 2
    var bad = (!rzero(a.c2) && (!rzero(b.c1) || !rzero(b.c2))) ||
              (!rzero(b.c2) && (!rzero(a.c1) || !rzero(a.c2)));
    if (bad) return null;
    var d2 = radd(radd(rmul(a.c2, b.c0), rmul(a.c0, b.c2)), rmul(a.c1, b.c1));
    return P(d2, radd(rmul(a.c1, b.c0), rmul(a.c0, b.c1)), rmul(a.c0, b.c0));
  }
  function pDivC(a, r) { if (!r || r.n === 0) return null; return P(rdiv(a.c2, r), rdiv(a.c1, r), rdiv(a.c0, r)); }
  function pIsConst(a) { return rzero(a.c2) && rzero(a.c1); }
  function pIsZero(a) { return pIsConst(a) && rzero(a.c0); }
  function pEq(a, b) { return req(a.c2, b.c2) && req(a.c1, b.c1) && req(a.c0, b.c0); }
  function pDeg(a) { return !rzero(a.c2) ? 2 : !rzero(a.c1) ? 1 : 0; }
  /* g == k * f for some k != 0 ? (same solution set for our school cases) */
  function pProportional(f, g) {
    if (pIsZero(f) || pIsZero(g)) return pIsZero(f) && pIsZero(g);
    var k = null;
    var pairs = [[f.c2, g.c2], [f.c1, g.c1], [f.c0, g.c0]];
    for (var i = 0; i < 3; i++) {
      var a = pairs[i][0], b = pairs[i][1];
      if (rzero(a) !== rzero(b)) return false;
      if (!rzero(a)) {
        var r = rdiv(b, a);
        if (k === null) k = r;
        else if (!req(k, r)) return false;
      }
    }
    return k !== null && k.n !== 0;
  }
  function pKey(f) { // stable cluster key: monic-normalised serialisation
    if (pIsZero(f)) return '0';
    var lead = !rzero(f.c2) ? f.c2 : !rzero(f.c1) ? f.c1 : f.c0;
    var n = pDivC(f, lead);
    return ['x2', rtostr(n.c2), 'x', rtostr(n.c1), 'c', rtostr(n.c0)].join(':');
  }

  /* ---- tokeniser + recursive-descent parser ----------------------- */
  function normalise(src) {
    return String(src)
      .replace(/\u2212/g, '-').replace(/\u00d7/g, '*').replace(/\u00f7/g, '/')
      .replace(/\u00b2/g, '^2').replace(/\s+/g, '')
      .replace(/X/g, 'x');
  }
  function tokenise(s, allowLetters) {
    var toks = [], i = 0;
    while (i < s.length) {
      var c = s[i];
      if (/[0-9.]/.test(c)) {
        var j = i;
        while (j < s.length && /[0-9.]/.test(s[j])) j++;
        var num = rfromstr(s.slice(i, j));
        if (!num) return { err: 'bad number "' + s.slice(i, j) + '"' };
        toks.push({ t: 'num', v: num });
        i = j;
      } else if (c === 'x') {
        // 'x' immediately followed by a digit is rejected: pupils mean x squared,
        // but 'x2' is not that (INTERFACES.md). x^2 and x\u00b2 (normalised to x^2) are fine.
        if (i + 1 < s.length && /[0-9]/.test(s[i + 1])) return { err: 'write x squared as x^2, not "x' + s[i + 1] + '"' };
        toks.push({ t: 'x' }); i++;
      } else if (allowLetters && /[a-wyz]/.test(c)) {
        toks.push({ t: 'var', v: c }); i++;
      } else if ('+-*/()^='.indexOf(c) !== -1) {
        toks.push({ t: c }); i++;
      } else {
        return { err: 'unexpected "' + c + '"' };
      }
    }
    return { toks: toks };
  }

  /* parses one side into a poly (or err). vars: optional {letter: rat}
     so substitution lines evaluate letters as constants. */
  function parseSide(toks, vars) {
    var pos = 0, err = null;
    function peek() { return toks[pos]; }
    function take() { return toks[pos++]; }
    function parseExpr() {
      var sign = 1;
      while (peek() && (peek().t === '+' || peek().t === '-')) {
        if (take().t === '-') sign = -sign;
      }
      var left = parseTerm();
      if (!left) return null;
      if (sign < 0) left = pNeg(left);
      while (peek() && (peek().t === '+' || peek().t === '-')) {
        var op = take().t;
        var right = parseTerm();
        if (!right) return null;
        left = op === '+' ? pAdd(left, right) : pSub(left, right);
      }
      return left;
    }
    function parseTerm() {
      var left = parseUnary();
      if (!left) return null;
      for (;;) {
        var nx = peek();
        if (!nx) break;
        if (nx.t === '*' || nx.t === '/') {
          take();
          var right = parseUnary();
          if (!right) return null;
          if (nx.t === '*') {
            left = pMul(left, right);
            if (!left) { err = 'degree above x squared'; return null; }
          } else {
            if (!pIsConst(right)) { err = 'x in a denominator'; return null; }
            left = pDivC(left, right.c0);
            if (!left) { err = 'division by zero'; return null; }
          }
        } else if (nx.t === 'num' || nx.t === 'x' || nx.t === '(' || nx.t === 'var') {
          var right2 = parseUnary(); // implicit multiplication: 5(x-3), 2x, ab
          if (!right2) return null;
          left = pMul(left, right2);
          if (!left) { err = 'degree above x squared'; return null; }
        } else break;
      }
      return left;
    }
    function parseUnary() {
      var sign = 1;
      while (peek() && (peek().t === '+' || peek().t === '-')) {
        if (take().t === '-') sign = -sign;
      }
      var p = parsePow();
      if (!p) return null;
      return sign < 0 ? pNeg(p) : p;
    }
    function parsePow() {
      var base = parsePrimary();
      if (!base) return null;
      if (peek() && peek().t === '^') {
        take();
        var e = take();
        if (!e || e.t !== 'num' || e.v.d !== 1 || e.v.n < 0) { err = 'bad power'; return null; }
        var n2 = e.v.n;
        if (n2 === 0) return pConst(rat(1, 1));
        var acc = base;
        for (var i = 1; i < n2; i++) {
          acc = acc && pMul(acc, base);
          if (!acc) { err = 'degree above x squared'; return null; }
        }
        return acc;
      }
      return base;
    }
    function parsePrimary() {
      var tk = peek();
      if (!tk) { err = 'line ends early'; return null; }
      if (tk.t === 'num') { take(); return pConst(tk.v); }
      if (tk.t === 'x') { take(); return P(null, rat(1, 1), null); }
      if (tk.t === 'var') {
        take();
        if (!vars || !(tk.v in vars)) { err = 'unknown letter "' + tk.v + '"'; return null; }
        return pConst(vars[tk.v]);
      }
      if (tk.t === '(') {
        take();
        var inner = parseExpr();
        if (!inner) return null;
        var close = take();
        if (!close || close.t !== ')') { err = 'missing bracket'; return null; }
        return inner;
      }
      err = 'unexpected "' + tk.t + '"';
      return null;
    }
    var out = parseExpr();
    if (out && pos !== toks.length) { out = null; err = err || 'could not read the whole line'; }
    return out ? { poly: out } : { err: err || 'unreadable' };
  }

  function parse(str, vars) {
    if (str == null || String(str).trim() === '') return { ok: false, err: 'empty line' };
    var s = normalise(str);
    var eqAt = s.indexOf('=');
    if (eqAt !== -1 && s.indexOf('=', eqAt + 1) !== -1) return { ok: false, err: 'two equals signs' };
    var sides = eqAt === -1 ? [s] : [s.slice(0, eqAt), s.slice(eqAt + 1)];
    if (sides.some(function (x) { return x === ''; })) return { ok: false, err: 'empty side of the equation' };
    var parsed = [];
    for (var i = 0; i < sides.length; i++) {
      var tk = tokenise(sides[i], !!vars);
      if (tk.err) return { ok: false, err: tk.err };
      var side = parseSide(tk.toks, vars);
      if (side.err) return { ok: false, err: side.err };
      parsed.push(side);
    }
    return {
      ok: true,
      ast: { eq: sides.length === 2, lhs: parsed[0], rhs: parsed[1] || null }
    };
  }
  function canonSide(side) { return side && side.poly ? side.poly : null; }
  function lineKind(parsed) { return parsed && parsed.ok && parsed.ast.eq ? 'eq' : 'expr'; }

  function eqF(ast) { return pSub(ast.lhs.poly, ast.rhs.poly); }

  function eqStep(prevStr, nextStr) {
    var p = parse(prevStr), n = parse(nextStr);
    if (!p.ok || !n.ok) return { ok: 'parse' };
    if (!p.ast.eq || !n.ast.eq) return { ok: 'notequiv', dxText: 'an equation must keep its equals sign' };
    var f = eqF(p.ast), g = eqF(n.ast);
    if (pIsZero(g)) return { ok: 'identity' };
    if (pIsZero(f)) return { ok: 'notequiv' };
    if (pDeg(g) > pDeg(f)) return { ok: 'notequiv', dxText: 'this step raises the power of x' };
    return pProportional(f, g) ? { ok: 'sound' } : { ok: 'notequiv' };
  }

  function exprStep(prevStr, nextStr) {
    var p = parse(prevStr), n = parse(nextStr);
    if (!p.ok || !n.ok) return { ok: 'parse' };
    if (p.ast.eq !== n.ast.eq) return { ok: 'notequiv' };
    if (p.ast.eq) return eqStep(prevStr, nextStr);
    return pEq(p.ast.lhs.poly, n.ast.lhs.poly) ? { ok: 'sound' } : { ok: 'notequiv' };
  }

  function inferOp(prevStr, nextStr) {
    var p = parse(prevStr), n = parse(nextStr);
    if (!p.ok || !n.ok || !p.ast.eq || !n.ast.eq) return null;
    var pl = p.ast.lhs.poly, pr = p.ast.rhs.poly;
    var nl = n.ast.lhs.poly, nr = n.ast.rhs.poly;
    if (pEq(nl, pl) && pEq(nr, pr)) return { op: 'rewrite' };
    if (pEq(nl, pr) && pEq(nr, pl)) return { op: 'rewrite' };           // swapped sides
    var dL = pSub(nl, pl), dR = pSub(nr, pr);
    if (pEq(dL, dR)) {
      if (pIsZero(dL)) return { op: 'rewrite' };
      if (pIsConst(dL)) return dL.c0.n > 0 ? { op: '+', operand: dL.c0 } : { op: '-', operand: rneg(dL.c0) };
      return { op: dL.c1.n > 0 ? '+' : '-', operand: null };            // moved an x-term
    }
    if (!pIsZero(pl) && pProportional(pl, nl)) {
      var lead = !rzero(pl.c2) ? [pl.c2, nl.c2] : !rzero(pl.c1) ? [pl.c1, nl.c1] : [pl.c0, nl.c0];
      var k = rdiv(lead[1], lead[0]);
      if (k && pEq(nr, pMul(pr, pConst(k)))) {
        if (k.n === 1 && k.d !== 1) return { op: '/', operand: rat(k.d, 1) };
        return { op: '*', operand: k };
      }
    }
    return null;
  }

  function evalCalc(str) {
    var p = parse(str);
    if (!p.ok || p.ast.eq) return { ok: false };
    var poly = p.ast.lhs.poly;
    if (!pIsConst(poly)) return { ok: false };
    return { ok: true, val: poly.c0 };
  }

  function substEval(exprStr, vars) {
    var p = parse(exprStr, vars || {});
    if (!p.ok || p.ast.eq) return { ok: false };
    var poly = p.ast.lhs.poly;
    if (!pIsConst(poly)) return { ok: false };
    return { ok: true, val: poly.c0 };
  }

  /* ---- dx matching (canonical, never string comparison) ----------- */
  function dxLookup(q, lineStr) {
    if (!q.dx) return null;
    var pl = parse(lineStr);
    if (!pl.ok) return null;
    var keys = Object.keys(q.dx);
    for (var i = 0; i < keys.length; i++) {
      var pk = parse(keys[i]);
      if (!pk.ok) continue;
      if (pl.ast.eq !== pk.ast.eq) continue;
      if (pl.ast.eq) {
        if (pProportional(eqF(pk.ast), eqF(pl.ast))) return q.dx[keys[i]];
      } else if (pEq(pk.ast.lhs.poly, pl.ast.lhs.poly)) return q.dx[keys[i]];
    }
    return null;
  }
  function clusterKey(lineStr) {
    var p = parse(lineStr);
    if (!p.ok) return 'unread:' + String(lineStr).slice(0, 30);
    return p.ast.eq ? 'eq:' + pKey(eqF(p.ast)) : 'ex:' + pKey(p.ast.lhs.poly);
  }

  /* ---- final-answer recognisers ------------------------------------ */
  function isAnswerLine(lineStr, ansX) {
    var p = parse(lineStr);
    if (!p.ok || !p.ast.eq) return false;
    var l = p.ast.lhs.poly, r = p.ast.rhs.poly;
    function isXequals(a, b) {
      return rzero(a.c2) && req(a.c1, rat(1, 1)) && rzero(a.c0) && pIsConst(b) && req(b.c0, ansX);
    }
    return isXequals(l, r) || isXequals(r, l);
  }
  /* "looks collected": no brackets, at most one x term and one x\u00b2 term */
  function isCanonicalText(lineStr) {
    var s = normalise(lineStr);
    if (s.indexOf('(') !== -1) return false;
    var xs = s.replace(/x\^2/g, 'Q');
    var nx = (xs.match(/x/g) || []).length;
    var nq = (xs.match(/Q/g) || []).length;
    return nx <= 1 && nq <= 1;
  }

  /* ---- the marker ---------------------------------------------------
     attempt = {L: [{op, t}, ...], fin}
     -> {perLine, res, mk:[m,a], mkMax:[m,a]} per INTERFACES.md          */
  function checkQuestion(q, attempt) {
    var lines = (attempt && attempt.L) || [];
    var mkMax = [q.marks[0], q.marks[1]];
    var per = [];
    var type = q.type || 'solve';
    var i;

    if (!lines.length) return { perLine: [], res: 'X@1', mk: [0, 0], mkMax: mkMax };

    if (type === 'solve' || type === 'form') {
      var ansX = q.answer && q.answer.x ? rat(q.answer.x.n, q.answer.x.d) : null;
      var prev;              // chain anchor: the last parseable line
      var errorAt = -1;
      var startIdx = 0;

      if (type === 'form') {
        var first = lines[0];
        var pf = parse(first.t);
        var okForm = false;
        if (pf.ok && pf.ast.eq) {
          okForm = ((q.form && q.form.accept) || []).some(function (acc) {
            var pa = parse(acc);
            return pa.ok && pa.ast.eq && pProportional(eqF(pa.ast), eqF(pf.ast));
          });
        }
        per.push(okForm ? { ok: 1, dx: null }
          : { ok: 0, dx: dxLookup(q, first.t), note: pf.ok ? 'that equation does not describe the problem' : 'unread line', cluster: clusterKey(first.t) });
        if (!okForm) errorAt = 0;
        prev = pf.ok ? first.t : null;
        startIdx = 1;
      } else {
        prev = q.start || null;
      }

      for (i = startIdx; i < lines.length; i++) {
        var pl = parse(lines[i].t);
        if (!pl.ok) {
          per.push({ ok: 0, dx: null, note: 'unread line' });
          if (errorAt === -1) errorAt = i;
          continue;                                  // anchor unchanged
        }
        if (!prev) {
          per.push({ ok: errorAt === -1 ? 1 : 2, dx: null });
          prev = lines[i].t;
          continue;
        }
        var v = eqStep(prev, lines[i].t);
        if (v.ok === 'sound' || v.ok === 'identity') {
          per.push({ ok: errorAt === -1 ? 1 : 2, dx: null });
        } else if (v.ok === 'parse') {
          per.push({ ok: 0, dx: null, note: 'unread line' });
          if (errorAt === -1) errorAt = i;
        } else {
          per.push({ ok: 0, dx: dxLookup(q, lines[i].t), note: v.dxText || null, cluster: clusterKey(lines[i].t) });
          if (errorAt === -1) errorAt = i;
        }
        prev = lines[i].t;   // FT: judge later lines against the pupil's own line
      }

      var answerRight = ansX != null && isAnswerLine(lines[lines.length - 1].t, ansX);

      /* a 'form' question requires the equation to be FORMED. A single committed
         line that is just the bare answer (x = k) shows no forming at all, so it
         ambers exactly like a solve answer-with-no-working: the forming method
         mark stays on the table rather than being handed over for the answer. */
      if (type === 'form' && lines.length === 1 && answerRight && isAnswerLine(lines[0].t, ansX)) {
        return { perLine: per, res: 'AMBER', mk: [0, mkMax[1]], mkMax: mkMax };
      }

      /* method evidence = sound steps that actually transformed the line */
      var methodSteps = 0;
      for (i = 0; i < lines.length; i++) {
        if (!per[i] || per[i].ok === 0) continue;
        if (type === 'form' && i === 0) { methodSteps++; continue; }
        var anchor = i === 0 ? q.start : lines[i - 1].t;
        if (!anchor) { methodSteps++; continue; }
        var io = inferOp(anchor, lines[i].t);
        if (!io || io.op !== 'rewrite') methodSteps++;
      }

      /* a single committed line that IS the answer: if that line is one
         legal operation away from the start (x+7=12 -> x=5) it IS the
         working for a one-step equation and earns full credit; if the
         leap cannot be explained as one move (5(x-3)=35 -> x=10), the
         method marks stay on the table, exactly as a CCEA scheme holds
         them for unshown working */
      var soloOp = (lines.length === 1 && q.start) ? inferOp(q.start, lines[0].t) : null;
      var amber = answerRight && errorAt === -1 && type !== 'form' && lines.length === 1 && !!q.start &&
        (!soloOp || soloOp.op === 'rewrite');
      if (amber) {
        return { perLine: per, res: 'AMBER', mk: [0, mkMax[1]], mkMax: mkMax };
      }
      if (errorAt === -1 && answerRight) {
        return { perLine: per, res: 'OK', mk: [mkMax[0], mkMax[1]], mkMax: mkMax };
      }
      return {
        perLine: per,
        res: errorAt !== -1 ? 'X@' + (errorAt + 1) : 'X@' + (lines.length + 1),
        mk: [Math.min(mkMax[0], methodSteps), answerRight ? mkMax[1] : 0],
        mkMax: mkMax
      };
    }

    if (type === 'expand' || type === 'simplify') {
      var target = q.answer && q.answer.canon
        ? P(rat(q.answer.canon.c2.n, q.answer.canon.c2.d),
            rat(q.answer.canon.c1.n, q.answer.canon.c1.d),
            rat(q.answer.canon.c0.n, q.answer.canon.c0.d))
        : null;
      var anchor2 = parse(q.start).ok ? q.start : null;
      var errAt = -1;
      for (i = 0; i < lines.length; i++) {
        var pe = parse(lines[i].t);
        if (!pe.ok) {
          per.push({ ok: 0, dx: null, note: 'unread line' });
          if (errAt === -1) errAt = i;
          continue;
        }
        if (anchor2) {
          var ve = exprStep(anchor2, lines[i].t);
          if (ve.ok === 'sound') per.push({ ok: errAt === -1 ? 1 : 2, dx: null });
          else {
            per.push({ ok: 0, dx: dxLookup(q, lines[i].t), cluster: clusterKey(lines[i].t) });
            if (errAt === -1) errAt = i;
          }
        } else per.push({ ok: 1, dx: null });
        anchor2 = lines[i].t;
      }
      var lastP = parse(lines[lines.length - 1].t);
      var finished = errAt === -1 && lastP.ok && !lastP.ast.eq && target &&
        pEq(lastP.ast.lhs.poly, target) && isCanonicalText(lines[lines.length - 1].t);
      if (finished) return { perLine: per, res: 'OK', mk: [mkMax[0], mkMax[1]], mkMax: mkMax };
      var anySound = per.some(function (x) { return x.ok === 1 || x.ok === 2; });
      return {
        perLine: per,
        res: errAt !== -1 ? 'X@' + (errAt + 1) : 'X@' + (lines.length + 1),
        mk: [anySound ? Math.min(1, mkMax[0]) : 0, 0],
        mkMax: mkMax
      };
    }

    if (type === 'subst') {
      var vars = {};
      Object.keys(q.given || {}).forEach(function (k) { vars[k] = rat(q.given[k].n, q.given[k].d); });
      var want = q.answer && q.answer.val ? rat(q.answer.val.n, q.answer.val.d) : null;
      var errS = -1;
      for (i = 0; i < lines.length; i++) {
        // allow a formula subject prefix the pupil copied ("v = 20 \u2212 14")
        var txt = lines[i].t;
        var subjM = String(txt).match(/^\s*([a-wyz])\s*=\s*([\s\S]+)$/);
        if (subjM && !(subjM[1] in vars)) txt = subjM[2];
        var ev = substEval(txt, vars);
        if (ev.ok && want && req(ev.val, want)) per.push({ ok: errS === -1 ? 1 : 2, dx: null });
        else {
          per.push({ ok: 0, dx: dxLookup(q, lines[i].t), cluster: clusterKey(lines[i].t) });
          if (errS === -1) errS = i;
        }
      }
      var lastT = lines[lines.length - 1].t;
      var lastM = String(lastT).match(/^\s*([a-wyz])\s*=\s*([\s\S]+)$/);
      if (lastM && !(lastM[1] in vars)) lastT = lastM[2];
      var lastE = substEval(lastT, {});
      var bare = lastE.ok && want && req(lastE.val, want);
      if (errS === -1 && bare) {
        if (lines.length === 1) return { perLine: per, res: 'AMBER', mk: [0, mkMax[1]], mkMax: mkMax };
        return { perLine: per, res: 'OK', mk: [mkMax[0], mkMax[1]], mkMax: mkMax };
      }
      return {
        perLine: per,
        res: errS !== -1 ? 'X@' + (errS + 1) : 'X@' + (lines.length + 1),
        mk: [errS !== 0 && lines.length > 1 ? Math.min(1, mkMax[0]) : 0, bare ? mkMax[1] : 0],
        mkMax: mkMax
      };
    }

    return { perLine: [], res: 'X@1', mk: [0, 0], mkMax: mkMax };
  }

  /* ---- self test ---------------------------------------------------- */
  function selfTest() {
    var failures = [];
    var n = 0;
    function T(name, cond) { n++; if (!cond) failures.push(name); }
    function r(a, b) { return rat(a, b == null ? 1 : b); }
    function chk(q, lines, fin) {
      return checkQuestion(q, { L: lines.map(function (t) { return { op: 'rw', t: t }; }), fin: fin });
    }
    var MNS = '\u2212';
    var q535 = { id: 'q1', type: 'solve', marks: [2, 1], start: '5(x - 3) = 35', answer: { x: r(10) },
      dx: { '5x-3=35': 'EXPAND_PARTIAL', '5x+15=35': 'EXPAND_SIGN' } };

    // parsing
    T('parse simple', parse('5x - 15 = 35').ok);
    T('parse unicode minus', parse('5x ' + MNS + ' 15 = 35').ok);
    T('parse implicit mult', parse('5(x-3)=35').ok);
    T('parse x squared char', parse('x\u00b2 + 3x').ok);
    T('parse caret', parse('x^2 + 3x').ok);
    T('reject empty', !parse('').ok);
    T('reject double equals', !parse('x = 3 = 3').ok);
    T('reject garbage', !parse('5x + & = 2').ok);
    T('reject x denominator', !parse('5/x = 1').ok);
    T('reject degree 3', !parse('x*x*x').ok);
    T('mixed number unreadable', !parse('1\u2153').ok);
    T('reject empty side', !parse('5x =').ok);

    // canon
    var c = canonSide(parse('2(x+3) - x').ast.lhs);
    T('canon collects', req(c.c1, r(1)) && req(c.c0, r(6)));
    T('lineKind eq', lineKind(parse('x=2')) === 'eq');
    T('lineKind expr', lineKind(parse('x+2')) === 'expr');

    // eqStep
    T('expand step sound', eqStep('5(x-3)=35', '5x-15=35').ok === 'sound');
    T('partial expand bad', eqStep('5(x-3)=35', '5x-3=35').ok === 'notequiv');
    T('divide-first route', eqStep('5(x-3)=35', 'x-3=7').ok === 'sound');
    T('add 15 sound', eqStep('5x-15=35', '5x=50').ok === 'sound');
    T('divide 5 sound', eqStep('5x=50', 'x=10').ok === 'sound');
    T('one side only bad', eqStep('2x+5=11', '2x=11').ok === 'notequiv');
    T('negative coeff', eqStep('3-2x=7', '-2x=4').ok === 'sound');
    T('divide by negative', eqStep('-2x=4', 'x=-2').ok === 'sound');
    T('x both sides', eqStep('3x+2=4x-3', '2=x-3').ok === 'sound');
    T('swap sides sound', eqStep('5=x', 'x=5').ok === 'sound');
    T('degree trap', eqStep('x=3', 'x*x=3x').ok === 'notequiv');
    T('fraction answer', eqStep('3x=4', 'x=4/3').ok === 'sound');
    T('decimal answer', eqStep('2x=9', 'x=4.5').ok === 'sound');
    T('collect first', eqStep('3x+2+5x=x+44', '8x+2=x+44').ok === 'sound');
    T('brackets both sides', eqStep('3(x+2)=2(x-1)', '3x+6=2x-2').ok === 'sound');
    T('scaling is sound', eqStep('2x+4=10', 'x+2=5').ok === 'sound');
    T('times both sides', eqStep('x/2=7', 'x=14').ok === 'sound');
    T('identity next', eqStep('x+2=x+3', 'x+2=x+2').ok === 'identity');
    T('parse verdict', eqStep('x+2=8', 'x + ?? = 8').ok === 'parse');

    // inferOp
    var io = inferOp('5x-15=35', '5x=50');
    T('infer +15', io && io.op === '+' && req(io.operand, r(15)));
    io = inferOp('5x=50', 'x=10');
    T('infer /5', io && io.op === '/' && req(io.operand, r(5)));
    io = inferOp('5x=50', '5x=50');
    T('infer rewrite', io && io.op === 'rewrite');
    io = inferOp('2x+5=11', '2x=6');
    T('infer -5', io && io.op === '-' && req(io.operand, r(5)));
    T('infer null when broken', inferOp('5x=50', 'x=12') === null);

    // evalCalc / substEval
    var e = evalCalc('180-38-74');
    T('calc plain', e.ok && req(e.val, r(68)));
    e = evalCalc('(2*4)+7');
    T('calc brackets', e.ok && req(e.val, r(15)));
    e = evalCalc('180 ' + MNS + ' 38');
    T('calc unicode', e.ok && req(e.val, r(142)));
    T('calc rejects x', !evalCalc('2x+1').ok);
    e = substEval('a(b - c)', { a: r(4), b: r(7), c: r(3) });
    T('subst brackets', e.ok && req(e.val, r(16)));
    e = substEval('3a - d', { a: r(3), d: r(-4) });
    T('subst negatives', e.ok && req(e.val, r(13)));
    e = substEval('u + a*t', { u: r(20), a: r(-2), t: r(7) });
    T('subst formula', e.ok && req(e.val, r(6)));

    // checkQuestion: routes
    var v = chk(q535, ['5x - 15 = 35', '5x = 50', 'x = 10']);
    T('solve OK full marks', v.res === 'OK' && v.mk[0] === 2 && v.mk[1] === 1);
    v = chk(q535, ['x - 3 = 7', 'x = 10']);
    T('alternative route OK', v.res === 'OK' && v.mk[0] === 2);
    v = chk(q535, ['5x - 3 = 35', '5x = 38']);
    T('dx EXPAND_PARTIAL at line 1', v.res === 'X@1' && v.perLine[0].dx === 'EXPAND_PARTIAL');
    T('FT after the error', v.perLine[1].ok === 2);
    v = chk(q535, ['5x + 15 = 35']);
    T('dx EXPAND_SIGN', v.perLine[0].dx === 'EXPAND_SIGN');
    v = chk(q535, ['x = 10']);
    T('amber: answer no working', v.res === 'AMBER' && v.mk[0] === 0 && v.mk[1] === 1);
    var q1step = { id: 'q1s', type: 'solve', marks: [1, 1], start: 'x + 7 = 12', answer: { x: r(5) }, dx: {} };
    v = chk(q1step, ['x = 5']);
    T('one-step solo line IS working', v.res === 'OK' && v.mk[0] === 1 && v.mk[1] === 1);
    v = chk(q535, ['5x - 15 = 35', '5x !! 50', 'x = 10']);
    T('unread line flagged', v.perLine[1].note === 'unread line' && v.res === 'X@2');
    T('chain survives unread', v.perLine[2].ok === 2);
    v = chk(q535, ['5x - 15 = 35', '5x = 20', 'x = 4']);
    T('wrong value caught', v.res === 'X@2' && v.perLine[2].ok === 2 && v.mk[1] === 0);
    T('method partial credit', v.mk[0] >= 1);

    var q2 = { id: 'q2', type: 'solve', marks: [2, 1], start: '2x + 7 = 8x - 11', answer: { x: r(3) }, dx: {} };
    v = chk(q2, ['7 = 6x - 11', '18 = 6x', '3 = x', 'x = 3']);
    T('x both sides OK', v.res === 'OK');
    var q3 = { id: 'q3', type: 'solve', marks: [1, 1], start: '6x + 2 = -10', answer: { x: r(-2) }, dx: {} };
    v = chk(q3, ['6x = -12', 'x = -2']);
    T('negative answer OK', v.res === 'OK');
    var q4 = { id: 'q4', type: 'solve', marks: [2, 1], start: '6(x + 7) = 50', answer: { x: r(4, 3) }, dx: {} };
    v = chk(q4, ['6x + 42 = 50', '6x = 8', 'x = 8/6']);
    T('fraction answer OK', v.res === 'OK');

    var qf = { id: 'qf', type: 'form', marks: [2, 1], answer: { x: r(6) }, form: { accept: ['2x+36=48', '36+2x=48'] }, dx: {} };
    v = chk(qf, ['2x + 36 = 48', '2x = 12', 'x = 6']);
    T('form question OK', v.res === 'OK');
    v = chk(qf, ['2x + 18 = 48', '2x = 30', 'x = 15']);
    T('wrong formed equation', v.res === 'X@1');

    var qe = { id: 'qe', type: 'expand', marks: [1, 1], start: '4(x - 7)',
      answer: { canon: { c2: r(0), c1: r(4), c0: r(-28) } }, dx: { '4x-7': 'EXPAND_PARTIAL' } };
    v = chk(qe, ['4x - 28']);
    T('expand OK', v.res === 'OK');
    v = chk(qe, ['4x - 7']);
    T('expand dx', v.res === 'X@1' && v.perLine[0].dx === 'EXPAND_PARTIAL');
    v = chk(qe, ['4(x - 7)']);
    T('still-bracketed not finished', v.res !== 'OK');
    var qx = { id: 'qx', type: 'expand', marks: [1, 1], start: 'x(8 - x)',
      answer: { canon: { c2: r(-1), c1: r(8), c0: r(0) } }, dx: {} };
    v = chk(qx, ['8x - x\u00b2']);
    T('expand to x squared OK', v.res === 'OK');

    var qs = { id: 'qs', type: 'simplify', marks: [1, 1], start: '5x + 7 - 3x + 2',
      answer: { canon: { c2: r(0), c1: r(2), c0: r(9) } }, dx: {} };
    v = chk(qs, ['2x + 9']);
    T('simplify OK', v.res === 'OK');

<script>
/* MathShelf \u2014 Angles content pack (CCEA M2, J3 revision).
   Source: Mary McElroy's WALTs + MEP Y8 Practice Book A ch.11 (11.1 Angle
   Measures, 11.2 Parallel and Intersecting Lines). The teacher's WALT
   wording is used for the interior/U-shape rule.

   Geometry is computed, not sketched: every ray endpoint is constructed
   by angle, so the drawn figure genuinely subtends the stated values \u2014
   dev/lint-content-angles.js re-measures every angle from the coordinates
   and re-derives every graph edge with GJ_ANGLES.verifyGraph. */
(function () {
  'use strict';

  /* deg measured anticlockwise from "east", y-up (screen y flipped) */
  function ray(v, deg, len) {
    var r = deg * Math.PI / 180;
    return [round2(v[0] + len * Math.cos(r)), round2(v[1] - len * Math.sin(r))];
  }
  function round2(x) { return Math.round(x * 100) / 100; }

  /* \u2500\u2500 the eight-angle parallel-lines template \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500
     Two horizontal parallel lines crossed by a transversal of acute
     angle alpha. Angle slots (e at upper crossing E, f at lower F):
       e1 right/above \u00b7 e2 left/above \u00b7 e3 left/below (interior)
       e4 right/below (interior) \u00b7 f1 right/above (interior)
       f2 left/above (interior) \u00b7 f3 left/below \u00b7 f4 right/below
     include = {slot: {id, label?, given?}}; target = id; the generator
     emits every TRUE edge among the included angles (VOP, COR, ALT,
     INT, STR-with-neighbours), so any legitimate route is accepted.  */
  function parallelQ(alpha, include, opts) {
    var yTop = opts.yTop || 20, yBot = opts.yBot || 52;
    var E = [opts.ex || 60, yTop];
    var run = (yBot - yTop) / Math.tan(alpha * Math.PI / 180);
    var F = [round2(E[0] - run), yBot];
    var T = ray(E, alpha, opts.stub || 13);
    var U = ray(F, 180 + alpha, opts.stub || 13);
    var pts = {
      E: E, F: F, _T: T, _U: U,
      _EL: [Math.min(10, F[0] - 8), yTop], _ER: [96, yTop],
      _FL: [Math.min(6, F[0] - 12), yBot], _FR: [90, yBot]
    };
    var segs = [
      { id: 'top', from: '_EL', to: '_ER', par: 1 },
      { id: 'bottom', from: '_FL', to: '_FR', par: 1 },
      { id: 'trans', from: '_T', to: '_U' }
    ];
    var defs = {
      e1: { at: 'E', from: '_ER', to: '_T', value: alpha },
      e2: { at: 'E', from: '_T', to: '_EL', value: 180 - alpha },
      e3: { at: 'E', from: '_EL', to: 'F', value: alpha },
      e4: { at: 'E', from: 'F', to: '_ER', value: 180 - alpha },
      f1: { at: 'F', from: '_FR', to: 'E', value: alpha },
      f2: { at: 'F', from: 'E', to: '_FL', value: 180 - alpha },
      f3: { at: 'F', from: '_FL', to: '_U', value: alpha },
      f4: { at: 'F', from: '_U', to: '_FR', value: 180 - alpha }
    };
    var angles = {}, slotOf = {};
    Object.keys(include).forEach(function (slot) {
      var spec = include[slot];
      var d = defs[slot];
      angles[spec.id] = {
        at: d.at, from: d.from, to: d.to, value: d.value,
        given: !!spec.given, label: spec.given ? undefined : (spec.label || spec.id)
      };
      slotOf[slot] = spec.id;
    });
    var EQ = { VOP: [['e1', 'e3'], ['e2', 'e4'], ['f1', 'f3'], ['f2', 'f4']],
               COR: [['e1', 'f1'], ['e2', 'f2'], ['e3', 'f3'], ['e4', 'f4']],
               ALT: [['e3', 'f1'], ['e4', 'f2']] };
    var SUM = { INT: [['e3', 'f2'], ['e4', 'f1']],
                STR: [['e1', 'e2'], ['e2', 'e3'], ['e3', 'e4'], ['e4', 'e1'],
                      ['f1', 'f2'], ['f2', 'f3'], ['f3', 'f4'], ['f4', 'f1']] };
    var graph = [];
    function pairEdges(rule, pairs) {
      pairs.forEach(function (pr) {
        var a = slotOf[pr[0]], b = slotOf[pr[1]];
        if (!a || !b) return;
        if (!angles[a].given) graph.push({ find: a, rule: rule, from: [b] });
        if (!angles[b].given) graph.push({ find: b, rule: rule, from: [a] });
      });
    }
    pairEdges('VOP', EQ.VOP); pairEdges('COR', EQ.COR); pairEdges('ALT', EQ.ALT);
    pairEdges('INT', SUM.INT); pairEdges('STR', SUM.STR);
    return { diagram: { w: 100, h: 64, pts: pts, segs: segs, angles: angles }, graph: graph };
  }

  /* \u2500\u2500 small diagram builders \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 */
  function lineFig(V, rays, lineDeg, lineLen) {
    /* a straight line through V (at lineDeg) plus extra rays; returns pts+segs */
    var pts = { V: V }, segs = [];
    var a = ray(V, lineDeg, lineLen), b = ray(V, lineDeg + 180, lineLen);
    pts._P = b; pts._Q = a;
    segs.push({ id: 'line', from: '_P', to: '_Q' });
    rays.forEach(function (r, i) {
      var nm = '_R' + (i + 1);
      pts[nm] = ray(V, r, lineLen * 0.62);
      segs.push({ id: 'ray' + (i + 1), from: 'V', to: nm });
    });
    return { pts: pts, segs: segs };
  }

  var REASON_BANK = [
    { id: 'STR', group: 'Lines & points', text: 'Angles on a straight line add up to 180\u00b0' },
    { id: 'PNT', group: 'Lines & points', text: 'Angles at a point add up to 360\u00b0' },
    { id: 'VOP', group: 'Lines & points', text: 'Vertically opposite angles are equal' },
    { id: 'TRI', group: 'Triangles & quadrilaterals', text: 'Angles in a triangle add up to 180\u00b0' },
    { id: 'QUAD', group: 'Triangles & quadrilaterals', text: 'Angles in a quadrilateral add up to 360\u00b0' },
    { id: 'ISO', group: 'Triangles & quadrilaterals', text: 'Base angles of an isosceles triangle are equal' },
    { id: 'EQT', group: 'Triangles & quadrilaterals', text: 'Each angle in an equilateral triangle is 60\u00b0' },
    { id: 'ALT', group: 'Parallel lines', text: 'Alternate angles are equal (Z shape)' },
    { id: 'COR', group: 'Parallel lines', text: 'Corresponding angles are equal (F shape)' },
    { id: 'INT', group: 'Parallel lines', text: 'Interior angles add up to 180\u00b0 (U shape)' },
    { id: 'PGRAM', group: 'Special shapes', text: 'Opposite angles of a parallelogram are equal' }
  ];

  /* \u2550\u2550\u2550\u2550 Section 1 \u2014 Know your angles (classify) \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550 */
  function classifyFig(deg1, deg2, value, reflex) {
    var V = [30, 28];
    var pts = { V: V, _A: ray(V, deg1, 21), _B: ray(V, deg2, 21) };
    var ang = { at: 'V', from: '_A', to: '_B', value: value };
    if (reflex) ang.reflex = true;
    return { w: 60, h: 48, pts: pts, segs: [
      { id: 's1', from: 'V', to: '_A' }, { id: 's2', from: 'V', to: '_B' }

  function renderDiagram(host, diagram, opts) {
    opts = opts || {};

    function paperWrite(op, instant) {

      var eq = el('span', 'ml-eq', op.write.text);
      line.appendChild(eq);

    function paperBalance(op, instant) {

          '<line x1="150" y1="26" x2="150" y2="82" stroke="#5B6470" stroke-width="3"/>' +
          '<path d="M120 82 h60" stroke="#5B6470" stroke-width="3"/>' +
          '<g class="beam" style="transform-origin:150px 26px;transition:transform 700ms var(--ease-needle)">' +
          '<line x1="40" y1="26" x2="260" y2="26" stroke="#7A3B5E" stroke-width="3"/>' +
          '<path d="M40 26 l-13 22 h26 Z" fill="none" stroke="#7A3B5E" stroke-width="2"/>' +
          '<path d="M260 26 l-13 22 h26 Z" fill="none" stroke="#7A3B5E" stroke-width="2"/>' +
          '<text class="bl" x="40" y="64" text-anchor="middle" style="font-family:var(--f-maths);font-size:15px"></text>' +

        stage.insertBefore(balanceEl, stage.firstChild);

      if (b.r != null) balanceEl.querySelector('.br').textContent = b.r;
      var beam = balanceEl.querySelector('.beam');

    function doStamp(op, instant) {
      var text = op.stamp.text;
      if (!text && op.stamp.reason && window.GJ_CONTENT) {

        Object.keys(packs).some(function (k) {
          var bank = packs[k].reasonBank || [];
          var hit = bank.filter(function (r) { return r.id === op.stamp.reason; })[0];
          if (hit) { text = hit.text; return true; }

    function doNote(op, instant) {

    function applyOp(op, instant) {

      if (op.balance) return paperBalance(op, instant);
      if (op.stamp) return doStamp(op, instant);
      if (op.note) return doNote(op, instant);

      if (!dgm) return Promise.resolve();
      if (op.seg) return dgm.reveal('seg', op.seg.id, instant);
      if (op.arc) return dgm.reveal('arc', op.arc.ang, instant);
      if (op.value) return dgm.showValue(op.value.ang, op.value.to, { instant: instant, colour: op.value.colour });

      if (op.pulse) { dgm.pulse(op.pulse.ang, op.pulse.on); return Promise.resolve(); }

    function renderDots() {

        d.classList.toggle('now', i === stepIdx);
      });
    }

    function showCaption(i) {
      capNum.textContent = i + 1;
      capText.textContent = movie.steps[i].say || '';

         is what lets the caption-over-its-subject law be measured at all: a
         step declares the things it wrote, ticked, arced or plotted, and a step
         that touches nothing declares that explicitly rather than saying
         nothing (the UNSEEN-STAGE rule - silence has to fail closed). */

      for (var k = 0; k < i; k++) {
        (function (kk) {

            return pr2;

        stepIdx = i;
        showCaption(i);
        if (instant && window.GJ && window.GJ.setState) window.GJ.setState(root, 'movie', 'instant');
        renderDots();
        var pr3 = Promise.resolve();
        movie.steps[i].do.forEach(function (op) { pr3 = pr3.then(function () { return applyOp(op, !!instant); }); });
        return pr3;
      }).then(function () { busy = false; scheduleAuto(); }, function () { busy = false; });
    }

    function advance() {
      if (stepIdx + 1 >= movie.steps.length) { setPlaying(false); return; }
      if (busy) return;
      busy = true;
      stepIdx++;
      showCaption(stepIdx);
      renderDots();
      var pr = Promise.resolve();
      movie.steps[stepIdx].do.forEach(function (op) { pr = pr.then(function () { return applyOp(op, false); }); });
      pr.then(function () { busy = false; scheduleAuto(); }, function () { busy = false; });
    }

    function readTime(i) {
      // dwell AFTER the step's animation has finished. The caption has been
      // on screen throughout the draw, so this is top-up reading time, not
      // the whole read \u2014 keep it snappy. ~270 wpm, floored and capped.
      var words = (movie.steps[i].say || '').split(/\s+/).length;
      return Math.min(3600, Math.max(850, words * 200));
    }
    function scheduleAuto() {
      if (!playing) return;
      clearTimeout(autoTimer);
      if (stepIdx + 1 >= movie.steps.length) { setPlaying(false); return; }
      autoTimer = setTimeout(advance, readTime(stepIdx));
    }
    function stopAuto() { setPlaying(false); }
    function setPlaying(on) {
      playing = on;
      clearTimeout(autoTimer);
      root.querySelector('.mc-play').innerHTML = on ? '\u275a\u275a Pause' : (stepIdx + 1 >= movie.steps.length ? '\u21ba Replay' : '\u25b6 Play');
      if (on) scheduleAuto();
    }

    root.querySelector('.mc-play').addEventListener('click', function () {
      if (playing) { setPlaying(false); return; }
      if (stepIdx + 1 >= movie.steps.length) { goto(0); setPlaying(true); return; }

    });
    root.querySelector('.mc-fwd').addEventListener('click', function () { stopAuto(); advance(); });
    root.querySelector('.mc-back').addEventListener('click', function () { stopAuto(); goto(Math.max(0, stepIdx - 1), true); });

    goto(0, true);

    return {
      play: function () { setPlaying(true); },
      pause: function () { setPlaying(false); },
      step: function (d) { stopAuto(); d > 0 ? advance() : goto(stepIdx - 1, true); },
      goto: goto,
      destroy: function () { clearTimeout(autoTimer); host.innerHTML = ''; }
    };
  }

  window.GJ_PLAYER = { mount: mount, renderDiagram: renderDiagram };
})();

<script>

  /* \u2500\u2500 simplify helpers: split the expression into signed term-tiles, and

  }

  /* \u2500\u2500 expand helpers: join two chosen grid products into one line; shuffle. \u2500\u2500 */
  function joinExpand(c0, c1) {

  /* \u2500\u2500 solve helpers: serialise a side's {c2,c1,c0} to a string, and build the
       next equation line for a chosen move using the engine's exported rational
       helpers. Every built line is re-checked with GJ_MATH.eqStep before it inks,
       so the move-chip rail can never produce a line the marker would reject. \u2500\u2500 */
  function polyToStr(c) {

  function solveStep(prev, kind, operandStr) {
    var M = window.GJ_MATH, sides = String(prev).split('=');
    if (sides.length !== 2) return null;

    var Lc = Lp.ast.lhs.poly, Rc = Rp.ast.lhs.poly;   // each side parses as an expression \u2192 lhs.poly
    if (!Lc || !Rc) return null;
    function norm(c) { return { c2: c.c2 || M.rat(0, 1), c1: c.c1 || M.rat(0, 1), c0: c.c0 || M.rat(0, 1) }; }
    Lc = norm(Lc); Rc = norm(Rc);
    var n = (operandStr != null && operandStr !== '') ? M.rfromstr(operandStr) : null;
    if ((kind === '-' || kind === '+' || kind === '*' || kind === '/' || kind === 'subx') && (!n || n.n == null)) return null;

    function apply(c) {
      if (kind === '-') return { c2: c.c2, c1: c.c1, c0: M.rsub(c.c0, n) };

      if (kind === '*') return { c2: M.rmul(c.c2, n), c1: M.rmul(c.c1, n), c0: M.rmul(c.c0, n) };
      if (kind === '/') return { c2: M.rdiv(c.c2, n), c1: M.rdiv(c.c1, n), c0: M.rdiv(c.c0, n) };

  /* \u2500\u2500 classify questions (s1 "Know your angles"): judge the drawn
       angle by eye \u2014 options always the full set, shuffled, two attempts,
       nothing marked until Check. \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 */
  function mountClassify(host, q, savedRec, hooks) {
    var rec = savedRec || { att: [], lock: false, ovr: null };
    if (!rec.att) rec.att = [];
    var t0 = Date.now();
    var wrap = el('div', 'jotter-q');
    tagQuestionRoot(wrap, q, hooks);
    var margin = el('div', 'jq-margin', 'Q' + hooks.number);
    margin.setAttribute('data-mark', '');
    var body = el('div', 'jq-body');
    body.setAttribute('data-work', '');
    wrap.appendChild(margin); wrap.appendChild(body);
    host.appendChild(wrap);
    body.appendChild(el('p', 'jq-prompt', esc(q.prompt) + ' <span class="q-marks">[1 mark]</span>'));
    var dwrap = el('div', 'jq-diagram');
    body.appendChild(dwrap);

    var pick = null;
    var cards = el('div', 'reason-cards');
    var trayId = 'classify-options-' + q.id;

    var feedback = el('div', 'jq-feedback');
    var checkRow = el('div', 'check-row');
    var checkBtn = el('button', 'btn-stamp', T.classifyCheckBtn);
    checkBtn.type = 'button';
    checkBtn.disabled = true;
    setLockedWhy(checkBtn, 'Choose an answer first.');
    checkRow.appendChild(checkBtn);
    body.appendChild(checkRow);
    body.appendChild(feedback);

    function renderOptions() {
      cards.innerHTML = '';
      shuffle(q.options, q.id).forEach(function (o) {
        var b = el('button', 'reason-card');
        b.type = 'button';
        b.textContent = o.charAt(0).toUpperCase() + o.slice(1);
        b.setAttribute('aria-pressed', 'false');
        b.setAttribute('data-tray-item', '');
        b.addEventListener('click', function () {
          if (rec.lock) return;
          cards.querySelectorAll('.reason-card').forEach(function (x) { x.setAttribute('aria-pressed', 'false'); });
          b.setAttribute('aria-pressed', 'true');
          pick = o;
          checkBtn.disabled = false;

      });
    }
    function finish(last, instant) {
      var right = last.pick === q.classify;
      feedback.innerHTML = '';
      var mk = el('span', 'wl-mark');
      mk.setAttribute('data-mark', '');
      mk.style.cssText = 'position:static;display:inline-block;width:26px;height:22px;vertical-align:middle';
      feedback.appendChild(mk);
      drawMark(mk, right ? 'tick' : 'cross');
      var tally = el('span', 'mk-tally ' + (right ? 'mk-correct' : 'mk-wrong'), ' ' + (right ? '1/1' : '0/1'));
      tally.setAttribute('data-mark', '');
      feedback.appendChild(tally);
      if (rec.lock) {
        window.GJ.setState(wrap, 'question', right ? 'checked-right' : (rec.att.length >= 2 ? 'checked-wrong-2' : 'checked-wrong-1'));
        var comment = el('p', 'mk-comment ' + (right ? 'mk-correct' : 'mk-wrong'), right ? commentFor(q.id, 'perfect', 'classify') : commentFor(q.id, 'fail', 'classify'));
        comment.setAttribute('data-mark', '');
        feedback.appendChild(comment);
        if (!right) feedback.appendChild(el('p', 'ui-msg', fill(T.classifyYourAnswer, { answer: esc(last.pick) })));
        checkRow.hidden = true;
        setLockedWhy(checkBtn, 'This question is already marked.');
        cards.querySelectorAll('.reason-card').forEach(function (x) {
          x.disabled = true;
          setLockedWhy(x, 'This question is already marked.');
          if (x.textContent.toLowerCase() === String(last.pick).toLowerCase()) { x.setAttribute('data-placed', ''); x.setAttribute('data-from', trayId); }
        });
        margin.innerHTML = 'Q' + hooks.number + '<div class="mk-tally ' + (right ? 'mk-correct' : 'mk-wrong') + '" data-mark style="font-size:18px">' + (right ? '1' : '0') + '/1</div>';
      } else if (!instant) {
        window.GJ.setState(wrap, 'question', 'checked-wrong-1');
        feedback.appendChild(el('p', 'ui-msg', T.classifyTryAgain));
        pick = null;
        checkBtn.disabled = true;
        setLockedWhy(checkBtn, 'Choose an answer to try again.');
        cards.querySelectorAll('.reason-card').forEach(function (x) { x.setAttribute('aria-pressed', 'false'); });
      }

    }
    checkBtn.addEventListener('click', function () {
      if (!pick || rec.lock) return;
      var att = { pick: pick, dur: Math.round((Date.now() - t0) / 1000), res: pick === q.classify ? 'OK' : 'X@1' };
      rec.att.push(att);
      if (pick === q.classify || rec.att.length >= 2) rec.lock = true;

  }

  /* \u2500\u2500 protractor questions (s1 "measure the angle"): a real on-screen
       protractor the pupil drags onto the corner, rotates to line the
       zero up with one arm, then reads off and types the size. Genuine
       fail state \u2014 misplace it and you misread; the classic "read the
       other scale" slip is caught with a teaching note. \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 */
  function protractorMark(q, read) {
    var tol = q.tol || 3;
    if (Math.abs(read - q.value) <= tol) return { ok: true };
    if (Math.abs(read - (180 - q.value)) <= tol) return { ok: false, dx: 'WRONG_SCALE' };
    return { ok: false, dx: 'MISREAD' };
  }
  var PROT_R = 108;
  function buildProtractor() {
    var R = PROT_R, p = [], d, rad, x1, y1, x2, y2, len;
    p.push('<path d="M ' + (-R) + ' 0 A ' + R + ' ' + R + ' 0 0 1 ' + R + ' 0 Z" fill="rgba(15,107,102,0.10)" stroke="#0F6B66" stroke-width="1.6"/>');
    p.push('<path d="M ' + (-(R - 44)) + ' 0 A ' + (R - 44) + ' ' + (R - 44) + ' 0 0 1 ' + (R - 44) + ' 0" fill="none" stroke="#0F6B66" stroke-width="0.8" opacity="0.5"/>');
    p.push('<line x1="' + (-R) + '" y1="0" x2="' + R + '" y2="0" stroke="#0F6B66" stroke-width="1.4"/>');
    for (d = 0; d <= 180; d++) {
      rad = d * Math.PI / 180; len = (d % 10 === 0) ? 13 : (d % 5 === 0) ? 9 : 5;
      x1 = Math.cos(rad) * R; y1 = -Math.sin(rad) * R;
      x2 = Math.cos(rad) * (R - len); y2 = -Math.sin(rad) * (R - len);
      p.push('<line x1="' + x1.toFixed(1) + '" y1="' + y1.toFixed(1) + '" x2="' + x2.toFixed(1) + '" y2="' + y2.toFixed(1) + '" stroke="#0F6B66" stroke-width="' + (d % 10 === 0 ? 1 : 0.55) + '"/>');
    }
    for (d = 0; d <= 180; d += 10) {
      rad = d * Math.PI / 180;
      var ox = Math.cos(rad) * (R - 20), oy = -Math.sin(rad) * (R - 20) + 3;
      var ix = Math.cos(rad) * (R - 35), iy = -Math.sin(rad) * (R - 35) + 3;
      var endCls = '';
      if (d === 0 || d === 180) {
        /* the 0/180 labels fall ON the baseline; tuck them right down onto
           the baseline endpoints (smaller, via .end) so they sit clearly
           BELOW the 10/170 arc numbers and inside the rim, never clipping. */
        var s = (d === 0) ? 1 : -1;

        ix = s * (R - 30); iy = -3;

      p.push('<text data-pos="' + d + '" x="' + ix.toFixed(1) + '" y="' + iy.toFixed(1) + '" text-anchor="middle" class="prot-num inner' + endCls + '">' + (180 - d) + '</text>');
    }
    /* THE CENTRE MARK IS NOT A MARK. It was drawn in #C8102E, which on this
       platform means WRONG and nothing else \u2014 so a pupil lining up her
       protractor was looking at the colour her mistakes are drawn in. The
       affordance is unchanged (a small crosshair at the centre); only the
       colour moves, to the navy the rest of the instrument is drawn in. The
       renderer's BEHAVIOUR is untouched and qa-v3-shape proves it. */
    p.push('<g class="prot-centre"><circle cx="0" cy="0" r="3.5" fill="none" stroke="#1A3A6B" stroke-width="1.4"/><line x1="-10" y1="0" x2="10" y2="0" stroke="#1A3A6B" stroke-width="1"/><line x1="0" y1="-10" x2="0" y2="7" stroke="#1A3A6B" stroke-width="1"/></g>');
    /* a turning knob at BOTH baseline ends, so one is always reachable even
       when an arm or the pupil's hand covers the other */
    function knob(hx) {
      return '<g class="rotate-handle" style="cursor:grab"><circle cx="' + hx + '" cy="0" r="12" fill="#0F6B66"/>' +
        '<path d="M ' + (hx - 5) + ' -4 A 6 6 0 1 1 ' + (hx - 5) + ' 4" fill="none" stroke="#fff" stroke-width="1.5"/>' +
        '<path d="M ' + (hx - 8) + ' 3 l 3 4 l 3 -3 z" fill="#fff"/></g>';
    }

    p.push(knob(-(R + 15)));
    return p.join('');
  }

  function mountProtractor(host, q, savedRec, hooks) {
    var rec = savedRec || { att: [], lock: false, ovr: null };
    if (!rec.att) rec.att = [];
    var t0 = Date.now();

    var wrap = el('div', 'jotter-q');
    tagQuestionRoot(wrap, q, hooks);
    var margin = el('div', 'jq-margin', 'Q' + hooks.number);
    margin.setAttribute('data-mark', '');
    var body = el('div', 'jq-body');
    body.setAttribute('data-work', '');
    wrap.appendChild(margin); wrap.appendChild(body);
    host.appendChild(wrap);
    body.appendChild(el('p', 'jq-prompt', esc(q.prompt) + ' <span class="q-marks">[1 mark]</span>'));

    var VBW = 400, VBH = 290;
    var pwrap = el('div', 'prot-wrap');
    body.appendChild(pwrap);
    var svg = sv('svg', { viewBox: '0 0 ' + VBW + ' ' + VBH, class: 'protractor-canvas' });
    svg.style.cssText = 'touch-action:none;max-width:540px;width:100%;display:block;margin:0 auto';
    svg.setAttribute('data-work', '');
    svg.setAttribute('data-centred', '');
    pwrap.appendChild(svg);

    var V = q.vertex || [252, 212], L = q.armLen || 130;
    function ray(deg) { var r = deg * Math.PI / 180; return [V[0] + Math.cos(r) * L, V[1] - Math.sin(r) * L]; }
    var a1 = ray(q.armDeg), a2 = ray(q.armDeg + q.value);

    [a1, a2].forEach(function (pt) { gAngle.appendChild(sv('line', { x1: V[0], y1: V[1], x2: pt[0], y2: pt[1], stroke: '#14213A', 'stroke-width': 2.6, 'stroke-linecap': 'round' })); });
    gAngle.appendChild(sv('circle', { cx: V[0], cy: V[1], r: 3, fill: '#14213A' }));

    var focus = sv('g', { class: 'prot-focus' });
    prot.appendChild(focus);

       number(s) each arm crosses (both scales) and mark the exact crossing

      var key = crossings.map(function (c) { return Math.round(c); }).sort().join(',');

      crossings.forEach(function (dd) {
        var rad = dd * Math.PI / 180, cx = Math.cos(rad), cy = -Math.sin(rad);
        focus.appendChild(sv('line', { x1: (cx * (PROT_R - 15)).toFixed(1), y1: (cy * (PROT_R - 15)).toFixed(1), x2: (cx * (PROT_R + 3)).toFixed(1), y2: (cy * (PROT_R + 3)).toFixed(1), stroke: '#E4B824', 'stroke-width': 3, 'stroke-linecap': 'round' }));
        focus.appendChild(sv('circle', { cx: (cx * PROT_R).toFixed(1), cy: (cy * PROT_R).toFixed(1), r: 3.2, fill: '#E4B824' }));
        // light BOTH tens the reading sits between (e.g. 115 -> 110 and 120),

        [lo, hi].forEach(function (lab) {
          Array.prototype.forEach.call(prot.querySelectorAll('[data-pos="' + lab + '"]'), function (n) { n.classList.add('lit'); });
        });
      });
    }

    var state = { cx: 152, cy: 128, rot: 0 };  // starts above the angle, both knobs on-canvas
    function apply() { prot.setAttribute('transform', 'translate(' + state.cx.toFixed(1) + ',' + state.cy.toFixed(1) + ') rotate(' + state.rot.toFixed(1) + ')'); updateReadout(); }

      lockedWhy: 'This question is already marked.',
      onCommit: function () { runCheck(); }
    });

    var msgEl = el('p', 'ui-msg');
    body.appendChild(msgEl);
    var checkRow = el('div', 'check-row');
    var checkBtn = el('button', 'btn-stamp', T.protractorCheckBtn);
    checkBtn.type = 'button';
    checkRow.appendChild(checkBtn);
    body.appendChild(checkRow);
    var feedback = el('div', 'jq-feedback');
    body.appendChild(feedback);

    function flash(t) { msgEl.textContent = t; }

    function finish(last, instant) {
      var res = protractorMark(q, last.read);
      feedback.innerHTML = '';
      var mk = el('span', 'wl-mark');
      mk.setAttribute('data-mark', '');
      mk.style.cssText = 'position:static;display:inline-block;width:26px;height:22px;vertical-align:middle';

      drawMark(mk, res.ok ? 'tick' : 'cross');
      var tally = el('span', 'mk-tally ' + (res.ok ? 'mk-correct' : 'mk-wrong'),
        ' ' + (res.ok ? '1/1' : '0/1') + (res.ok ? '' : fill(T.measuredReadout, { value: last.read })));
      tally.setAttribute('data-mark', '');
      feedback.appendChild(tally);
      if (rec.lock) {
        window.GJ.setState(wrap, 'question', res.ok ? 'checked-right' : (rec.att.length >= 2 ? 'checked-wrong-2' : 'checked-wrong-1'));
        if (res.ok) {
          var comment = el('p', 'mk-comment mk-correct', commentFor(q.id, 'perfect', 'protractor'));
          comment.setAttribute('data-mark', '');

        } else if (res.dx === 'WRONG_SCALE') {
          var truthWS = el('p', 'amber-note', fill(T.protractorReadTrueWrongScale, { value: q.value }));
          truthWS.setAttribute('data-truth', '');
          feedback.appendChild(truthWS);
        } else {

          truthG.setAttribute('data-truth', '');

        }

        composer.setLocked(true, 'This question is already marked.');   // functionally lock: no more typing once correct or out of attempts (also on reload)

      } else if (!instant) {
        window.GJ.setState(wrap, 'question', 'checked-wrong-1');

      }

    }
