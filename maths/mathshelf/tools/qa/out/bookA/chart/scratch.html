<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CHART-A scratch</title>
<style>
  :root { --ink:#14213A; --pencil:#474D57; --copper:#A6522B; --copper-glow:#E8935A; --copper-ink:#7E3B1C;
    --grid-major:#979083; --grid-minor:#CFC9BC; --paper:#FBFAF7; --panel:#FFFFFF; --hairline:#E8E4DB; --sq:20px;
    --f-maths:'STIX Two Text','Cambria',Georgia,serif; --f-stationery:'Spline Sans Mono',ui-monospace,monospace; --f-hand:system-ui,sans-serif;
    --marking-green:#1F7A33; --marking-red:#C8102E; --navy:#1A3A6B; --grid-line:rgba(27,90,135,.10); --support-rose:#8E3E64; }
  body { margin:0; background:var(--paper); color:var(--ink); font-family:var(--f-hand); }
  .wrap { max-width: 720px; margin: 0 auto; padding: 8px; }
  .movie-stage { position:relative; padding: var(--sq); background-image: linear-gradient(var(--grid-line) 1px, transparent 1px), linear-gradient(90deg, var(--grid-line) 1px, transparent 1px); background-size: var(--sq) var(--sq); }
  .movie-stage svg { display:block; max-width:100%; height:auto; margin:0 auto; }
  .movie-stage .ml-chart { max-width:400px; width:100%; }
  .movie-stage .ml-axis-num { font-family:var(--f-maths); font-size:11px; fill:var(--pencil); }
  .movie-stage .ml-axis-label { font-family:var(--f-hand); font-size:12px; fill:var(--navy); }
  .movie-stage .ml-read { font-family:var(--f-maths); font-size:13px; fill:var(--copper-ink); }
  .movie-line { font-family:var(--f-maths); font-size:20px; margin: 4px 0; }
  .ml-table { border-collapse:collapse; margin:6px auto; } .ml-table th,.ml-table td { border:1px solid var(--grid-major); padding:3px 8px; font-family:var(--f-maths); }
  .ml-table .ml-blank { width:46px; height:10px; display:block; margin:0 auto; }
  .theorem-stamp { display:inline-block; border:2px solid var(--copper); padding:4px 10px; color:var(--copper-ink); font-weight:600; }
  .stat-board-frame { background:var(--panel); border:1px solid var(--hairline); border-radius:8px; }
  .stat-board { display:block; width:100%; height:auto; background:var(--panel); color:var(--ink); }
  .stat-board text, .stat-svg-label { fill: currentColor; }
  .stat-svg-label { font-family: var(--f-maths); color: var(--ink); user-select:none; }
  .stat-label-layer { position:absolute; inset:0; pointer-events:none; overflow:hidden; }
  .stat-label { position:absolute; transform:translate(-50%,-100%); white-space:nowrap; font-family:var(--f-stationery); font-size:13px; line-height:1.15; color:var(--ink); background:var(--panel); padding:1px 5px; border-radius:4px; pointer-events:none; }
  .stat-label[data-label-kind="readout"], .stat-label[data-label-kind="drop"] { color: var(--copper-ink); }
  .stat-scroll-track { position:relative; height:6px; margin:6px 2px 0; border-radius:3px; background:var(--hairline); overflow:hidden; }
  .stat-scroll-thumb { position:absolute; top:0; bottom:0; left:0; width:40%; background:var(--copper); }
  [hidden] { display:none !important; }
  .movie-controls button { min-height: 44px; }
  /* proposed CSS block (mirrors CHART_NOTES.md) */
  .stat-venn-val, .stat-sector-label, .stat-sl-leaf, .stat-sl-stem, .stat-sl-key-text { font-family: var(--f-maths); }
  .stat-sl-leaf, .stat-sl-stem, .stat-sl-key-text { font-family: var(--f-stationery); }
  .stat-pt.is-given circle { fill: var(--ink); }
  .stat-pt.is-outlier circle { stroke: var(--copper); stroke-width: 2; }
  .stat-lobf { stroke: var(--copper); }
  .stat-lobf-handle { cursor: grab; }
  .stat-sector { fill: rgba(166,82,43,0.16); }
  .stat-pie-rim { cursor: crosshair; }
  /* the laptop-reclaim rig: a question with a 72px number column to the host's left */
  .jotter-q { position:relative; padding-left: 72px; width: 770px; box-sizing: border-box; }
  .jotter-q .jq-margin { position:absolute; left:0; top:0; width:60px; color:var(--pencil); }
</style></head>
<body><div class="wrap">
  <h2 style="font:600 16px/1.3 system-ui">CHART-A scratch — film</h2>
  <div id="film"></div>
  <h2 style="font:600 16px/1.3 system-ui">scatter grid (question board)</h2>
  <div id="grid"></div>
  <h2 style="font:600 16px/1.3 system-ui">pie (question board)</h2>
  <div id="pie"></div>
  <h2 style="font:600 16px/1.3 system-ui">venn3 (question board)</h2>
  <div id="venn3"></div>
</div>
<h2 style="font:600 16px/1.3 system-ui;margin-left:8px">laptop reclaim rig (698 px body, 0–60 scale)</h2>
<div class="jotter-q" id="rig"><div class="jq-margin">Q7</div><div id="rigHost" class="stat-board-host"></div></div>
<script src="../../../../../mathcore.js"></script>
<script src="../../../../../statchart.js"></script>
<script src="../../../../../player.js"></script>
<script>
window.__scratch = {};
var movie = {
  title: 'CHART-A scratch film', mode: 'paper',
  steps: [
    { say: 'Two circles, and the overlap first.', do: [ { venn: { circles: [{ id: 'A', label: 'Milk' }, { id: 'B', label: 'Sugar' }], n: 130 } }, { vfill: { region: 'both', text: '22' } } ] },
    { say: 'Milk only, sugar only, outside.', do: [ { vfill: { region: 'A', text: '59' } }, { vfill: { region: 'B', text: '26' } }, { vfill: { region: 'out', text: '23' } } ] },
    { say: 'The circle and its first radius.', do: [ { pie: {} } ] },
    { say: 'Four sectors clockwise from 12 o\'clock.', do: [ { sector: { deg: 156, label: 'Bus' } }, { sector: { deg: 84, label: 'Walk' } }, { sector: { deg: 60, label: 'Car' } }, { sector: { deg: 60, label: 'Bike' } } ] },
    { say: 'Stems, then leaves one at a time.', do: [ { stemleaf: { stems: [2, 3, 4], decimals: 1, unit: 'cm' } }, { leaf: { stem: 2, leaf: 4 } }, { leaf: { stem: 2, leaf: 6 } }, { leaf: { stem: 3, leaf: 1 } } ] },
    { say: 'The key.', do: [ { key: { stem: 2, leaf: 1, means: '2.1 cm' } } ] },
    { say: 'The cloud and the line through it.', do: [ { chart: { x: { min: 0, max: 100, step: 20, label: 'Maths mark' }, y: { min: 0, max: 100, step: 20, label: 'Science mark' } } }, { plot: { x: 20, y: 30 } }, { plot: { x: 40, y: 45 } }, { plot: { x: 60, y: 62 } }, { plot: { x: 80, y: 78 } }, { lobf: { through: [[20, 30], [80, 78]] } } ] },
    { say: 'Read the estimate at 60.', do: [ { rule: { x: 60 } }, { drop: {} }, { stamp: { text: 'positive correlation' } } ] }
  ]
};
window.__scratch.player = GJ_PLAYER.mount(document.getElementById('film'), movie);
window.__scratch.movie = movie;

// scatter grid: given points, placed points, lobf, two handles, an outlier, a vertical rule + drop
var bd = GJ_STATCHART.render(document.getElementById('grid'), { x: { min: 0, max: 100, step: 20, label: 'Maths mark' }, y: { min: 20, max: 100, step: 20, label: 'Science mark' }, sq: { x: 5, y: 5 }, major: 4 }, {});
window.__scratch.grid = bd;
[[20, 30], [40, 45], [60, 62], [80, 78], [90, 40]].forEach(function (p) { bd.addPoint(p[0], p[1], { given: true }); });
var placed = bd.addPoint(50, 55);
var L = bd.line([20, 30], [80, 80], { cls: 'stat-lobf' });   /* on the 5-grid: a handle SNAPS, so (80,78) would land at (80,80) */
bd.handleAt(20, 30, 0); bd.handleAt(80, 80, 1);
bd.markOutlier(4);
bd.ruleX(60); window.__scratch.dropAt60 = bd.drop();
window.__scratch.lobfEnds = L.ends();

// pie question board
var pieH = GJ_STATCHART.pie(document.getElementById('pie'), { onRimTap: function (d) { window.__scratch.lastTap = d; } });
window.__scratch.pie = pieH;
pieH.boundary(156, { placed: true }); pieH.boundary(240, { placed: true });
pieH.sector(0, 156, 0, { instant: true }); pieH.sector(156, 240, 1, { instant: true });
pieH.readout('240°');

// venn3
var v3 = GJ_STATCHART.venn(document.getElementById('venn3'), { circles: [{ id: 'A', label: 'Football' }, { id: 'B', label: 'Hockey' }, { id: 'C', label: 'Tennis' }], n: 60 }, {});
window.__scratch.venn3 = v3;
['A','B','C','AB','AC','BC','ABC','out'].forEach(function (r, i) { v3.fill(r, String(3 + i), { instant: true }); });

// the laptop reclaim rig: a 0-60 scale (sq 1) in a 698 px host
var rig = GJ_STATCHART.render(document.getElementById('rigHost'), { min: 0, max: 60, step: 10, sq: 1, label: 'Marks' }, {});
window.__scratch.rig = rig;
</script>
</body></html>
