<!DOCTYPE html><html lang="en-GB"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>QA — every plate at full size</title>
<link rel="stylesheet" href="../../style.css"><link rel="stylesheet" href="style.css">
<style>body{padding:16px}.qa h2{font-family:Anton,sans-serif;color:#1A3A6B;margin:26px 0 8px}</style>
</head><body class="tm"><div class="qa" id="qa"></div>
<script src="assets/vendor/gsap.min.js"></script>
<script src="assets/store.js"></script><script src="assets/drag.js"></script>
<script src="assets/worldmap.js"></script><script src="assets/diagrams.js"></script>
<script src="assets/sims.js"></script><script src="assets/plates.js"></script>
<script src="assets/folio.js"></script><script src="assets/board.js"></script>
<script src="topics/margins-landforms/content.js"></script>
<script>
window.TM={el:(t,c,h)=>{const n=document.createElement(t);if(c)n.className=c;if(h!=null)n.innerHTML=h;return n;},
 esc:s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'),
 rich:s=>String(s==null?'':s),shuffle:a=>a.slice(),announce:()=>{},norm:s=>s,
 prefersReduced:()=>false,onLeave:()=>{},go:()=>{},refreshChrome:()=>{},
 topic:()=>window.OLS_A2PT_TOPICS[0],chapterById:id=>window.OLS_A2PT_TOPICS[0].chapters.find(c=>c.id===id)};
const host=document.getElementById('qa');
const Q=new URLSearchParams(location.search);
const FROM=Number(Q.get('from')||0), COUNT=Number(Q.get('count')||99);
window.TM_PLATES.PLATES.slice(FROM,FROM+COUNT).forEach(p=>{
  const h=document.createElement('h2');h.textContent='PLATE '+window.TM_PLATES.roman(p.num)+' — '+p.title;
  host.appendChild(h);
  const d=document.createElement('div');d.className='sim';
  const st=document.createElement('div');st.className='sim-stage';
  const b=(p.from==='diagram')?window.TM_DIAGRAMS.DIAGRAMS[p.ref].build():null;
  if(b){ // static diagram: draw its labels
    const g=document.createElementNS('http://www.w3.org/2000/svg','g');
    (b.labels||[]).forEach(l=>g.appendChild(window.TM_SCENE.label(l.x,l.y,l.text,{leadTo:l.lead,halo:true,anchor:l.anchor,colour:'#12294F',leadColour:'#12294F'})));
    b.svg.appendChild(g); st.appendChild(b.svg);
  } else {
    const def=window.TM_SIMS.SIMS[p.ref]; const els=def.build();
    Object.keys(els).forEach(k=>{const n=els[k];if(n&&n.getAttribute&&n.getAttribute('opacity')==='0')n.setAttribute('opacity','1');});
    if(def.plateFrame)def.plateFrame(els);
    const g=document.createElementNS('http://www.w3.org/2000/svg','g');
    (p.labels||[]).forEach(l=>g.appendChild(window.TM_SCENE.label(l.x,l.y,l.text,{leadTo:l.to,halo:true,anchor:l.anchor,colour:'#12294F',leadColour:'#12294F'})));
    els.svg.appendChild(g); st.appendChild(els.svg);
  }
  d.appendChild(st);host.appendChild(d);
});
</script></body></html>
