<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Search</title>
<style>
@font-face { font-family: "Space Grotesk"; src: url("search/fonts/space-grotesk.woff2") format("woff2"); font-weight: 300 700; font-display: block; }
@font-face { font-family: "Caveat"; src: url("search/fonts/caveat-bold.woff2") format("woff2"); font-weight: 700; font-display: block; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; background: #000; overflow: hidden; }
body { font-family: "Space Grotesk", system-ui, sans-serif; color: #fff; -webkit-font-smoothing: antialiased; user-select: none; }
canvas#c { position: fixed; inset: 0; display: block; }
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
.hand { font-family: "Caveat", cursive; }

/* the phone, before anything */
#call { position: fixed; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 2.2rem; background: radial-gradient(ellipse at 50% 42%, #101a2e 0%, #05070d 70%); }
#call.on { display: flex; }
.alert { display: flex; flex-direction: column; align-items: center; gap: 1.5rem; animation: buzz 2.4s 4; }
.alert .k { display: flex; align-items: center; gap: 0.7rem; font-size: 1.05rem; font-weight: 700; letter-spacing: 0.3em; color: #7fd4ff; }
.alert .k i { width: 0.8rem; height: 0.8rem; border-radius: 50%; background: #4fc3ff; box-shadow: 0 0 1rem #4fc3ff; }
.alert h1 { font-size: 3.1rem; font-weight: 700; letter-spacing: -0.01em; text-align: center; }
#read { margin-top: 0.6rem; padding: 1.15rem 3.4rem; border-radius: 99rem; background: #2f8dff; color: #fff; font-size: 1.5rem; font-weight: 700; letter-spacing: 0.12em; box-shadow: 0 0 0 0.45rem rgba(47,141,255,0.22), 0 1rem 3rem rgba(47,141,255,0.35); transition: transform 0.15s; }
#read:hover { transform: scale(1.04); }
#read:focus-visible, .tog:focus-visible, .endb:focus-visible { outline: 0.2rem solid #fff; outline-offset: 0.25rem; }
.small { font-size: 1.05rem; color: #aab3c5; text-align: center; }
.togs { display: flex; gap: 0.9rem; }
.tog { padding: 0.55rem 1.1rem; border-radius: 99rem; border: 0.09rem solid #4a5368; color: #d5dbe8; font-size: 0.95rem; background: rgba(8,12,22,0.6); }
.tog:hover { border-color: #aab3c5; }
.tog.on { border-color: #ffb347; color: #ffd48a; }
@keyframes buzz { 0%, 16%, 100% { transform: translate(0, 0) rotate(0); } 2% { transform: translate(-0.4rem, 0.1rem) rotate(-0.6deg); } 4% { transform: translate(0.4rem, -0.1rem) rotate(0.6deg); } 6% { transform: translate(-0.4rem, 0) rotate(-0.4deg); } 8% { transform: translate(0.4rem, 0) rotate(0.4deg); } 10% { transform: translate(-0.3rem, 0.1rem) rotate(0); } 12% { transform: translate(0.3rem, -0.1rem) rotate(0); } }

/* Nuala's message */
#scrim { position: fixed; inset: 0; background: rgba(3,5,10,0.64); opacity: 0; visibility: hidden; transition: opacity 0.6s, visibility 0.6s; }
#scrim.on { opacity: 1; visibility: visible; }
#msg { position: fixed; left: 50%; top: 50%; width: 27rem; transform: translate(-50%, -46%); visibility: hidden; opacity: 0; transition: opacity 0.5s, transform 0.5s; }
#msg.on { visibility: visible; }
#msg.in { opacity: 1; transform: translate(-50%, -50%); }
#msg.out { opacity: 0; transform: translate(-50%, -56%); }
#msg .from { display: flex; justify-content: space-between; align-items: baseline; margin: 0 0.4rem 0.5rem; font-size: 0.95rem; color: #aab3c5; letter-spacing: 0.05em; }
#msg .from b { color: #fff; font-size: 1.15rem; letter-spacing: 0; }
#msg .bubble { padding: 1.1rem 1.35rem 1.2rem; border-radius: 1.4rem 1.4rem 1.4rem 0.3rem; background: #263447; font-size: 1.62rem; font-weight: 500; line-height: 1.3; box-shadow: 0 1.2rem 3rem rgba(0,0,0,0.6); }
#msg .pic { margin-top: 0.7rem; width: 22rem; border-radius: 1.2rem; overflow: hidden; background: #263447; padding: 0.4rem; transform: rotate(-2.2deg) translateY(1rem); opacity: 0; transition: opacity 0.5s, transform 0.5s; box-shadow: 0 1.2rem 3rem rgba(0,0,0,0.6); }
#msg.photo .pic { opacity: 1; transform: rotate(-2.2deg) translateY(0); }
#msg .pic canvas { display: block; width: 100%; height: auto; border-radius: 0.9rem; }
#msg .noteline { margin: 0.6rem 0 0 1.2rem; font-size: 2.05rem; color: #ffd48a; opacity: 0; transform: translateY(0.5rem); transition: opacity 0.4s, transform 0.4s; text-shadow: 0 0.1rem 0.4rem #000; }
#msg.note .noteline { opacity: 1; transform: none; }

/* words over the picture */
.over { position: fixed; pointer-events: none; visibility: hidden; opacity: 0; transition: opacity 0.35s; }
#cap { left: 50%; bottom: 7.5%; transform: translateX(-50%); max-width: 46rem; padding: 0.7rem 1.5rem; border-radius: 0.8rem; background: rgba(5,8,16,0.74); font-size: 1.62rem; font-weight: 500; text-align: center; white-space: nowrap; }
#speech { width: max-content; max-width: 25rem; padding: 0.95rem 1.4rem 1.05rem; border-radius: 1.1rem; background: rgba(12,10,6,0.9); border: 0.14rem solid #ffb347; box-shadow: 0 0 2.2rem rgba(255,179,71,0.35); }
#speech::before { content: ""; position: absolute; left: -0.78rem; top: 2.3rem; width: 1.3rem; height: 1.3rem; background: rgb(12,10,6); border-left: 0.14rem solid #ffb347; border-bottom: 0.14rem solid #ffb347; transform: rotate(45deg); }
#speech .who { display: block; font-size: 0.86rem; font-weight: 700; letter-spacing: 0.26em; color: #ffb347; margin-bottom: 0.3rem; }
#say { font-size: 1.7rem; font-weight: 700; line-height: 1.22; }
#snd { position: fixed; left: 1.1rem; bottom: 1rem; visibility: hidden; opacity: 0; font-size: 0.86rem; }
#nav { position: fixed; right: 1.1rem; bottom: 1rem; display: flex; gap: 0.6rem; visibility: hidden; opacity: 0; }
#nav button { padding: 0.55rem 1.1rem; border-radius: 99rem; border: 0.09rem solid #4a5368; color: #d5dbe8; font-size: 0.95rem; background: rgba(8,12,22,0.6); }

/* the end, and the close-ups */
#end { position: fixed; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: flex-end; gap: 1.2rem; padding-bottom: 9%; background: linear-gradient(180deg, rgba(0,0,0,0) 40%, rgba(0,0,0,0.75) 100%); }
#end.on { display: flex; }
#endmsg { font-size: 1.7rem; font-weight: 500; text-shadow: 0 0.12rem 0.3rem #000; }
#end .row { display: flex; gap: 0.8rem; flex-wrap: wrap; justify-content: center; }
.endb { padding: 0.8rem 1.5rem; border-radius: 99rem; border: 0.12rem solid #ffb347; color: #ffd48a; font-size: 1.05rem; font-weight: 700; background: rgba(8,12,22,0.75); }
.endb:hover { background: rgba(255,179,71,0.18); }
#sheet { position: fixed; left: 0; right: 0; top: 1.4rem; display: none; flex-direction: column; align-items: center; gap: 0.8rem; }
#sheet.on { display: flex; }
#sheetName { font-size: 1.5rem; font-weight: 700; letter-spacing: 0.02em; text-shadow: 0 0.12rem 0.3rem #000; }
#moods { display: flex; gap: 0.6rem; }
#sheetBack { position: fixed; left: 1.1rem; top: 1.1rem; padding: 0.55rem 1.1rem; border-radius: 99rem; border: 0.09rem solid #4a5368; color: #d5dbe8; font-size: 0.95rem; background: rgba(8,12,22,0.6); }
/* ---------- THE HOUR: overlay scaled with the stage ---------- */
#end, #sheet, #nav { display: none !important; }
#hour { position: fixed; left: 0; top: 0; width: 1600px; height: 900px; transform-origin: 0 0; z-index: 6; font-family: "Space Grotesk", system-ui, sans-serif; color: #f3f0ea; pointer-events: none; }
#hour > * { pointer-events: auto; }
#hour .off { display: none !important; }
#hour.off { display: none !important; } /* the overlay itself hides during the film (strip, Pause and gauge with it) */
#hour button { font: inherit; font-size: 24px; padding: 12px 26px; border-radius: 14px; border: 2px solid rgba(255,255,255,0.35); background: rgba(20,24,44,0.85); color: #f3f0ea; cursor: pointer; }
#hour button.pri { background: #e9c46a; color: #1a1a2a; border-color: #e9c46a; font-weight: 700; }
#hour button:disabled { opacity: 0.4; cursor: default; }
#strip { position: absolute; left: 40px; bottom: 18px; font-size: 19px; color: rgba(243,240,234,0.75); letter-spacing: 0.02em; }
#strip span.cur { color: #e9c46a; font-weight: 700; } #strip span.done { color: rgba(243,240,234,0.5); } #strip i { margin: 0 10px; font-style: normal; opacity: 0.5; }
#note { position: absolute; left: 640px; right: 180px; top: 22px; /* clear of the gauge (40..600) and the Pause button */ text-align: center; font-size: 24px; background: #e9c46a; color: #1a1a2a; padding: 12px 20px; border-radius: 14px; font-weight: 600; }
#gauge { position: absolute; left: 40px; top: 24px; width: 560px; } #gLabel { font-size: 20px; display: block; margin-bottom: 6px; text-shadow: 0 2px 6px #000; }
#gauge .bar { height: 14px; border-radius: 8px; background: rgba(255,255,255,0.18); overflow: hidden; } #gBar { height: 100%; width: 100%; background: #e9c46a; transition: width 0.25s linear; } #gauge.low #gBar { background: #ff5a4e; }
#held { position: absolute; left: 60px; width: 880px; top: 60px; text-align: center; font-size: 38px; font-weight: 700; text-shadow: 0 2px 10px #000; }
#bub { position: absolute; max-width: 440px; background: rgba(255,250,240,0.96); color: #1a1a2a; border-radius: 20px; padding: 14px 20px 16px; box-shadow: 0 8px 30px rgba(0,0,0,0.4); transform: translate(-30%, -100%); }
#bub .who { display: block; font-size: 15px; letter-spacing: 0.12em; color: #8a6a1a; font-weight: 700; } #bub .say { font-size: 25px; line-height: 1.3; }
#panel { position: absolute; left: 1040px; top: 50px; width: 520px; }
#kicker { font-size: 19px; letter-spacing: 0.16em; color: #e9c46a; font-weight: 700; min-height: 26px; }
#above { font-size: 24px; margin: 10px 0; color: rgba(243,240,234,0.9); }
#head { font-size: 33px; line-height: 1.22; margin: 8px 0 16px; font-weight: 600; text-shadow: 0 2px 8px #000; }
#card { background: rgba(10,14,30,0.82); border: 2px solid rgba(255,255,255,0.18); border-radius: 14px; padding: 12px 16px; font-family: ui-monospace, Menlo, monospace; font-size: 26px; line-height: 1.5; white-space: pre; margin-bottom: 14px; }
#card .cl.ring { outline: 3px solid #e9c46a; outline-offset: 2px; border-radius: 6px; } .dots { color: #e9c46a; letter-spacing: 0.1em; }
#sign { font-size: 23px; margin-bottom: 12px; color: #ffe8a6; }
#box { width: 100%; box-sizing: border-box; font-family: ui-monospace, Menlo, monospace; font-size: 26px; line-height: 1.5; background: #0d1020; color: #fff; border: 2px solid rgba(255,255,255,0.4); border-radius: 12px; padding: 10px 14px; resize: none; outline: none; caret-color: #e9c46a; }
#box:focus { border-color: #e9c46a; } #box.hand { font-family: "Caveat", cursive; font-size: 44px; }
#under { font-size: 22px; line-height: 1.3; min-height: 64px; margin: 12px 0; } #under.ok { color: #9fe3a8; } #under.bad { color: #ffb0a8; }
#pbtn { display: flex; gap: 14px; flex-wrap: wrap; }
#hsheet { position: absolute; left: 40px; top: 70px; width: 960px; box-sizing: border-box; background: rgba(8,10,24,0.93); border: 2px solid rgba(255,255,255,0.14); border-radius: 22px; padding: 36px 44px 30px; max-height: 760px; overflow: hidden; }
#hsheet .k { font-size: 18px; letter-spacing: 0.16em; color: #e9c46a; font-weight: 700; } #hsheet h2 { font-size: 36px; margin: 10px 0 18px; line-height: 1.2; } #hsheet .p { font-size: 25px; line-height: 1.35; margin: 10px 0; }
#hsheet .p.seen { color: rgba(243,240,234,0.7); } #hsheet pre.ev { font-family: ui-monospace, Menlo, monospace; font-size: 26px; background: rgba(0,0,0,0.4); padding: 12px 16px; border-radius: 12px; margin: 0 0 14px; }
#hsheet .opts { display: flex; flex-direction: column; gap: 12px; margin: 10px 0; } #hsheet .opt { text-align: left; font-family: ui-monospace, Menlo, monospace; } #hsheet .opt.right { border-color: #9fe3a8; color: #9fe3a8; } #hsheet .opt.wrong { opacity: 0.45; }
#hsheet .fb { min-height: 36px; } #hsheet .fb.ok { color: #9fe3a8; } #hsheet .fb.bad { color: #ffb0a8; }
#hsheet .lab .row { display: grid; grid-template-columns: 360px 1fr; gap: 20px; align-items: center; margin: 8px 0; } #hsheet .lab code { font-family: ui-monospace, Menlo, monospace; font-size: 26px; white-space: pre; background: rgba(0,0,0,0.4); padding: 8px 14px; border-radius: 10px; } #hsheet .lab span { font-size: 24px; }
#hsheet .p.box { border: 2px solid #e9c46a; border-radius: 12px; padding: 12px 16px; margin-top: 18px; }
#hsheet .badges { display: flex; gap: 20px; margin-top: 16px; } #hsheet .badge { flex: 1; background: rgba(233,196,106,0.14); border: 2px solid #e9c46a; border-radius: 16px; padding: 20px; } #hsheet .badge b { display: block; font-size: 28px; margin-bottom: 8px; } #hsheet .badge span { font-size: 22px; }
#hsheet .felt { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin: 14px 0; font-size: 24px; } #hsheet .fb3 { display: flex; gap: 10px; } #hsheet .fb3 button { font-size: 21px; padding: 8px 16px; } #hsheet .fb3 button.picked { background: #e9c46a; color: #1a1a2a; }
#above .starter { font-size: 20px; padding: 8px 14px; margin: 0 8px 8px 0; }
#tour { position: absolute; inset: 0; } #tourHole { position: absolute; border-radius: 16px; box-shadow: 0 0 0 4000px rgba(0,0,0,0.62); pointer-events: none; }
#tourCard { position: absolute; width: 380px; background: #fffaf0; color: #1a1a2a; border-radius: 18px; padding: 18px 22px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); } #tourText { font-size: 25px; line-height: 1.3; margin-bottom: 12px; } #tourNext { background: #e9c46a; color: #1a1a2a; border-color: #e9c46a; font-weight: 700; }
#pausedScrim { position: absolute; inset: 0; background: rgba(0,0,0,0.86); display: flex; align-items: center; justify-content: center; font-size: 36px; text-align: center; }
#pauseBtn { position: absolute; right: 40px; top: 22px; font-size: 20px; padding: 8px 18px; }
#rot { position: absolute; inset: 0; background: #000; display: flex; align-items: center; justify-content: center; font-size: 40px; }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="scrim"></div>
<div id="msg">
  <div class="from"><b>Nuala</b><span>4:52 pm</span></div>
  <div class="bubble">Our lamb’s gone. It’s getting dark. Snow’s coming. Please.</div>
  <div class="pic"><canvas id="pc" width="720" height="540"></canvas></div>
  <div class="noteline hand">she’s only 3 weeks old</div>
</div>
<div id="cap" class="over"></div>
<div id="speech" class="over"><span class="who">BEEP</span><div id="say"></div></div>
<div id="nav"><button id="back" type="button">Back</button><button id="next" type="button">Next</button></div>
<button id="snd" class="tog" type="button">Sound is on</button>

<div id="end">
  <p id="endmsg">That is the look of it. Press a face to see it up close.</p>
  <div class="row">
    <button id="again" class="endb" type="button">Watch it again</button>
    <button id="bBeep" class="endb" type="button">BEEP up close</button>
    <button id="bLamb" class="endb" type="button">The lamb up close</button>
    <button id="bNuala" class="endb" type="button">Nuala up close</button>
  </div>
</div>
<div id="sheet">
  <div id="sheetName"></div>
  <div id="moods"></div>
  <button id="sheetBack" type="button">Back to the end</button>
</div>

<div id="call">
  <div class="alert">
    <div class="k"><i></i>NEW MESSAGE</div>
    <h1>Your phone is buzzing.</h1>
    <button id="read" type="button">READ IT</button>
  </div>
  <p class="small">Best with headphones. It also works with the sound off.</p>
  <div class="togs">
    <button id="tSound" class="tog" type="button">Sound is on</button>
  </div>
</div>


<div id="hour" class="off">
  <div id="strip"></div>
  <div id="note" class="off"></div>
  <div id="gauge" class="off"><span id="gLabel"></span><div class="bar"><div id="gBar"></div></div></div>
  <div id="held" class="off"></div>
  <div id="bub" class="off"><span class="who">BEEP</span><div class="say"></div></div>
  <div id="panel">
    <div id="kicker"></div>
    <div id="above" class="off"></div>
    <div id="head"></div>
    <div id="card" class="off"></div>
    <div id="sign" class="off"></div>
    <div id="boxWrap" class="off"><textarea id="box" rows="1" spellcheck="false"></textarea></div>
    <div id="under"></div>
    <div id="pbtn"></div>
  </div>
  <div id="hsheet" class="off"></div>
  <div id="tour" class="off"><div id="tourHole"></div><div id="tourCard"><div id="tourText"></div><button id="tourNext" type="button">Next</button></div></div>
  <div id="pausedScrim" class="off"></div>
  <button id="pauseBtn" type="button">Pause</button>
  <div id="rot" class="off">Turn your screen sideways.</div>
</div>

<script src="search/chars.js"></script>
<script src="search/scene.js"></script>
<script src="search/sound.js"></script>
<script src="search/film.js"></script>
<script src="hour/strings.js"></script>
<script src="hour/judge.js"></script>
<script src="hour/sound2.js"></script>
<script src="hour/cast.js"></script>
<script src="hour/ui.js"></script>
<script src="hour/pics.js"></script>
<script src="hour/bridge.js"></script>
<script src="hour/chapters.js"></script>
<script src="hour/free.js"></script>
<script src="hour/main.js"></script>
</body>
</html>
