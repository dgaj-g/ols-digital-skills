<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Search</title>
<link rel="preload" href="search/fonts/caveat-bold.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="search/fonts/space-grotesk.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face { font-family: "Space Grotesk"; src: url(search/fonts/space-grotesk.woff2) format("woff2"); font-weight: 300 700; font-display: block; }
@font-face { font-family: "Caveat"; src: url(search/fonts/caveat-bold.woff2) format("woff2"); font-weight: 700; font-display: block; }
:root { --gold: #e9c46a; --text: #f3f0ea; --dim: #b9b4c8; --blue: #9fd3ff; --orange: #f4a261; --red: #e76f51; --mono: ui-monospace, Menlo, monospace; }
html, body { margin: 0; height: 100%; background: #000; color: var(--text); overflow: hidden; font-family: "Space Grotesk", system-ui, sans-serif; }
#c { position: fixed; inset: 0; display: block; }
#stage { position: fixed; left: 0; top: 0; width: 1600px; height: 900px; transform-origin: 0 0; pointer-events: none; }
#stage .live { pointer-events: auto; }
.hide { display: none !important; }
b.py, .kw { color: var(--gold); font-weight: 700; }
.num { color: var(--blue); }
code, .code { font-family: var(--mono); }

/* the clock band (spec 5.5) */
#clock { position: absolute; left: 40px; right: 40px; top: 12px; height: 88px; }
#clock .words { position: absolute; left: 0; top: 6px; font-size: 30px; font-weight: 600; text-shadow: 0 2px 8px #000; }
#clock .digits { position: absolute; right: 0; top: -6px; font-size: 64px; font-weight: 700; font-variant-numeric: tabular-nums; text-shadow: 0 2px 10px #000; }
#clock .bar { position: absolute; left: 0; right: 0; bottom: 4px; height: 22px; border-radius: 11px; background: rgba(0,0,0,.55); border: 2px solid rgba(255,255,255,.25); overflow: hidden; }
#clock .fill { position: absolute; right: 0; top: 0; bottom: 0; width: 100%; background: var(--gold); border-radius: 9px; }
#clock.orange .fill { background: var(--orange); } #clock.orange .digits { color: var(--orange); }
#clock.red .fill { background: var(--red); } #clock.red .digits { color: var(--red); }
#clock.red.beat .digits, #clock.red.beat .fill { filter: brightness(1.45); }
#clock.wait .digits { opacity: .55; }

/* the lamb's window (spec 5.6) */
#lambwin { position: absolute; left: 770px; top: 116px; width: 220px; height: 170px; border-radius: 12px; overflow: hidden; border: 3px solid rgba(240,236,226,.85); box-shadow: 0 6px 24px rgba(0,0,0,.6); box-sizing: border-box; }
#lambwin canvas { position: absolute; left: 0; top: 0; width: 214px; height: 164px; }
#lambcap { position: absolute; left: 770px; top: 288px; width: 220px; text-align: center; font: 700 26px Caveat, cursive; color: #fff; text-shadow: 0 0 4px #000, 0 0 8px #000, 0 2px 2px #000; }
#lambwin.big { transition: all .9s ease-in-out; }

/* the panel (spec 4) */
#panel { position: absolute; left: 1030px; top: 116px; width: 540px; height: 720px; box-sizing: border-box; padding: 30px 32px 28px; background: rgba(12,14,26,.95); border: 1px solid rgba(255,255,255,.14); border-radius: 18px; box-shadow: 0 10px 40px rgba(0,0,0,.55); display: flex; flex-direction: column; }
#panel .stepl { font-size: 16px; letter-spacing: .14em; color: var(--gold); font-weight: 600; margin-bottom: 14px; }
#panel h2 { font-size: 30px; line-height: 1.22; margin: 0 0 14px; font-weight: 700; }
#panel .sub { font-size: 21px; line-height: 1.38; color: #e6e2ee; margin: 0 0 14px; }
#panel p { font-size: 22px; line-height: 1.42; margin: 0 0 12px; }
#panel .grow { flex: 1; min-height: 0; position: relative; }
#panel .btns { display: flex; justify-content: space-between; align-items: center; min-height: 60px; margin-top: 10px; }
button { font-family: inherit; cursor: pointer; }
.btn { font-size: 22px; font-weight: 700; padding: 12px 26px; border-radius: 30px; border: 2px solid rgba(255,255,255,.35); background: transparent; color: var(--text); }
.btn.pri { background: var(--gold); border-color: var(--gold); color: #1a1526; }
.btn:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
.btn.next { opacity: 0; transition: opacity .3s; visibility: hidden; }
.btn.next.on { opacity: 1; visibility: visible; }

/* talk screens (spec 5.2) */
.talk { display: flex; align-items: center; gap: 20px; margin: 10px 0 22px; }
.talk canvas { width: 140px; height: 140px; border-radius: 50%; background: radial-gradient(circle at 50% 40%, #2b2f52, #10121f); border: 3px solid rgba(233,196,106,.55); flex: none; }
.talk .who { font-size: 22px; letter-spacing: .16em; font-weight: 700; color: var(--gold); }
.talkline { font-size: 30px; line-height: 1.34; font-weight: 500; }

/* the card */
.card { background: #f6f1e4; color: #1d1b26; border-radius: 12px; padding: 14px 18px 14px 18px; margin: 0 0 14px; position: relative; box-shadow: 0 4px 0 rgba(0,0,0,.35); }
.card .lab { font-size: 15px; letter-spacing: .12em; text-transform: uppercase; color: #6c6476; font-weight: 700; margin-bottom: 6px; }
.card .ln { font-family: var(--mono); font-size: 26px; line-height: 1.5; white-space: pre; border-radius: 6px; padding: 0 6px; margin: 0 -6px 0 22px; }
.card .ln .kw { color: #a8700a; } .card .ln .num { color: #1f6fb2; } .card .ln .dot { color: #c9a34a; }
.card .ln.ring { outline: 3px solid var(--gold); background: rgba(233,196,106,.25); }
.card .sign { font-size: 18px; color: #4a4356; margin-top: 6px; }
.card .sign.help { color: #7a5300; font-weight: 700; }

/* the box (spec 5.3) */
.boxwrap { position: relative; border-radius: 12px; background: #0a0c16; border: 2px solid rgba(233,196,106,.55); }
.boxwrap.locked { border-color: rgba(255,255,255,.18); }
.boxwrap .gut { position: absolute; left: 0; top: 0; bottom: 0; width: 40px; }
.boxwrap .hl, .boxwrap textarea, .boxwrap .runv { font-family: var(--mono); font-size: 26px; line-height: 39px; padding: 8px 10px 8px 44px; margin: 0; box-sizing: border-box; width: 100%; white-space: pre; tab-size: 4; letter-spacing: 0; }
.boxwrap .hl { position: absolute; left: 0; top: 0; color: var(--text); pointer-events: none; overflow: hidden; height: 100%; }
.boxwrap textarea { position: relative; display: block; resize: none; background: transparent; border: 0; outline: 0; color: transparent; caret-color: var(--gold); overflow-y: auto; overflow-x: hidden; }
.boxwrap textarea::selection { background: rgba(233,196,106,.35); color: transparent; }
.hl .dot, .runv .dot { color: rgba(233,196,106,.42); }
.hl .bad { text-decoration: underline wavy var(--orange); text-underline-offset: 6px; }
.runv { position: absolute; left: 0; top: 0; overflow: hidden; height: 100%; color: rgba(243,240,234,.62); }
.runv .rl { position: relative; height: 39px; border-radius: 6px; margin: 0 -6px; padding: 0 6px; }
.runv .rl.lit { background: rgba(233,196,106,.28); color: #fff; box-shadow: inset 4px 0 0 var(--gold); }
.pill { position: absolute; right: -22px; top: 5px; z-index: 3; font: 700 17px "Space Grotesk", sans-serif; line-height: 29px; padding: 0 11px; border-radius: 15px; background: var(--gold); color: #1a1526; box-shadow: 0 2px 8px rgba(0,0,0,.55); }
.pill.pulse { animation: pillpulse .35s ease-out; }
@keyframes pillpulse { 0% { transform: scale(1.18); } 100% { transform: scale(1); } }
.loopsvg { position: absolute; left: 0; top: 0; width: 44px; height: 100%; pointer-events: none; }
.loopsvg path { fill: none; stroke: rgba(233,196,106,.55); stroke-width: 3; }
.loopsvg.flash path { stroke: var(--gold); stroke-width: 4.5; }
.under { font-size: 21px; line-height: 1.36; min-height: 58px; margin-top: 0; white-space: pre-line; }
.under.warn { color: #ffd6a5; }
.under.good { color: #c7f0c2; }
.note { font-size: 18px; color: var(--gold); margin-top: 6px; }
/* the Run button floats right so the message under the box wraps round it and then uses the full width */
.runrow { margin-top: 10px; }
.runrow::after { content: ""; display: table; clear: both; }
.runrow .run { float: right; margin: 0 0 6px 16px; }
.sent { font-family: var(--mono); font-size: 18px; line-height: 25px; color: rgba(243,240,234,.45); max-height: 124px; overflow: hidden; border-left: 2px solid rgba(255,255,255,.15); padding-left: 10px; margin-bottom: 10px; position: relative; }
.sent .h { font-family: "Space Grotesk", sans-serif; font-size: 17px; color: var(--dim); }
.sent .sl.lit { color: #fff; background: rgba(233,196,106,.28); }
.sent .list { max-height: 100px; overflow: hidden; }
.sent.faded { opacity: .55; }
.sent.faded .list { max-height: 520px; }

/* idea screens */
.meaning { display: grid; grid-template-columns: auto 1fr; gap: 12px 18px; align-items: start; margin: 4px 0 16px; }
.meaning .code { font-size: 25px; background: #f6f1e4; color: #1d1b26; padding: 2px 10px; border-radius: 8px; white-space: pre; }
.meaning .what { font-size: 21px; line-height: 1.34; }
.claps { display: flex; flex-direction: column; gap: 10px; margin: 6px 0 14px; }
.claps .row { display: flex; align-items: center; gap: 8px; font-size: 28px; font-weight: 700; }
.claps img { width: 52px; height: 52px; }
.claps .or { font-size: 21px; color: var(--dim); font-weight: 500; }
.bracket { display: flex; align-items: stretch; gap: 14px; margin: 6px 0 14px; }
.bracket .lines { background: #f6f1e4; color: #1d1b26; border-radius: 10px; padding: 8px 14px; }
.bracket .lines .ln { font-family: var(--mono); font-size: 26px; line-height: 1.5; white-space: pre; }
.bracket .br { width: 16px; border: 4px solid var(--gold); border-left: 0; border-radius: 0 12px 12px 0; }
.bracket .bl { align-self: center; font-size: 20px; line-height: 1.3; color: var(--gold); font-weight: 600; max-width: 210px; }
.loopfig { position: relative; margin: 0 0 12px; }
.loopfig .forln { position: relative; display: inline-block; font-family: var(--mono); font-size: 26px; line-height: 1.5; background: #f6f1e4; color: #1d1b26; padding: 2px 12px; border-radius: 8px; white-space: pre; }
.loopfig .forln .kw { color: #a8700a; } .loopfig .forln .num { color: #1f6fb2; }
.loopfig .pin { position: relative; }
.tag { position: absolute; left: 50%; top: calc(100% + 12px); font-family: "Space Grotesk", sans-serif; font-size: 19px; line-height: 1.2; color: var(--gold); white-space: nowrap; font-weight: 700; }
.tag::before { content: ""; position: absolute; left: -1px; top: -13px; height: 11px; border-left: 2px solid var(--gold); }
.tag.t2 { top: calc(100% + 72px); transform: translateX(-100%); }
.tag.t2::before { left: auto; right: -1px; top: -73px; height: 71px; }
.loopfig .lab1 { font-size: 19px; color: #e6e2ee; margin: 102px 0 12px; }
.cmp { display: flex; gap: 14px; margin: 4px 0 14px; }
.cmp > div { flex: 1; border-radius: 10px; padding: 8px 10px; }
.cmp .long { background: rgba(255,255,255,.06); font-family: var(--mono); font-size: 13px; line-height: 15px; color: rgba(243,240,234,.4); max-height: 150px; overflow: hidden; }
.cmp .mine { background: #f6f1e4; color: #1d1b26; font-family: var(--mono); font-size: 18px; line-height: 1.5; white-space: pre; }
.cmp .mine .kw { color: #a8700a; } .cmp .mine .num { color: #1f6fb2; }
.cmp .cap { font-family: Caveat, cursive; font-size: 26px; line-height: 1.05; color: var(--gold); display: block; margin-bottom: 6px; white-space: normal; }
.cmp .mine .cap { color: #a8700a; }
.opts { display: flex; flex-direction: column; gap: 10px; margin: 6px 0 10px; }
.opt { text-align: left; font-family: var(--mono); font-size: 24px; padding: 10px 16px; border-radius: 10px; border: 2px solid rgba(255,255,255,.3); background: rgba(255,255,255,.04); color: var(--text); }
.opt.right { border-color: #8fd18a; background: rgba(143,209,138,.18); }
.opt.wrong { border-color: var(--orange); background: rgba(244,162,97,.12); }
.opt .kw { color: var(--gold); font-weight: 700; } .opt .num { color: var(--blue); }
.turnfig { display: flex; align-items: center; gap: 14px; margin: -4px 0 12px 0; }
.turnfig svg { flex: none; }

/* the tour (spotlight, three stops) */
#tour { position: absolute; border-radius: 14px; box-shadow: 0 0 0 4000px rgba(0,0,0,.62); transition: all .35s; z-index: 30; }
#tourtip { position: absolute; z-index: 31; width: 360px; background: #f6f1e4; color: #1d1b26; border-radius: 14px; padding: 16px 18px; font-size: 22px; line-height: 1.35; box-shadow: 0 8px 30px rgba(0,0,0,.6); }
#tourtip .btns { display: flex; justify-content: flex-end; margin-top: 10px; }
#tourtip .btn { color: #1a1526; border-color: rgba(0,0,0,.25); }
#tourtip .btn.pri { color: #1a1526; }

/* the photo frame (8.1) and the film caption bar */
#photo { position: absolute; left: 60px; top: 150px; width: 920px; box-sizing: border-box; background: #fbfaf6; padding: 14px 14px 10px; border-radius: 6px; box-shadow: 0 12px 40px rgba(0,0,0,.6); transform: rotate(-0.6deg); }
#photo img { display: block; width: 100%; height: auto; max-height: 560px; object-fit: cover; }
#photo .credit { font-size: 14px; color: #777; margin-top: 8px; }
#film { position: absolute; left: 0; right: 0; bottom: 60px; display: flex; justify-content: center; }
#film .bar { display: flex; align-items: center; gap: 26px; max-width: 1180px; background: rgba(8,10,20,.82); border: 1px solid rgba(255,255,255,.14); border-radius: 18px; padding: 18px 22px 18px 32px; }
#film .cap { font-size: 32px; line-height: 1.3; font-weight: 500; }
#film .cap b { color: var(--gold); }
#film .btn.next { flex: none; }
#film .bar.solo { padding: 18px 22px; }
#readit { position: absolute; left: 700px; top: 640px; width: 200px; }

/* the strip */
#strip { position: absolute; left: 0; right: 0; top: 852px; height: 44px; display: flex; align-items: center; gap: 16px; padding: 0 30px; box-sizing: border-box; background: rgba(6,7,14,.78); border-top: 1px solid rgba(255,255,255,.1); font-size: 18px; color: var(--dim); }
#strip .pause { font-size: 17px; padding: 5px 16px; border-radius: 18px; border: 1.5px solid rgba(255,255,255,.4); background: transparent; color: var(--text); font-weight: 600; margin-right: 18px; }
#strip .ch.on { color: var(--gold); font-weight: 700; }
#strip .ch.done::before { content: "✓ "; color: #8fd18a; }
#strip .sep { opacity: .45; }

/* pause */
#pausescrim { position: absolute; inset: 0; background: rgba(0,0,0,.72); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 26px; z-index: 50; }
#pausescrim .t { font-size: 54px; font-weight: 700; }


/* her message (6, shot 2): the text is read on the card itself */
#msg { position: absolute; left: 520px; top: 40px; width: 560px; box-sizing: border-box; background: #10131f; border-radius: 30px; padding: 22px 26px 26px; border: 2px solid rgba(255,255,255,.14); box-shadow: 0 20px 60px rgba(0,0,0,.7); }
#msg .from { font-size: 17px; letter-spacing: .1em; color: var(--dim); margin-bottom: 12px; font-weight: 600; }
#msg .bubble { background: #263447; border-radius: 22px 22px 22px 6px; padding: 16px 20px; font-size: 28px; line-height: 1.32; margin-bottom: 18px; }
#msg .pic { display: block; width: 360px; height: 240px; margin: 0 auto; border: 8px solid #fbfaf6; border-bottom-width: 14px; border-radius: 4px; transform: rotate(-2.2deg); box-shadow: 0 8px 24px rgba(0,0,0,.6); }
#msg .noteline { font-family: Caveat, cursive; font-size: 34px; color: #ffd48a; text-align: center; margin-top: 10px; }

/* small pieces of the screens */
#panel p.big { font-size: 26px; line-height: 1.4; }
#panel .fb { min-height: 62px; }
#panel p .code { font-family: var(--mono); background: #f6f1e4; color: #1d1b26; padding: 0 8px; border-radius: 6px; }
#panel p .code .kw { color: #a8700a; } #panel p .code .num { color: #1f6fb2; }
.bracket .bl .x { display: block; font-size: 19px; color: #e6e2ee; font-weight: 500; margin-top: 4px; }
.cmp .mine .ringn { outline: 3px solid var(--gold); border-radius: 4px; padding: 0 2px; }
.cmp .mine .fl { font-family: "Space Grotesk", sans-serif; font-size: 18px; color: #4a4456; }
.bracket .lines .kw, .meaning .code .kw { color: #a8700a; } .bracket .lines .num, .meaning .code .num { color: #1f6fb2; } .bracket .lines .dot, .meaning .code .dot { color: #c9a34a; }
/* chapter 3 and 4 (spec V2 §9, §10) and the close (§11) */
.chip { position: absolute; right: -22px; z-index: 3; transform: translateY(34px); font: 700 16px "Space Grotesk", sans-serif; line-height: 27px; padding: 0 10px; border-radius: 14px; background: #ffe3a0; color: #1a1526; box-shadow: 0 2px 8px rgba(0,0,0,.55); white-space: nowrap; }
.rt { border-collapse: collapse; margin: 6px 0 12px; font-size: 22px; }
.rt th, .rt td { padding: 4px 18px; border-bottom: 1px solid rgba(255,255,255,.18); text-align: center; }
.rt th { color: var(--gold); font-weight: 700; }
.opt.picked { border-color: var(--gold); background: rgba(233,196,106,.16); }
.newword { color: var(--gold); font-weight: 700; }
.btn.stopit { border-color: var(--orange); color: var(--orange); }
.cmp.three .mine { font-size: 16px; padding: 8px; }
.namebox { font: 700 30px "Space Grotesk", sans-serif; width: 100%; max-width: 420px; padding: 10px 16px; border-radius: 10px; border: 2px solid var(--gold); background: #f6f1e4; color: #1d1b26; }
.badges { display: flex; gap: 14px; flex-wrap: wrap; margin: 8px 0 14px; }
.badge { flex: 1 1 180px; border: 2px solid var(--gold); border-radius: 14px; padding: 12px 14px; background: rgba(233,196,106,.1); }
.badge b { display: block; font-size: 22px; color: var(--gold); margin-bottom: 4px; } .badge span { font-size: 18px; }
.recap { display: grid; gap: 10px; margin: 6px 0 12px; }
.recap .rc { display: flex; gap: 12px; align-items: center; } .recap .rc p { margin: 0; }
.rcpic { flex: 0 0 34px; height: 34px; border-radius: 50%; background: var(--gold); opacity: .85; }
#note { position: fixed; right: 16px; bottom: 16px; z-index: 50; max-width: 340px; padding: 12px 16px; border-radius: 12px; background: #1b1d2b; border: 2px solid var(--gold); color: var(--text); font-size: 18px; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="stage">
  <div id="clock" class="hide"><div class="words"></div><div class="digits"></div><div class="bar"><div class="fill"></div></div></div>
  <div id="lambwin" class="hide"><canvas></canvas></div>
  <div id="lambcap" class="hide">The lamb, out in the snow</div>
  <div id="photo" class="hide"><img alt=""><div class="credit"></div></div>
  <div id="msg" class="hide"><div class="from">NUALA · 4:52 pm</div><div class="bubble">Our lamb's gone. It's getting dark. Snow's coming. Please.</div><canvas class="pic"></canvas><div class="noteline">she's only 3 weeks old</div></div>
  <div id="panel" class="live hide"></div>
  <div id="film" class="live hide"></div>
  <button id="readit" class="btn pri live hide">Read it</button>
  <div id="strip" class="live hide"></div>
  <div id="tour" class="hide"></div>
  <div id="tourtip" class="live hide"></div>
  <div id="pausescrim" class="live hide"><div class="t">Paused</div><button class="btn pri">Carry on</button></div>
</div>
<script>window.SearchSceneFit = 'contain';</script>
<script src="search/chars.js"></script>
<script src="search/scene.js"></script>
<script src="search/sound.js"></script>

<script src="hour/strings.js"></script>
<script src="hour/py.js"></script>
<script src="hour/sound2.js"></script>
<script src="hour/pics.js"></script>
<script src="hour/ui.js"></script>
<script src="hour/box.js"></script>
<script src="hour/bridge.js"></script>
<script src="hour/chapters.js"></script>
<script src="hour/free.js"></script>
</body>
</html>
