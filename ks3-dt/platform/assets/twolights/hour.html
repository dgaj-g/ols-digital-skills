<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Same Light</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
@font-face{font-family:"Space Grotesk";src:url(../fonts/space-grotesk.woff2) format("woff2");font-weight:300 700;font-display:swap}
@font-face{font-family:Caveat;src:url(../fonts/caveat-bold.woff2) format("woff2");font-weight:700;font-display:swap}
:root{--sea:#0B1B33;--sea2:#10264a;--panel:#132a4d;--line:#2a4670;--ink:#eef3fb;--mute:#9fb2cf;--beam:#F2C14E;--red:#ff6b6b;--paper:#f6f1e6;--good:#7fe0a8;--code:#08142a}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--sea);color:var(--ink);font-family:"Space Grotesk",system-ui,sans-serif;overflow:hidden}
button{font:inherit;cursor:pointer}
.btn{font-weight:700;font-size:17px;background:var(--beam);color:#1b1405;border:0;border-radius:10px;padding:8px 18px}
.btn[disabled]{opacity:.4;cursor:default}
.ghost{font-size:14px;background:none;color:var(--mute);border:1px solid var(--line);border-radius:999px;padding:5px 12px}
.ghost img{height:16px;vertical-align:-3px;margin-right:4px}
#app{display:grid;grid-template-rows:42px auto auto 1fr;height:100vh}
#app.hide{display:none}
#strip{display:flex;align-items:center;gap:6px;padding:0 10px;border-bottom:1px solid var(--line);background:var(--sea2);overflow:hidden}
#pills{display:flex;gap:2px;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none}
#pills::-webkit-scrollbar{display:none}
.pill{font-size:13px;padding:4px 8px;border-radius:999px;color:var(--mute);border:1px solid transparent;white-space:nowrap}
.pill.on{color:var(--beam);border-color:var(--beam)}
.pill.done{color:var(--good)}
#coins{font-size:14px;font-weight:600;white-space:nowrap}
#coins img{height:18px;vertical-align:-4px;margin-right:3px}
#banner{padding:8px 14px;font-size:18px;font-weight:600;background:var(--panel);border-bottom:1px solid var(--line)}
#steps{padding:8px 14px 10px;border-bottom:1px solid var(--line)}
#stepstrip{display:flex;gap:8px}
.step{flex:1;text-align:center;padding:6px 4px;border-radius:8px;background:var(--sea2);color:var(--mute);font-weight:600;font-size:15px}
.step.on{background:var(--beam);color:#1b1405}
.step.done{color:var(--good)}
#job{font-size:22px;font-weight:700;margin-top:8px;min-height:30px;line-height:1.25}
#main{display:grid;grid-template-columns:46fr 54fr;gap:12px;padding:10px 12px 12px;min-height:0}
#left,#right{display:flex;flex-direction:column;min-height:0;gap:6px}
.head{font-size:12px;letter-spacing:.08em;color:var(--mute);font-weight:700}
#code{position:relative;display:grid;grid-template-columns:36px 1fr;background:var(--code);border:1px solid var(--line);border-radius:10px;overflow:hidden;flex:1;min-height:170px}
#gutter,#view,#ed{font:14px/21px ui-monospace,Menlo,Consolas,monospace;padding:8px 0;margin:0}
#gutter{color:var(--mute);text-align:right;padding-right:6px;border-right:1px solid var(--line);user-select:none;overflow:hidden}
#gutter div{height:21px}
#gutter div.b{color:var(--red);font-weight:700}
#view{padding-left:10px;white-space:pre;overflow:auto}
#view .ln{height:21px;cursor:pointer;border-radius:4px;margin-right:8px;padding-left:4px}
#view .ln:hover{background:rgba(242,193,78,.12)}
#view .ln.mine{outline:2px solid var(--beam)}
#view .ln.theirs{outline:2px dashed var(--mute)}
#view .ln.right{background:rgba(255,107,107,.25)}
#view .ln.hot{background:rgba(242,193,78,.28)}
#view .ln.ok{background:rgba(127,224,168,.25)}
#view.quiet .ln{cursor:default}#view.quiet .ln:hover{background:none}
#ed{grid-column:2;background:none;color:var(--ink);border:0;outline:none;resize:none;padding-left:14px;white-space:pre;tab-size:4;overflow:auto}
.hide{display:none!important}
#runrow{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
#means{font-size:15px;color:var(--beam);line-height:1.3}
#conwrap{background:var(--code);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-height:88px;max-height:150px;overflow:auto;font:13px/19px ui-monospace,Menlo,Consolas,monospace;white-space:pre-wrap}
#con .r{color:var(--red)}
#baywrap{position:relative;border-radius:12px;overflow:hidden;background:var(--sea2);height:clamp(170px,27vh,260px);flex:none}
#bay{display:block;width:100%;height:100%}
.paper{position:absolute;left:10px;right:10px;top:10px;background:var(--paper);color:#2b2217;border-radius:12px;padding:12px 14px;font-size:16px;line-height:1.35;box-shadow:0 8px 24px rgba(0,0,0,.4);display:none;z-index:3}
.paper.show{display:block}
#look{top:auto;bottom:10px}
#rocks{top:auto;bottom:10px;z-index:5}
.paper .row{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.paper .ghost{color:#5b4a2e;border-color:#c9b995}
.paper .hand{font-family:Caveat,cursive;font-size:24px;font-weight:700;line-height:1.1}
.paper .dim{color:#7a6a4e}
.paper b.top{display:block}
#helprow{display:flex;justify-content:space-between;align-items:center}
#cards{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.fcard{background:var(--panel);border:2px solid var(--line);border-radius:10px;padding:8px 10px;min-height:66px}
.fcard b{display:block;font-size:16px;letter-spacing:.06em}
.fcard span{font-size:13px;color:var(--mute)}
.fcard.pick{cursor:pointer;border-color:var(--beam)}
.fcard.pick:hover{background:rgba(242,193,78,.12)}
.fcard.lit{border-color:var(--good);background:rgba(127,224,168,.15)}
.fcard.no{border-color:var(--red)}
#crew{font-size:15px}#partner{font-size:14px;color:var(--mute);min-height:18px}
@media (max-width:979px){#main{grid-template-columns:1fr;grid-auto-rows:max-content;overflow:auto}#left,#right{min-height:auto}#code{min-height:230px;flex:none;height:230px}#baywrap{height:clamp(190px,24vh,240px)}#job{font-size:20px}#pills{-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 28px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 28px),transparent)}}
/* full pages */
#page{position:fixed;inset:0;background:var(--sea);display:none;overflow:auto;z-index:5}
#page.show{display:block}
.pg{max-width:720px;margin:0 auto;padding:36px 24px 40px}
.pg h1{font-size:30px;margin:0 0 14px;line-height:1.15}
.pg .line{font-size:20px;line-height:1.4;margin:8px 0}
.pg .sub{font-size:17px;color:var(--mute);line-height:1.4;margin:6px 0}
.pg img.big{height:120px;display:block;margin:0 0 12px}
.pg .row{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap;align-items:center}
.prog{background:var(--code);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:15px/22px ui-monospace,Menlo,Consolas,monospace;white-space:pre;margin:14px 0;display:grid;grid-template-columns:28px 1fr;column-gap:10px}
.prog .n{color:var(--mute);text-align:right}
.prog .ln{border-radius:4px;padding-left:4px}
.prog.ask .ln{cursor:pointer}.prog.ask .ln:hover{background:rgba(242,193,78,.12)}
.prog .ln.hot{background:rgba(242,193,78,.28)}.prog .ln.right{background:rgba(255,107,107,.25)}.prog .ln.ok{background:rgba(127,224,168,.25)}
.con{background:var(--code);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font:13px/19px ui-monospace,Menlo,Consolas,monospace;white-space:pre-wrap;min-height:60px;margin:8px 0}
.con .r{color:var(--red)}
.opts{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
.opt{font:600 16px ui-monospace,Menlo,monospace;background:var(--panel);color:var(--ink);border:2px solid var(--line);border-radius:10px;padding:8px 16px}
.opt.ok{border-color:var(--good)}.opt.no{border-color:var(--red)}
.verdict{font-size:19px;margin-top:12px;color:var(--beam);min-height:26px}
.radar{width:120px;height:120px;border-radius:50%;border:2px solid var(--line);position:relative;margin:10px 0 18px;overflow:hidden}
.radar:before{content:"";position:absolute;inset:0;background:conic-gradient(from 0deg,rgba(242,193,78,.5),transparent 70%);animation:spin 1.6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.cardsrow{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
.badge{display:inline-block;background:var(--panel);border:1px solid var(--beam);border-radius:999px;padding:4px 12px;margin:4px 6px 0 0;font-size:15px}
.xlist{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.xlist button{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px;font-size:15px}
.xlist button.done{border-color:var(--good)}
textarea.xed{width:100%;height:200px;background:var(--code);color:var(--ink);border:1px solid var(--line);border-radius:10px;font:15px/22px ui-monospace,Menlo,monospace;padding:10px;resize:vertical;tab-size:4}
.w .step{display:inline-block;background:var(--beam);color:#1b1405;border-radius:8px;padding:4px 10px;font-weight:700;font-size:16px;margin:6px 0}
.w .cap{font-size:20px;line-height:1.35;min-height:28px}
/* overlays */
#card{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(5,12,24,.6);z-index:6}
#card.show{display:flex}
#card .big{background:var(--paper);color:#2b2217;border-radius:16px;padding:22px 28px;font-size:26px;font-weight:700;max-width:560px;text-align:center;line-height:1.3;box-shadow:0 12px 40px rgba(0,0,0,.5)}
#card .big small{display:block;font-size:19px;font-weight:500;margin-top:8px;color:#5b4a2e}
#tour{position:fixed;inset:0;display:none;z-index:7;pointer-events:none}
#tour.show{display:block}
#ring{position:absolute;border:3px solid var(--beam);border-radius:12px;box-shadow:0 0 0 2000px rgba(5,12,24,.45)}
#tcard{position:absolute;width:300px;background:var(--paper);color:#2b2217;border-radius:12px;padding:14px 16px;font-size:17px;line-height:1.35;pointer-events:auto;box-shadow:0 8px 24px rgba(0,0,0,.4)}
#tcard .row{display:flex;gap:8px;margin-top:10px}
#curtain{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(5,12,24,.82);z-index:8;flex-direction:column;gap:14px;text-align:center;padding:20px}
#curtain.show{display:flex}
#curtain .line{font-size:24px;font-weight:600}
#linkbar{position:fixed;left:0;right:0;top:0;background:var(--red);color:#1b0a0a;font-weight:600;font-size:15px;padding:6px 14px;display:none;z-index:9;text-align:center}
#linkbar.show{display:block}
body.linkon{padding-top:34px}
#linkbar.ok{background:var(--good)}
#toast{position:fixed;right:16px;top:50px;max-width:min(420px,calc(100vw - 32px));pointer-events:none;background:var(--paper);color:#2b2217;border-radius:12px;padding:10px 18px;font-size:18px;font-weight:600;display:none;z-index:9;box-shadow:0 8px 24px rgba(0,0,0,.4)}
#toast.show{display:block}
#helpgo{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end}
#helpsign{font-size:15px;font-weight:700;color:#ffd166}
#helpbtn.ghost{font-size:17px;font-weight:800;color:#2b1600;background:linear-gradient(135deg,#ffd166,#ff8c42);border:2px solid #fff3d6;padding:7px 18px;cursor:pointer;animation:helpglow 2.4s ease-in-out infinite}
#helpbtn.ghost img{height:22px;vertical-align:-5px;animation:spin 8s linear infinite}
#helpbtn.urgent{animation:helpglow .8s ease-in-out infinite;background:linear-gradient(135deg,#ff8c42,#ff3d6e);color:#fff}
#helpbtn.demo{pointer-events:none}
@keyframes helpglow{0%,100%{box-shadow:0 0 0 0 rgba(255,140,66,.65);transform:scale(1)}50%{box-shadow:0 0 0 12px rgba(255,140,66,0);transform:scale(1.07)}}
#sigbtn.ghost{font-size:15px;font-weight:700;color:#fff;background:#3a86ff;border-color:#9cc3ff;cursor:pointer}
#sigbtn.ghost:disabled{background:none;color:var(--mute);border-color:var(--line);cursor:default}
#helpbtn.hide,#sigbtn.hide,#sig.hide{display:none}
#sig{margin-top:8px;display:flex;align-items:center;gap:12px;font-size:18px;font-weight:700;color:#2b1600;background:#ffd166;border-radius:12px;padding:7px 14px;animation:sigin .35s ease-out}
#sig button{font-size:15px;font-weight:800;background:#2b1600;color:#ffd166;border:0;border-radius:999px;padding:5px 16px;cursor:pointer}
@keyframes sigin{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){#helpbtn.ghost,#helpbtn.ghost img,#sig{animation:none}}
</style></head><body>
<div id="app" class="hide">
  <div id="strip"><div id="pills"></div><span id="coins"></span><button id="latebtn" class="ghost"></button><button id="pausebtn" class="ghost"></button></div>
  <div id="banner"></div>
  <div id="steps"><div id="stepstrip"></div><div id="job"></div><div id="sig" class="hide" role="status" aria-live="polite"></div></div>
  <div id="main">
    <div id="left">
      <div class="head" id="headcode"></div>
      <div id="code"><div id="gutter"></div><div id="view"></div><textarea id="ed" class="hide" spellcheck="false" autocomplete="off" autocapitalize="off"></textarea></div>
      <div id="runrow"><button id="run" class="btn"></button><span id="means"></span></div>
      <div class="head" id="headcon"></div>
      <div id="conwrap"><div id="con"></div></div>
    </div>
    <div id="right">
      <div id="baywrap"><canvas id="bay"></canvas><div id="help" class="paper"></div><div id="look" class="paper"></div><div id="late" class="paper"></div><div id="rocks" class="paper"></div></div>
      <div id="helprow"><span id="crew"></span><span id="helpgo"><span id="helpsign"></span><button id="helpbtn" class="ghost"></button><button id="sigbtn" class="ghost hide"></button></span></div>
      <div id="cards"></div>
      <div id="partner"></div>
    </div>
  </div>
</div>
<div id="page"></div>
<div id="card"><div class="big"></div></div>
<div id="tour"><div id="ring"></div><div id="tcard"></div></div>
<div id="curtain"></div>
<div id="linkbar"></div>
<div id="toast"></div>
<script src="../../vendor/firebase-app-compat.js"></script><script src="../../vendor/firebase-database-compat.js"></script><script src="../../live-config.js"></script>
<script src="pyrun.js"></script><script src="programs.js"></script><script src="judge.js"></script>
<script src="clock.js"></script><script src="art.js"></script><script src="sound.js"></script>
<script src="strings.js"></script><script src="engine.js"></script><script src="live.js"></script><script src="ui.js"></script>
</body></html>
