<script>

  return '<div class="guess">' + esc(f(S.itThinks, { n: m[r.c].n })) + '</div>' + barHtml(r.pc) + '<p class="say">' + f(S.howSure, { pc: r.pc }) + '</p>';
}

function ghosts(m) { return card(S.learned, '<div class="ghosts">' + m.map(function (c) { return c.ex.length ? '<figure>' + pv(E.mean(c.ex.map(vecOf)), 'big') + '<span>' + esc(f(S.idea, { a: c.a || c.n })) + '</span></figure>' : ''; }).join('') + '</div>'); }
function th(t, cls, label) { var ok = t.w === t.g; return '<span class="th ' + (ok ? '' : 'x ') + (cls || '') + '">' + pv(vecOf(t.s)) + '<b>' + esc(label) + '</b><i>' + (ok ? '✓' : '✗') + '</i></span>'; }

/* ---------- three step shapes used all lesson: collect, test, quiz ---------- */
function collect(o) {   // o: chip, m, k, need, job, help, keep, zone, mine, next
  var c = o.m[o.k], ok = inkOK() && inZone(o.zone), known = o.m.filter(function (q) { return q.ex.length; });
  return { chip: o.chip, job: f(o.job, { a: c.a, n: c.n, i: c.ex.length + 1, of: o.need }), help: f(o.help, { a: c.a, n: c.n, of: o.need }), pad: { zone: o.zone }, draw: o.draw || c.n,
    warn: strokes.length && !inZone(o.zone) ? S.bad.out : '',

    acts: { keep: function () { c.ex.push(take()); clear(); snd('flip'); if (c.ex.length >= o.need && o.next) o.next(); }, rub: clear } };
}
function testStep(o) {  // o: chip, m, want, list, job, help, fin, nextLabel, onNext, after(t) -> html, zone, draw, extra
  var m = o.m;
  if (!st.shown) {

    return { chip: o.chip, job: o.job, help: o.help, pad: { zone: o.zone }, draw: o.draw, warn: strokes.length && !inZone(o.zone) ? S.bad.out : '',
      btns: btn('fin', o.fin, !ok, 1) + btn('rub', S.rub, 0, 0, 'ghost'), side: guessCard(m) + (o.extra || ''),
      acts: { fin: function () { var r = now(m), t = { w: o.want, g: r.c, pc: r.pc, s: take() }; o.list.push(t); st.shown = 1; snd(t.w === t.g ? 'ding' : 'thud'); }, rub: clear } };
  }
  var t = o.list[o.list.length - 1];
  if (!strokes.length) strokes = t.s;
  return { chip: o.chip, job: o.job, help: o.help, pad: { zone: o.zone, lock: 1 }, btns: btn('nx', o.nextLabel, 0, 1),
    side: card(S.thinks, o.after ? o.after(t) : '<div class="guess">' + esc(f(S.said, { g: m[t.g].n })) + '</div>' + barHtml(t.pc) + '<p class="say">' + f(S.howSure, { pc: t.pc }) + '</p><p class="say verdict ' + (t.w === t.g ? 'ok">' + S.right : 'no">' + esc(f(S.wrong, { a: m[t.w].a }))) + '</p>') + (o.extra || ''),
    acts: { nx: function () { st.shown = 0; clear(); o.onNext(); } } };
}
function strangerStep(o) {  // the stranger draws by rule; the result is recorded when the drawing ends
  if (!st.shown && !play) {
    play = 1;
    var dr = P(o.seed)[o.kind](o.style).map(function (s) { return s.map(function (p) { return [Math.round(p[0]), Math.round(p[1])]; }); });
    setTimeout(function () { animate(dr, function () { strokes = dr; var r = now(o.m), t = { w: o.want, g: r.c, pc: r.pc, s: dr }; o.list.push(t); st.shown = 1; play = 0; snd(t.w === t.g ? 'ding' : 'thud'); save(); render(); }); }, 50);
  }
  if (!st.shown) return { chip: o.chip, job: o.job, help: o.help, pad: { lock: 1 }, btns: btn('nx', o.nextLabel, 1, 0), side: guessCard(o.m), acts: {} };
  return testStep(o);
}
function quiz(items, q, str, chip, doneLabel, done) {
  var it = items[q.i];
  if (!q.ord || q.at !== q.i) { q.ord = shuffle([0, 1, 2, 3]); q.at = q.i; }
  var h = '<div class="kicker">' + f(S.quiz.count, { i: q.i + 1, of: items.length }) + '</div><h2 class="stem">' + esc(it.stem).replace(/`([^`]+)`/g, '<code>$1</code>') + '</h2><div class="opts">' + q.ord.map(function (o) {
    var cls = q.pick < 0 ? '' : o === 0 ? 'good' : o === q.pick ? 'bad' : 'off';
    return '<button class="opt ' + cls + '" data-act="pick" data-arg="' + o + '"' + (q.pick >= 0 ? ' disabled' : '') + (o === 0 && q.pick < 0 ? ' data-want="1"' : '') + '>' + esc(it.options[o]) + '</button>';
  }).join('') + '</div>';
  if (q.pick >= 0) h += '<p class="say verdict ' + (q.pick === 0 ? 'ok">' + S.quiz.right : 'no">' + S.quiz.wrong) + '</p><div class="row">' + btn('nx', q.i < items.length - 1 ? S.quiz.nextQ : doneLabel, 0, 1) + '</div>';
  return { chip: chip, job: str.job, help: str.help, stage: h, acts: {
    pick: function (a) { if (q.pick >= 0) return; q.pick = +a; q.ans = q.ans || []; q.ans[q.i] = q.pick; if (q.pick === 0) { q.right++; snd('ding'); } else snd('thud'); },
    nx: function () { if (q.i < items.length - 1) { q.i++; q.pick = -1; } else { q.done = 1; done(); } } } };
