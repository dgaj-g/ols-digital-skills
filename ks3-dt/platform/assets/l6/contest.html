<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Inside the Machine · The contest</title>
<!-- J1 L6 V2 THE CONTEST (Version 96). Built from J1_L6_REDESIGN/prototype/contest.html + contest.css; the help layer is the
     platform's own (see/hour.html). Every word comes from cstrings.js; every rule from contest.js. -->
<link rel="preload" href="../fonts/space-grotesk.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="../fonts/caveat-bold.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="../fonts/bebas-neue.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="../img/l6/mem.jpg" as="image">
<link rel="preload" href="../img/l6/drive.jpg" as="image">
<link rel="preload" href="../img/l6/cpu.jpg" as="image">
<link rel="preload" href="../img/l6/gpu.jpg" as="image">
<link rel="preload" href="../img/l6/fan.jpg" as="image">
<link rel="preload" href="../img/l6/psu.jpg" as="image">
<link rel="preload" href="../img/l6/board.jpg" as="image">
<style>
@font-face{font-family:"Space Grotesk";src:url(../fonts/space-grotesk.woff2) format("woff2");font-weight:300 700;font-display:block}
@font-face{font-family:"Caveat";src:url(../fonts/caveat-bold.woff2) format("woff2");font-weight:700;font-display:block}
@font-face{font-family:"Bebas Neue";src:url(../fonts/bebas-neue.woff2) format("woff2");font-weight:400;font-display:block}
:root{--bg:#0a1c21;--panel:#10292f;--panel2:#153238;--ink:#eaf2f2;--mute:#9bb3b6;--gold:#e4b824;--line:#24474f;--me:#8fb4ff;--them:#ffb3c7;--paper:#f6f1e6;--case:#2b3338;--slot:#0d1417;--ok:#5fd48a;--bad:#ff8c7a;--amber:#F2B544;--green:#3DD6A3;--chalk:#F4F1EA;--dim:#A7B4B8}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"Space Grotesk",system-ui,sans-serif;overflow:hidden;font-size:17px;line-height:1.35}
button{font:inherit;cursor:pointer}
#app{height:100%;display:grid;grid-template-rows:44px minmax(0,1fr) auto}
/* top bar: where am I */
#top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 16px;background:var(--panel);border-bottom:1px solid var(--line);font-size:15px;white-space:nowrap;overflow:hidden}
#top .where{overflow:hidden;text-overflow:ellipsis}
#top .where b{color:var(--gold);font-weight:600}
#top .you{color:var(--mute);display:flex;align-items:center;gap:10px}
#top .you b{color:var(--ink);font-weight:600}
/* main */
#main{display:grid;grid-template-columns:58fr 42fr;gap:14px;padding:14px;min-height:0}
#card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px 24px;overflow:auto;min-height:0;position:relative}
#side{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:18px 20px;overflow:auto;min-height:0}
/* bottom bar: what do I do now */
/* type */
.kicker{font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:var(--gold);margin:0 0 6px}
h1.title{font-family:"Bebas Neue","Space Grotesk",sans-serif;font-size:52px;letter-spacing:.02em;margin:0 0 14px;line-height:1;color:var(--ink)}
h2.ask{font-size:26px;margin:0 0 14px;font-weight:600;line-height:1.25}
.lines{margin:0 0 18px;padding:0;list-style:none;font-size:19px}
.lines li{padding:5px 0 5px 20px;position:relative}
.lines li::before{content:"";position:absolute;left:0;top:14px;width:9px;height:9px;border-radius:50%;background:var(--gold)}
.mute{color:var(--mute)}
.btn{background:var(--gold);color:#1a1a1a;border:0;border-radius:11px;padding:13px 24px;font-size:19px;font-weight:600}
.btn:disabled{opacity:.45;cursor:default}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.small{padding:8px 14px;font-size:15px}
.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:18px;align-items:center}
/* the patient */
.patient{display:grid;grid-template-columns:120px 1fr;gap:16px;align-items:center;margin:0 0 14px}
.patient .face{width:120px;height:120px;border-radius:12px;background:var(--case);overflow:hidden;display:flex;align-items:center;justify-content:center}
.patient .face svg{width:100%;height:100%}
.patient .who{font-size:15px;color:var(--mute);margin:0 0 4px}
.patient .says{font-family:Caveat,cursive;font-size:30px;line-height:1.1;background:var(--paper);color:#1f3a44;border-radius:12px;padding:12px 16px;position:relative}
.patient .says::before{content:"";position:absolute;left:-10px;top:26px;border:10px solid transparent;border-right-color:var(--paper);border-left:0}
/* the tray */
.trayhead{font-size:15px;color:var(--mute);margin:0 0 8px}
.tray{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.tile{position:relative;border:3px solid var(--line);border-radius:12px;background:var(--slot);padding:0;overflow:hidden;color:var(--ink);text-align:left;display:flex;flex-direction:column}
.tile img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover}
.tile .lab{display:block;flex:1;padding:5px 7px;font-size:14px;line-height:1.15;font-weight:600;background:var(--case)}
.tile:disabled{cursor:default}
.tile.mine{border-color:var(--me);box-shadow:0 0 0 2px rgba(143,180,255,.35)}
.tile.theirs{border-color:var(--them);box-shadow:0 0 0 2px rgba(255,179,199,.35)}
.tile.mine.theirs{border-color:var(--me);box-shadow:0 0 0 3px var(--them)}
.tile.right{border-color:var(--gold)}
.tile .tick{position:absolute;top:5px;right:5px;width:24px;height:24px;border-radius:50%;background:var(--gold);color:#1a1a1a;font-weight:700;display:flex;align-items:center;justify-content:center;font-size:19px}
.tile .tag{position:absolute;left:5px;top:5px;display:flex;gap:3px;flex-wrap:wrap;max-width:calc(100% - 34px)}
.tag span{font-size:11px;font-weight:700;padding:2px 6px;border-radius:999px;color:#10292f}
.tag .me{background:var(--me)}.tag .them{background:var(--them)}
.tile.dim{opacity:.55}
/* options */
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:12px;text-align:left;border:3px solid var(--line);background:var(--slot);color:var(--ink);border-radius:12px;padding:12px 14px;font-size:19px;position:relative}
.opt .letter{width:34px;height:34px;border-radius:50%;background:var(--case);display:flex;align-items:center;justify-content:center;font-weight:700;flex:none}
.opt.mine{border-color:var(--me)}.opt.theirs{border-color:var(--them)}.opt.mine.theirs{border-color:var(--me);box-shadow:0 0 0 3px var(--them)}
.opt.right{border-color:var(--gold)}.opt.right .letter{background:var(--gold);color:#1a1a1a}
.opt:disabled{cursor:default}
.opt .tag{margin-left:auto}
/* order */
.order{display:grid;gap:8px;margin:0 0 14px}
.block{display:grid;grid-template-columns:40px 1fr auto;gap:10px;align-items:center;border:3px solid var(--line);background:var(--slot);border-radius:12px;padding:8px 10px 8px 12px;font-size:18px}
.block .n{width:34px;height:34px;border-radius:50%;background:var(--case);display:flex;align-items:center;justify-content:center;font-weight:700}
.block .mv{display:flex;gap:6px}
.block.right{border-color:var(--gold)}.block.right .n{background:var(--gold);color:#1a1a1a}
.block.wrongpos{border-color:var(--bad)}
/* reveal */
.verdict{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
.chip{border-radius:12px;padding:8px 12px;border:2px solid var(--line);background:var(--slot)}
.chip .lab{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}
.chip .val{font-size:17px;font-weight:600;margin-top:1px}
.chip.me{border-color:var(--me)}.chip.them{border-color:var(--them)}
.chip .ok{color:var(--ok)}.chip .no{color:var(--bad)}
.answer{background:rgba(228,184,36,.12);border:1px solid var(--gold);border-radius:12px;padding:10px 14px;margin:0 0 10px;font-size:18px}
.answer .why{margin:4px 0 0;font-size:16px;color:var(--ink)}
.answer b{color:var(--gold)}
.why{font-size:18px;color:var(--ink);margin:0 0 6px}
.note{font-size:16px;color:var(--mute);margin:6px 0}
.waitline{margin:14px 0 0;font-size:19px;padding:12px 14px;border-radius:12px;background:var(--panel2);border:1px solid var(--line)}
.waitline .pulse{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--me);margin-right:10px;animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{opacity:.3}50%{opacity:1}}
/* scoreboard */
#side h3{margin:0 0 12px;font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:var(--gold)}
.srow{display:grid;grid-template-columns:40px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.srow:first-of-type{border-top:0}
.disc{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:17px;color:#10292f;background:var(--mute)}
.disc.A{background:#ffb347}.disc.B{background:#ffe680}.disc.C{background:#9be37a}.disc.Z{background:var(--them)}
.srow .nm{font-size:18px;font-weight:600}
.srow .nm small{font-weight:400;color:var(--mute);margin-left:6px}
.srow .st{font-size:14px;color:var(--mute);margin-top:2px}
.srow .pts{font-family:"Bebas Neue","Space Grotesk",sans-serif;font-size:40px;line-height:1;color:var(--gold);min-width:36px;text-align:right}
.dots{display:flex;gap:8px;margin:12px 0 0;flex-wrap:wrap}
.dots .grp{display:flex;gap:3px;padding:4px 6px;border-radius:8px;background:var(--panel)}
.dots .grp.cur{outline:1px solid var(--gold)}
.dots i{display:block;width:10px;height:10px;border-radius:50%;background:var(--line)}
.dots i.r{background:var(--gold)}.dots i.w{background:var(--bad)}.dots i.a{background:var(--mute)}.dots i.q{box-shadow:0 0 0 2px var(--me) inset;background:transparent}
.sidenote{font-size:14px;color:var(--mute);margin:12px 0 0}
.legend{display:flex;gap:12px;font-size:13px;color:var(--mute);margin-top:8px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px;vertical-align:middle}
/* result */
.headline{font-size:23px;font-weight:600;margin:0 0 8px;line-height:1.25}
/* film */
#film{background:var(--slot);border:1px solid var(--line);border-radius:14px;padding:16px;margin:0 0 12px}
.stage{position:relative;height:230px;display:grid;grid-template-columns:120px 1fr 1fr;gap:16px;align-items:stretch}
.stage .bface{width:120px;height:120px;border-radius:12px;background:var(--case);overflow:hidden;align-self:center}
.stage .bface svg{width:100%;height:100%}
.stage .think{position:absolute;left:10px;top:4px;background:var(--paper);color:#1f3a44;font-family:Caveat,cursive;font-size:26px;padding:4px 12px;border-radius:14px;opacity:0;transition:opacity .4s}
.box{border:3px solid var(--line);border-radius:14px;padding:10px;display:flex;flex-direction:column;background:var(--panel);transition:border-color .4s,box-shadow .4s;position:relative}
.box .bl{font-family:"Bebas Neue","Space Grotesk",sans-serif;font-size:30px;letter-spacing:.05em;color:var(--mute)}
.box .shelf{flex:1;display:flex;flex-direction:column;gap:6px;justify-content:center}
.box.lit{border-color:var(--gold);box-shadow:0 0 0 3px rgba(228,184,36,.25)}
.box.lit .bl{color:var(--gold)}
.slip{position:absolute;left:0;top:0;width:150px;padding:10px 12px;background:var(--paper);color:#1f3a44;border-radius:8px;font-family:Caveat,cursive;font-size:27px;font-weight:700;text-align:center;transition:transform .9s cubic-bezier(.4,0,.2,1),opacity .4s;opacity:0;box-shadow:0 4px 14px rgba(0,0,0,.35);z-index:2}
.qslip{background:var(--paper);color:#1f3a44;border-radius:6px;font-family:Caveat,cursive;font-size:20px;padding:4px 8px;opacity:0;transition:opacity .4s}
.b5 .qslip,.b6 .qslip{opacity:.85}
.loopdot{position:absolute;width:14px;height:14px;border-radius:50%;background:var(--gold);opacity:0;top:50%}
.b5 .loopdot,.b6 .loopdot{opacity:1;animation:shuttle 1.6s infinite alternate ease-in-out}
.b6 .loopdot{animation-duration:.5s}
@keyframes shuttle{from{left:var(--x0)}to{left:var(--x1)}}
.caption{font-size:21px;min-height:58px;padding:10px 4px 0;line-height:1.3}
.caption b{color:var(--gold)}
.beats{display:flex;gap:6px;margin:6px 0 0}
.beats i{width:22px;height:6px;border-radius:3px;background:var(--line)}
.beats i.on{background:var(--gold)}
/* narrow: one column, scoreboard strip above the card */
@media (max-width:1000px){
  #main{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr)}
  #side{order:-1;padding:10px 14px}
  #side h3{display:none}
  .srow{padding:6px 0}
  .srow .pts{font-size:30px}
  .dots{display:none}
  .sidenote,.legend{display:none}
  h1.title{font-size:42px}
  .patient{grid-template-columns:100px 1fr}
  .patient .face{width:100px;height:100px}
  .patient .says{font-size:26px}
  .stage{grid-template-columns:90px 1fr 1fr;height:210px}
  .stage .bface{width:90px;height:90px}
}
@media (max-width:600px){
  .tray{grid-template-columns:repeat(4,1fr)}
}
/* short screens (school 1366x768): tighter card so every reveal fits without scrolling */
@media (max-height:800px){
  #card{padding:16px 20px}
  h2.ask{font-size:24px;margin:0 0 10px}
  .opts{gap:8px}
  .opt{padding:9px 14px;font-size:18px}
  .verdict{margin:10px 0}
  .actions{margin-top:12px}
  .patient{margin:0 0 10px}
  .answer{padding:8px 12px;font-size:17px;margin:0 0 8px}
  .answer .why{font-size:15px}
}
.waitline.quiet{color:var(--mute);background:transparent;border-style:dashed}
/* the platform's help layer (see/hour.html), copied: job line + green "Stuck? Show me" + the help strip at the top */
.job{background:#22332f;border-left:6px solid var(--amber);padding:8px 24px;font-size:20px;font-weight:800;display:flex;align-items:center;justify-content:space-between;gap:18px;min-height:64px}
.job #job b{color:var(--amber);font-weight:800}
#helpBtn{background:var(--green);color:#06231b;font-size:18px;padding:10px 20px;white-space:nowrap;flex:0 0 auto;border:0;border-radius:11px;font-weight:800}
#helpBtn.nudge{animation:nudge .7s ease-in-out infinite alternate}
@keyframes nudge{to{transform:scale(1.09);box-shadow:0 0 0 10px rgba(61,214,163,.28)}}
#help{position:fixed;top:0;left:0;right:0;background:#0e3b31;border-bottom:4px solid var(--green);display:flex;align-items:center;justify-content:space-between;gap:20px;padding:10px 24px;z-index:5}
#help[hidden]{display:none}
#help .kicker{color:var(--chalk);margin:0 0 6px;font-size:17px;font-weight:800;text-transform:none;letter-spacing:0}
#helpText{margin:0;padding:0;list-style:none;display:flex;gap:8px 26px;flex-wrap:wrap;counter-reset:st;font-size:19px;font-weight:800}
#helpText li{counter-increment:st}
#helpText li::before{content:counter(st);display:inline-block;width:26px;height:26px;line-height:26px;text-align:center;border-radius:99px;background:var(--green);color:#06231b;margin-right:8px;font-size:16px;font-weight:900}
#helpStuck{margin:6px 0 0;color:var(--dim);font-size:15px;font-weight:700}
#helpClose{flex:0 0 auto;background:var(--green);color:#06231b;border:0;border-radius:11px;padding:10px 20px;font-size:18px;font-weight:800}
.spot{outline:4px solid var(--green)!important;outline-offset:5px;border-radius:14px;animation:spot .8s ease-in-out infinite alternate}
@keyframes spot{to{outline-offset:10px}}
#tag{position:fixed;z-index:6;display:none;background:var(--green);color:#06231b;font-weight:900;font-size:16px;padding:3px 13px;border-radius:99px;pointer-events:none;white-space:nowrap}
@media (prefers-reduced-motion: reduce){.spot,#helpBtn.nudge{animation:none}}
/* contest additions */
.patient p.kicker{text-transform:none;letter-spacing:0;font-size:15px;color:var(--mute);margin:0 0 4px}
.verdict .chip{font-size:18px;font-weight:600}
.verdict .chip b{color:var(--mute);font-weight:600}
.block{cursor:default}
.block:focus{outline:3px solid var(--me);outline-offset:2px}
#side .state{margin:12px 0 0;font-size:16px;padding:10px 12px;border-radius:10px;background:var(--panel);border:1px solid var(--line)}
#side .state:empty{display:none}
#side .actions{margin-top:10px}
.reveals{margin:6px 0 0}
@media (max-height:800px){
  .stage{height:190px}
  h1.title{font-size:44px;margin:0 0 10px}
  .lines{font-size:18px;margin:0 0 12px}
  .lines li{padding:4px 0 4px 20px}
  #film{padding:12px;margin:0 0 8px}
  .caption{min-height:52px;font-size:20px}
  .why{font-size:17px}
}
@media (max-width:1000px){
  .job{font-size:17px;padding:8px 14px}
  #helpBtn{font-size:16px;padding:9px 14px}
  #side .state{margin:8px 0 0;font-size:15px}
}
</style>
</head>
<body data-phase="">
<div id="app">
  <header id="top">
    <div class="where" id="where"></div>
    <div class="you" id="you"></div>
  </header>
  <div id="main">
    <section id="card"></section>
    <aside id="side"></aside>
  </div>
  <div class="job"><span id="job"></span><button id="helpBtn" type="button"></button></div>
</div>
<div id="help" hidden><div><div class="kicker" id="helpHow"></div><ol id="helpText"></ol><p id="helpStuck"></p></div><button id="helpClose" type="button"></button></div>
<div id="tag"></div>
<script src="../../vendor/firebase-app-compat.js"></script>
<script src="../../vendor/firebase-database-compat.js"></script>
<script src="../../live-config.js"></script>
<script src="live.js"></script>
<script src="face.js"></script>
<script src="cstrings.js"></script>
<script src="contest.js"></script>
<script src="contest-ui.js"></script>
</body>
</html>
