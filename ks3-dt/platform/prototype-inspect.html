<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>J2 Lesson 1 — Scene 1 prototype (K9 style gate)</title>
<!--
  THE K9 PROTOTYPE, AND WHAT IT IS NOT.

  His ruling, 15 Aug 2026: "make sure that the prototype is excellent" — Scene 1
  is built at final rendered size with its zones wired live, and goes to his
  screen for style sign-off BEFORE scenes 2-5 exist.

  This page loads the REAL style.css, the REAL engines.js and the REAL scene
  file, applies the REAL J2 Workbench theme knobs, and mounts the inspect engine
  with the exact chunk config the lesson will carry. So what he judges is what
  will ship, at the size it will ship at.

  It is deliberately NOT a built lesson. Declaring j2-01 as built would tell
  qa-harness-coverage that a lesson exists with a full coverage bill behind it,
  and that bill is not owed until after this gate. A prototype that lies to a
  gate to get itself looked at is the exact class of fault DFM 204 named.
-->
<link rel="stylesheet" href="style.css">
<style>
  body { padding: 26px 0 60px; }
  .proto-note { width: min(1000px, 96vw); margin: 0 auto 22px; color: var(--muted-d);
    font-size: 0.9rem; border-left: 3px solid var(--gold); padding-left: 14px; }
  .proto-note b { color: var(--text-d); }
</style>
</head>
<body>
<canvas id="stars"></canvas>
<div class="aurora"></div>
<div class="proto-note">
  <b>Prototype — J2 Lesson 1, Scene 1 of the Workshop Safety Inspection.</b>
  Final rendered size, zones wired live, on the J2 Workbench world.
  Flag freely, unflag freely, then file the report.
</div>
<div class="chunk-host" id="host"></div>

<script src="app.js"></script>
<script src="engines.js"></script>
<script>
/* the J2 Workbench knobs, read from the registry the platform actually ships,
   so this page cannot drift from the year world (DFM 144: one fact, one file) */
fetch('../content/themes.json').then(function (r) { return r.json(); }).then(function (reg) {
  var th = (reg.themes || []).filter(function (t) { return t.id === 'workbench'; })[0];
  App.state.year = 'j2';
  App.state.kit = App.resolveKit(reg, 'j2');
  App.state.me = { th: '', fx: '', xp: 0 };
  App.applyKit();
}).then(mount, mount);

function mount() {
  /* HIS ORDER, K17(b), 16 Aug 2026: "re-do each scene and then show me it in
     isolation for my approval before rebuilding it into the lesson."
     So this page serves ANY scene by number — ?scene=1 .. ?scene=5 — and it
     reads the REAL lesson content rather than a copy of it, so what he approves
     on this page is exactly what a pupil meets in the lesson. (The first cut of
     this file carried its own hand-typed copy of scene 1's config, which is one
     fact in two homes: the page could have drifted from the lesson and his
     approval would have been of something nobody ships. DFM 144.) */
  var n = Math.max(1, Math.min(5, Number((location.search.match(/scene=(\d+)/) || [])[1] || 1)));
  fetch('../content/j2/lessons/j2-01.json').then(function (r) { return r.json(); }).then(function (lesson) {
    var src = null;
    (lesson.chunks || []).forEach(function (c) { if (c.id === 'inspection') src = c; });
    if (!src) throw new Error('no inspection chunk in j2-01');
    var sc = (src.config.scenes || [])[n - 1];
    if (!sc) throw new Error('no scene ' + n);
    var chunk = { id: 'inspection', title: src.title, config: {} };
    Object.keys(src.config).forEach(function (k) { chunk.config[k] = src.config[k]; });
    chunk.config.scenes = [sc];
    /* skip straight to the picture: he is judging the ROOM, not the intro card */
    chunk.config.intro = 'Scene ' + n + ' of 5, shown on its own for approval. ' +
      'Everything below is the real lesson content.';
    chunk.config.introTitle = 'Scene ' + n + ' — ' + (sc.title || '');
    chunk.config.steps = null;

    var ctx = {
      chunk: chunk,
      next: function () {
        document.getElementById('host').innerHTML =
          '<div class="insp"><div class="insp-head"><h2>End of scene ' + n + '</h2>' +
          '<p class="insp-lead">In the lesson, the next scene would open here. ' +
          'Change the number in the address bar to see another one.</p></div></div>';
      },
      addXp: function () {}
    };
    Engines.inspect.mount(document.getElementById('host'), chunk, ctx);
  }).catch(function (e) {
    document.getElementById('host').innerHTML =
      '<div class="insp"><div class="insp-head"><h2>Could not load the scene</h2>' +
      '<p class="insp-lead">' + String(e && e.message || e) + '</p></div></div>';
  });
}
</script>
</body>
</html>
