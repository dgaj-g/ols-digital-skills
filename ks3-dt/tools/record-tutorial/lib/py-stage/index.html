<!doctype html><html lang="en"><head><meta charset="utf-8">
<title>Python stage</title>
<style>
/* THE PYTHON FILM STAGE (19 Aug 2026). J1's four films drive a live editor —
   MakeCode or Scratch — because the lesson IS that editor. The two Lesson 2
   films are TEXT-BASED by the spec: nothing a pupil has to be shown lives in an
   editor, so a purpose-built stage is the honest set. It renders exactly three
   things, because that is all either film needs: a Scratch block beside its
   Python twin, a program building up a line at a time, and a console printing
   what really came out. Nothing here is decorative and nothing animates on its
   own — record.js drives every beat, so a re-record is reproducible. */
:root{--navy:#0B152B;--navy2:#122040;--gold:#E4B824;--ink:#F4F6FA;--muted:#93A4C4;
      --line:#22355F;--code:#BFD8FF;--err:#FF9A8F;--ok:#8BE58B;}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1280px;height:720px;overflow:hidden;background:var(--navy);
  font-family:"Segoe UI",system-ui,-apple-system,sans-serif;color:var(--ink)}
/* THE CAPTION BAND IS RESERVED (J13g, his 27 Aug find). The lower-third caption
   is drawn at bottom:26px and stands about 100px tall, so a panel that grows into
   that strip ends up UNDER the sentence discussing it. The stage keeps its hands
   off the bottom 150px, and the output panels SCROLL instead of growing — which
   is also his other find on the same film: after "Green" was typed the console
   never scrolled, so the output the caption was discussing was off screen. */
#stage{position:relative;width:1280px;height:720px;padding:44px 88px 214px;display:flex;
  flex-direction:column;gap:20px;justify-content:center}
.eyebrow{font-size:19px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);
  font-weight:700;min-height:24px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:52px;align-items:center;min-height:250px}
.panel{background:var(--navy2);border:1px solid var(--line);border-radius:16px;padding:26px 30px}
.panel h3{font-size:16px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);
  font-weight:700;margin-bottom:16px}
#blockImg{max-width:100%;max-height:190px;display:block;margin:0 auto;image-rendering:auto}
.pyline{font-family:ui-monospace,Consolas,"Courier New",monospace;font-size:30px;
  color:var(--code);line-height:1.6;white-space:pre;letter-spacing:.01em}
#prog{display:flex;flex-direction:column;gap:10px;min-height:150px;justify-content:center;max-height:250px;overflow:hidden}
#prog .row{font-family:ui-monospace,Consolas,"Courier New",monospace;font-size:31px;
  color:var(--code);background:#0E1B36;border-left:4px solid var(--line);
  border-radius:9px;padding:11px 20px;white-space:pre;opacity:0;transform:translateY(9px);
  transition:opacity .34s ease,transform .34s ease,border-color .34s ease,background .34s ease}
#prog .row.in{opacity:1;transform:none}
#prog .row.lit{border-color:var(--gold);background:#16294F}
#prog .row.bad{border-color:var(--err);color:var(--err)}
#con{background:#060D1F;border:1px solid var(--line);border-radius:14px;padding:22px 28px;
  min-height:150px}
#con h3{font-size:15px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);
  font-weight:700;margin-bottom:12px}
#conBody{font-family:ui-monospace,Consolas,"Courier New",monospace;font-size:28px;
  line-height:1.55;white-space:pre-wrap;color:var(--ok);min-height:44px;
  max-height:150px;overflow-y:auto;scroll-behavior:smooth}
#conBody.err{color:var(--err)}
#conBody .plain{display:block;margin-top:14px;font-family:"Segoe UI",system-ui,sans-serif;
  font-size:23px;color:var(--ink);line-height:1.5}
#chat{background:#0B152B;border:1px solid var(--line);border-radius:14px;padding:22px 28px;min-height:170px}
#chat h3{font-size:15px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);
  font-weight:700;margin-bottom:14px}
#chatBody{display:flex;flex-direction:column;gap:11px;
  max-height:236px;overflow-y:auto;scroll-behavior:smooth;padding-right:6px}
#chatBody .said{font-size:27px;line-height:1.45;padding:11px 18px;border-radius:14px;max-width:78%;
  opacity:0;transform:translateY(8px);transition:opacity .3s ease,transform .3s ease}
#chatBody .said.in{opacity:1;transform:none}
#chatBody .said.bot{background:#16294F;border:1px solid #2E4A80;color:#DCE8FF}
#chatBody .said.you{background:#3A2E06;border:1px solid var(--gold);color:#FFE9A8;align-self:flex-end}
#chatBody .who{display:block;font-size:16px;letter-spacing:.08em;text-transform:uppercase;
  font-weight:700;color:var(--muted);margin-bottom:4px}
#chatWait{display:flex;align-items:center;gap:10px;margin-top:16px}
#chatWait .wbar{width:11px;height:30px;background:var(--gold);border-radius:3px}
#chatWait #waitSay{font-size:22px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);font-weight:700}
/* THE LESSON 4 FILMS (14 Sep 2026) read WHOLE ROOMS and a twelve-copy program:
   eight or nine lines, some of them long. Three additions, all opt-in, so the
   Lesson 2 and Lesson 3 films render exactly as they did:
   · a COMPACT program panel — smaller rows that wrap instead of clipping, and
     a panel that SCROLLS instead of growing into the caption band;
   · DIM rows — the road that did not run stays on screen, faded, so "these
     lines did not run" is a thing seen;
   · a SPLIT layout — the program on the left, the console or conversation on
     the right, for the chapters that read a program and show what came out. */
/* TALL: an eight-line program needs the eyebrow's row too, and the caption band
   keeps its full five-line height (a caption is drawn at bottom:26px and can
   stand 215px tall): the panel ends by 473px, the caption starts no higher
   than 481px. The eyebrow's words go into the panel label instead. */
#stage.tall{padding:30px 88px 168px;justify-content:flex-start}
#stage.tall .eyebrow{display:none}
#progPanel.compact-panel{padding:18px 26px}
#prog.compact{gap:6px;max-height:372px;overflow-y:auto;scroll-behavior:smooth;justify-content:flex-start}
#prog.compact .row{font-size:24px;line-height:1.3;padding:5px 16px;white-space:pre-wrap;word-break:break-word}
#prog .row.dim{opacity:.4}
#stage.split{display:grid;grid-template-columns:1.08fr 1fr;grid-template-rows:auto auto auto;gap:18px 26px;
  justify-content:stretch;align-content:start}
#stage.split .eyebrow{grid-column:1/-1;grid-row:1}
#stage.split #progPanel{grid-column:1;grid-row:2/span 2;align-self:start}
#stage.split #con{grid-column:2;grid-row:2;align-self:start}
#stage.split #chat{grid-column:2;grid-row:3;align-self:start}
#stage.split #con:not(.hidden)+#chat{grid-row:3}
#stage.split #chatBody{max-height:300px}
.hidden{display:none!important}
</style></head><body>
<div id="stage">
  <div class="eyebrow" id="eyebrow"></div>
  <div class="cols hidden" id="cols">
    <div class="panel"><h3 id="leftLabel">Scratch</h3><img id="blockImg" alt=""></div>
    <div class="panel"><h3 id="rightLabel">Python</h3><div class="pyline" id="pyline"></div></div>
  </div>
  <div class="panel hidden" id="progPanel"><h3 id="progLabel">Your program</h3><div id="prog"></div></div>
  <div id="con" class="hidden"><h3 id="conLabel">The console</h3><div id="conBody"></div></div>
  <!-- THE CONVERSATION (J2 Lesson 3, 27 Aug 2026). The two Lesson 2 films never
       needed one; a chatbot film needs nothing else. It is the same stage, with
       one more panel, and neither Lesson 2 film calls any of it — so both render
       exactly as they did (their scene files are untouched and qa-film-laws
       re-reads them). -->
  <div id="chat" class="hidden"><h3 id="chatLabel">The conversation</h3><div id="chatBody"></div>
    <div id="chatWait" class="hidden"><span class="wbar"></span><span class="wbar"></span><span id="waitSay">waiting for an answer</span></div>
  </div>
</div>
<script>
(function(){
  var $=function(id){return document.getElementById(id)};
  var show=function(el,on){el.classList[on?'remove':'add']('hidden')};
  function wait(ms){return new Promise(function(r){setTimeout(r,ms)})}
  window.pystage={
    ready:Promise.resolve(true),
    reset:function(){
      $('eyebrow').textContent='';show($('cols'),false);show($('progPanel'),false);
      show($('con'),false);show($('chat'),false);show($('chatWait'),false);$('stage').classList.remove('split');$('stage').classList.remove('tall');$('prog').classList.remove('compact');$('progPanel').classList.remove('compact-panel');
      $('chatBody').innerHTML='';$('prog').innerHTML='';$('conBody').textContent='';
      $('conBody').className='';$('blockImg').removeAttribute('src');$('pyline').textContent='';
    },
    eyebrow:function(t){$('eyebrow').textContent=t||''},
    pair:function(o){
      o=o||{};show($('cols'),true);
      $('leftLabel').textContent=o.leftLabel||'Scratch';
      $('rightLabel').textContent=o.rightLabel||'Python';
      if(o.img){$('blockImg').src=o.img;$('blockImg').alt=o.alt||''}
      $('pyline').textContent=o.python||'';
      return new Promise(function(res){
        var im=$('blockImg');
        if(!o.img||im.complete){res(true);return}
        im.onload=function(){res(true)};im.onerror=function(){res(false)};
      });
    },
    hidePair:function(){show($('cols'),false)},
    program:function(label,opts){opts=opts||{};show($('progPanel'),true);$('progLabel').textContent=label||'Your program';
      $('prog').innerHTML='';$('prog').classList.toggle('compact',!!opts.compact);$('prog').scrollTop=0;
      $('stage').classList.toggle('tall',!!opts.compact);$('progPanel').classList.toggle('compact-panel',!!opts.compact);},
    split:function(on){$('stage').classList.toggle('split',!!on)},
    dim:function(list){
      var rows=$('prog').querySelectorAll('.row');
      for(var k=0;k<rows.length;k++)rows[k].classList.toggle('dim',list.indexOf(k)!==-1);
    },
    undim:function(){var rows=$('prog').querySelectorAll('.row');for(var k=0;k<rows.length;k++)rows[k].classList.remove('dim')},
    /* the row the caption is about is scrolled INTO VIEW (the J13g rule again:
       a film may not discuss what it cannot show) */
    scrollProgram:function(i){var rows=$('prog').querySelectorAll('.row');if(rows[i])rows[i].scrollIntoView({block:'center'});return !!rows[i]},
    litMany:function(list){
      var rows=$('prog').querySelectorAll('.row');
      for(var k=0;k<rows.length;k++)rows[k].classList.toggle('lit',list.indexOf(k)!==-1);
      if(list.length)rows[list[0]].scrollIntoView({block:'nearest'});
    },
    addLine:async function(text){
      var d=document.createElement('div');d.className='row';d.textContent=text;
      $('prog').appendChild(d);await wait(40);d.classList.add('in');await wait(420);return true;
    },
    lit:function(i){
      var rows=$('prog').querySelectorAll('.row');
      for(var k=0;k<rows.length;k++)rows[k].classList.toggle('lit',k===i);
    },
    bad:function(i){
      var rows=$('prog').querySelectorAll('.row');
      if(rows[i])rows[i].classList.add('bad');
    },
    clearLit:function(){
      var rows=$('prog').querySelectorAll('.row');
      for(var k=0;k<rows.length;k++)rows[k].classList.remove('lit');
    },
    chatOpen:function(label){show($('chat'),true);$('chatLabel').textContent=label||'The conversation';
      $('chatBody').innerHTML='';show($('chatWait'),false);},
    say:async function(who,text,label){
      var d=document.createElement('div');d.className='said '+(who==='you'?'you':'bot');
      var w=document.createElement('span');w.className='who';w.textContent=label||(who==='you'?'The person typing':'The bot');
      var t=document.createElement('span');t.textContent=text;
      d.appendChild(w);d.appendChild(t);$('chatBody').appendChild(d);
      await wait(40);d.classList.add('in');
      /* the newest line is VISIBLY scrolled to, so a caption about it is never
         talking about something off screen (his "Green" find) */
      $('chatBody').scrollTop=$('chatBody').scrollHeight;await wait(420);return true;
    },
    waiting:function(on,say){show($('chatWait'),!!on);if(say)$('waitSay').textContent=say;},
    hideChat:function(){show($('chat'),false)},
    consoleOpen:function(label){show($('con'),true);$('conLabel').textContent=label||'The console';
      $('conBody').textContent='';$('conBody').className='';},
    print:async function(lines){
      var b=$('conBody');b.className='';b.textContent='';
      for(var i=0;i<lines.length;i++){b.textContent+=(i?'\n':'')+lines[i];b.scrollTop=b.scrollHeight;await wait(500)}
      return true;
    },
    error:function(real,plain){
      var b=$('conBody');b.className='err';b.textContent=real;
      if(plain){var s=document.createElement('span');s.className='plain';s.textContent=plain;b.appendChild(s)}
      b.scrollTop=b.scrollHeight;
    },
    /* the recorder PROVES the stage is not a blank rectangle before it trusts a
       take — the same discipline the variable-box scene uses (DFM 243's family:
       an artefact is not the artefact until it has been checked) */
    probe:function(){
      return {
        eyebrow:$('eyebrow').textContent.trim(),
        rows:$('prog').querySelectorAll('.row').length,
        console:$('conBody').textContent.trim(),
        blockLoaded:!!($('blockImg').src&&$('blockImg').complete&&$('blockImg').naturalWidth>0),
        python:$('pyline').textContent.trim(),
        said:$('chatBody')?$('chatBody').querySelectorAll('.said').length:0,
        waiting:$('chatWait')?!$('chatWait').classList.contains('hidden'):false,
        /* J13g: is the newest output actually IN VIEW, or has the panel scrolled
           past it? A film that discusses what it cannot show is the fault. */
        chatAtEnd:(function(){var b=$('chatBody');return !b||b.scrollHeight-b.scrollTop-b.clientHeight<6})(),
        conAtEnd:(function(){var b=$('conBody');return !b||b.scrollHeight-b.scrollTop-b.clientHeight<6})(),
        litInView:(function(){var p=$('prog'),r=p.querySelector('.row.lit');if(!r)return true;var a=p.getBoundingClientRect(),b=r.getBoundingClientRect();return b.top>=a.top-2&&b.bottom<=a.bottom+2})(),
        progBottom:Math.round($('progPanel').getBoundingClientRect().bottom),
        chatBottom:Math.round($('chat').getBoundingClientRect().bottom),
        conBottom:Math.round($('con').getBoundingClientRect().bottom)
      };
    }
  };
})();
</script></body></html>
